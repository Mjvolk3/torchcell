# biocypher/config/torchcell_schema_config.yaml
# [[biocypher.config.torchcell_schema_config.yaml]]
# https://github.com/Mjvolk3/torchcell/tree/main/biocypher/config/torchcell_schema_config.yaml

# Nodes
dataset:
    represented_as: node

# study:
#     represented_as: node
#     properties:
#         name: str

# source_type / title / identifier / identifier_url carry a NON-journal source (a
# dissertation, a preliminary-exam report, an in-house measurement), which has no DOI
# and no PubMed id: it is identified by title plus the deposited document's
# mirror-relative path and sha256 (Publication.identifier).
publication:
    represented_as: node
    properties:
        pubmed_id: str
        pubmed_url: str
        doi: str
        doi_url: str
        source_type: str
        title: str
        identifier: str
        identifier_url: str
        serialized_data: str

# experiment: recorded experimental observation (data record, not the process)
# Uses continuant (information content entity) rather than occurrent (activity)
# Note: The experimental procedure/plan would be modeled as "protocol" (could be activity or entity)
# study: used for collection/aggregation of multiple experiments

experiment:
    represented_as: node
    is_a: information content entity
    properties:
        serialized_data: str

experiment reference:
    represented_as: node
    is_a: information content entity
    properties:
        serialized_data: str

# interned constant: a large sub-object of an experiment record (its environment, or a
# segregant genotype) stored ONCE, content-addressed: id = sha256 of serialized_data.
# The experiment's serialized_data carries {"$ref": <id>, "kind": <field>} where the
# sub-object was; torchcell.data.neo4j_query_raw splices it back on query. Without this
# the 9.4 KB Costanzo environment was inlined into 41.4M experiment blobs (release 1.2:
# 645 of 689 GB was serialized_data). See torchcell/datamodels/interned_constant.py.
interned constant:
    represented_as: node
    is_a: information content entity
    properties:
        kind: str
        serialized_data: str

# `genome` is Biolink's own class (auto-mapped by name, no is_a). assembly_set is the
# registry id of the deposited assembly set the reference pins
# (torchcell.sequence.genome.registry: `ecoli_K12_MG1655_ASM584v2`,
# `sgd_S288C_R64-4-1_20230830`, ...), read off `AssemblyReferenceGenome.assembly_set`
# today and off every `ReferenceGenome` under P2 of the ontology unification (set or a
# typed gap, which projects null). It is the value every `perturbation.host_genome` joins
# on: one node per distinct reference (BY4741, BY4742 and S288C are three nodes), all
# pinning the one S288C set, so the join is on the set and never on `strain`.
genome:
    represented_as: node
    properties:
        species: str
        strain: str
        assembly_set: str
        serialized_data: str

# No serialized_data on genotype, segregant genotype, perturbation, crispr construct,
# environment perturbation or any phenotype class: each is a sub-object of the
# experiment record, whose full typed copy is the Experiment blob (reference-side
# phenotypes and environment perturbations: the experiment reference blob). These
# nodes carry only their queryable scalars; ids are still sha256 of the model_dump.
genotype:
    represented_as: node
    properties:
        systematic_gene_names: list
        perturbed_gene_names: list
        perturbation_types: list

# Every member of GenePerturbationType, whatever the host (ontology unification G,
# 2026-10-15; constitution principle 1: a class names a different physical thing, never
# which host the data came from). The former `bacterial perturbation` and `bacterial
# sequence variant perturbation` siblings are RETIRED: they differed from this class by
# the host alone, and choosing the label by conf left a leaf the conf did not list
# (Carruthers 2025's GeneAdditionPerturbation under the bacterial-only confs) with a
# `perturbation member of` edge and no node. One adapter method now serves the whole
# union and picks the label by leaf.
# host_genome is the deposited assembly set the record's identifiers are written against,
# in the AssemblySet vocabulary (the record's `gene_namespace`, a closed vocabulary with
# one member per deposited registry set, projected by
# cell_adapter.HOST_GENOME_OF_NAMESPACE), so `perturbation.host_genome =
# genome.assembly_set` is a value join with no hop through genotype -> experiment ->
# experiment reference <- genome. It is on every node, and it is null exactly for a
# namespace whose registry set is not an assembly (`scerevisiae_peter2018_pangenome_orf`:
# the Peter 2018 pangenome, excluded from AssemblySet by NON_ASSEMBLY_REGISTRY_SETS; no
# genome node pins it, and the blob's `gene_namespace` says which set the id is in). The
# `perturbation of genome` edge below is the optional traversal form.
# is_a: genotype, as before; Biolink's `genotype` is the closest class to an edit of a
# genome's content, and `sequence variant perturbation` is_a this class, so a served
# `MATCH (:Perturbation)` returns every perturbation of every host.
perturbation:
    is_a: genotype
    represented_as: node
    properties:
        systematic_gene_name: str
        perturbed_gene_name: str
        perturbation_type: str
        description: str
        host_genome: str
        strain_id: str

# A CALLED sequence variant (issue #731): the three VariantCallPerturbation leaves in
# schema.py (LocusVariantCallPerturbation, SiteVariantCallPerturbation,
# SpanDeletionCallPerturbation), each of which composes a BacterialVariantCall. It is a
# CHILD of `perturbation` (is_a), not a sibling: it is a perturbation that additionally
# carries the call, and the columns below (the replicon, the 1-based interval, the
# variant kind, the call frequency and whether that frequency is a clone's or a
# population's) are what a variant record is asked about and would be null on every
# other leaf, which is the argument that keeps them off the parent. No strain_id: none
# of the three leaves declares one. systematic_gene_name is a locus tag for an in-locus
# or span call and the derived site id `<replicon>:<position>` for an intergenic one,
# which is how a call that is in no gene stays out of the gene-keyed join rather than
# being attributed to a neighbor. Emitted by the same adapter method as `perturbation`
# (the label is chosen by leaf), under the same id rule (sha256 of the leaf's
# model_dump), so `perturbation member of` addresses these nodes unchanged.
# is_a: Biolink has no class for a called variant of an engineered strain that is also a
# genotype element; `perturbation` (is_a genotype) is the honest parent, and the Biolink
# chain is the parent's (genotype -> biological entity -> named thing -> entity).
sequence variant perturbation:
    is_a: perturbation
    represented_as: node
    properties:
        systematic_gene_name: str
        perturbed_gene_name: str
        perturbation_type: str
        description: str
        host_genome: str
        reference_sequence: str
        position_start: int
        position_end: int
        variant_type: str
        variant_frequency: float
        call_mode: str

# A haploid segregant of a biparental cross: a haplotype MOSAIC against two pinned
# parent assemblies (SegregantGenotype), not a list of gene perturbations. It IS a
# genotype (is_a), so genotype-level queries reach it; the gene-keyed properties of
# the plain genotype node are absent here and evaluate to null. Blocks travel in
# the Experiment blob (an interned constant).
segregant genotype:
    is_a: genotype
    represented_as: node
    properties:
        cross: str
        segregant_id: str
        parent_1: str
        parent_2: str
        n_blocks: int

# Designed gene-keyed perturbations on a segregant (or parent) background
# (PerturbedSegregantGenotype, Hale 2024): the background's cross/segregant/parents and
# the perturbations' gene lists on ONE node, so a gene-keyed query that reaches it also
# sees it is not an S288C derivative. The background mosaic is also emitted as its own
# `segregant genotype` node and joined by `segregant background of`.
perturbed segregant genotype:
    is_a: genotype
    represented_as: node
    properties:
        cross: str
        segregant_id: str
        background_role: str
        parent_1: str
        parent_2: str
        n_blocks: int
        systematic_gene_names: list
        perturbed_gene_names: list
        perturbation_types: list

# The engineered CRISPR machinery a perturbation was made with (CrisprConstruct): the
# guide spacer + the Cas effector fusion + the library sub-pool it was screened in. It
# is its OWN node class rather than extra properties on `perturbation`, because
# `perturbation` is in the served graph and adding properties to it would force a full
# rebuild; a new class is additive. Without it the effector, spacer and pool of every
# CRISPRi/CRISPRa/CRISPRd record are reachable only by parsing serialized_data.
# is_a: a class BioCypher cannot find in Biolink (3.2.1 is its pinned head ontology)
# needs an is_a to a Biolink class or the ontology build raises before the first node
# is written (rehearsal job 1956, 2026-09-14); a guide + effector plasmid is a nucleic
# acid entity there.
crispr construct:
    is_a: nucleic acid entity
    represented_as: node
    properties:
        effector: str
        guide_sequence: str
        n_guides: int
        library_pool: str
        effector_plasmid_ref: str
        effector_plasmid_sha256: str

environment:
    is_a: environmental exposure
    represented_as: node
    properties:
        temperature: str
        media: str
        serialized_data: str

media:
    is_a: environmental exposure
    represented_as: node
    properties:
        name: str
        state: str
        serialized_data: str

temperature:
    is_a: environmental exposure
    represented_as: node
    properties:
        value: float
        unit: str
        serialized_data: str

# The environment axis of perturbation: an added compound (small molecule), a physical
# factor, or a biologic agent, content-addressed like a gene perturbation. Compound and
# concentration are projected for small molecules; the typed record is in the Experiment
# blob (inside its environment).
environment perturbation:
    is_a: environmental exposure
    represented_as: node
    properties:
        perturbation_type: str
        description: str
        factor: str
        compound_name: str
        inchikey: str
        concentration_value: float
        concentration_unit: str

# A bacteriophage challenge (PhagePerturbation): the environment axis of a phage-
# resistance screen, content-addressed like the other environment perturbations. It is
# its OWN class rather than a row of `environment perturbation` because the dose is not
# a concentration: the MOI, the phage's taxon and accession are its columns, and they
# cannot ride the `concentration_value` / `concentration_unit` columns without making a
# particle-to-cell ratio look like a dose. Emitted by the same `environment perturbation
# (chunked)` method as its sibling, the label chosen by leaf (ontology unification G).
# is_a: Biolink defines `environmental exposure` as abiotic ("factor relating to abiotic
# processes in the environment"), while `biotic exposure` is "an intake of (sometimes
# pathological) biological organisms (including viruses)" and carries `viral exposure` as
# an altLabel. The two are SIBLINGS under `exposure event`, so a phage node does not
# carry the `EnvironmentalExposure` label and no served query over that label changes.
# Same id rule as `environment perturbation` (the composition projection in
# torchcell.datamodels.identity), so `environment perturbation member of` addresses these
# nodes unchanged.
phage perturbation:
    is_a: biotic exposure
    represented_as: node
    properties:
        perturbation_type: str
        description: str
        phage_name: str
        ncbi_taxid: int
        genome_accession: str
        multiplicity_of_infection: float
        titer_pfu_per_ml: float

# TODO expand out to include different phenotypes.
# PHENOTYPES START
# fitness and gene interaction phenotypes project screen_id, the screen a measurement
# came from when one source releases a (genotype, environment) from two screens
# (Kuzmin 2020 Table S1 main vs Table S3 pilot screens, issue #602).
fitness phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        fitness: float
        fitness_std: float
        screen_id: str

# gene interaction phenotype also projects the replicate-design quartet (#793): a
# sourced eight-colony design (Babu 2014) and a per-record measured colony count
# (Butland 2008) are queryable properties of the score rather than a file beside the
# build. Added with a FULL rebuild, never an increment: incremental import cannot
# update the nodes the yeast interaction datasets already wrote.
gene interaction phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        gene_interaction: float
        gene_interaction_p_value: float
        screen_id: str
        n_samples: int
        sample_unit: str
        gene_interaction_uncertainty: float
        gene_interaction_uncertainty_type: str

gene essentiality phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        is_essential: bool
        evidence: str

# A categorical essentiality call stored as released (GradedGeneEssentialityPhenotype,
# #909): Royet 2025's TRANSIT HMM states, Goodall 2018's "unclear" TraDIS calls.
graded gene essentiality phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        essentiality_call: str
        evidence: str

synthetic lethality phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        is_synthetic_lethal: bool
        synthetic_lethality_statistic_score: float

synthetic rescue phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        is_synthetic_rescue: bool
        synthetic_rescue_statistic_score: float

calmorph phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        calmorph: str
        calmorph_coefficient_of_variation: str

microarray expression phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        expression_log2_ratio: str
        expression_log2_ratio_se: str

# --- begin #1022: the error-model microarray score family ---
# A two-color microarray release that carries a per-gene error-model score and its
# p-value in place of a log ratio (MicroarrayExpressionScorePhenotype; Hu 2007 GSE4654).
# The per-gene dicts serialize to JSON strings, the multi-valued phenotype convention;
# every property is named by its field so the phenotype <-> node class bijection
# (torchcell/datamodels/ontology_checks.py) matches it without an alias table.
microarray expression score phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        expression_score: str
        expression_score_p_value: str
        measurement_type: str
        reference_basis: str
        array_platform: str
        n_replicates: int
        harvest_optical_density: float
# --- end #1022 ---

# --- begin #989: the ratio-only microarray leaf ---
# A two-channel release that carries only the per-gene log2 ratio against a reference it
# names (MicroarrayExpressionRatioPhenotype; Gasch 2000). A sibling of the two classes
# above under the pydantic parent TwoChannelMicroarrayExpressionPhenotype, which is not a
# graph class: making it one would change the served class's is_a and its node labels.
# Every property is named by its field (the phenotype <-> node class bijection).
microarray expression ratio phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        expression_log2_ratio: str
        measurement_type: str
        reference_basis: str
        array_platform: str
        n_replicates: str
# --- end #989 ---

# One array of an induction time course (InductionTimecourseExpressionPhenotype, Hackett
# 2020 IDEA): the cleaned log2 ratio vs the same culture at t = 0 with the authors' noise
# SD, the shrunken layer the paper's analyses use, and the release's identity of the
# time course. Each dict is a JSON string (the multi-valued convention); the channel
# intensities and the unprocessed, thresholded and selected layers travel in the
# experiment blob only.
induction timecourse expression phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        log2_cleaned: str
        log2_noise_sd: str
        log2_shrunken: str
        timecourse_id: str
        strain_label: str
        experiment_date: str
        release_table: str

rnaseq expression phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        expression_tpm: str
        measurement_type: str
        n_mapped_reads: int

# Single-cell Perturb-seq collapsed to pseudobulk per genotype (Nadal-Ribelles 2025):
# per-gene log2 fold-change vs the same-condition WT as a JSON string, plus the two
# per-genotype single-cell scalars (dispersion, n_cells) kept typed for querying.
pseudobulk expression phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        expression_log2_ratio: str
        dispersion: float
        n_cells: int
        measurement_type: str

visual score phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        visual_score: float
        n_replicates: int
        target_product: str
        target_metabolite_id: str

metabolite phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        metabolite_level: str
        metabolite_level_se: str
        measurement_type: str

protein abundance phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        protein_abundance: str
        protein_abundance_se: str
        measurement_type: str

# --- begin #770: the protein fold-change family ---
# Per-protein RELATIVE abundance against a control strain (ProteinFoldChangePhenotype),
# the sibling of protein abundance on the relative axis. Every dict keyed by protein id
# is a JSON string, as for protein abundance; fold_change_scale and reference_basis are
# the two scalars that make two columns comparable, and the two p-value maps are the
# per-protein significance the absolute class has no field for.
protein fold change phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        protein_fold_change: str
        protein_fold_change_se: str
        protein_fold_change_p_value: str
        protein_fold_change_p_value_adjusted: str
        p_value_adjustment_method: str
        fold_change_scale: str
        reference_basis: str
        n_replicates: str
        measurement_type: str
# --- end #770 ---

# A strain's signed growth/fitness RESPONSE in a perturbed environment
# (EnvironmentResponsePhenotype): chemogenomic screens and the segregant growth
# panels. measurement_type = WHAT the number is, assay_type = HOW it was measured.
# A categorical or ordinal screen has no number at all, so category (the shared
# ResponseCategory axis) and category_label (the source's own word) are projected
# too, else such a dataset is queryable only by parsing serialized_data. screen_id
# names the screening run, which is what separates two independent screens of the
# same compound at the same dose.
# environment response phenotype also projects the two-sided confidence interval and
# the per-replicate id (#776): an asymmetric interval (Caglar 2017 Table S5, asymmetric
# in 55 of 55 rows) has no half-width, so storing it needs both limits plus the level,
# and a release that is one row per replicate curve needs the replicate id to stay
# L1-unique. Added with a FULL rebuild, never an increment.
# It also projects the released test of the response (#863): the unadjusted and the
# adjusted p-value plus the correction's name, scalar because a record holds one
# response (Wang 2024 Table S2's TRANSIT p-value and Adj. p-value). Added with a FULL
# rebuild, never an increment.
# And the released test statistic (Wetmore 2015's own release): RB-TnSeq's moderated t,
# stored because the release states it. Added with a FULL rebuild, never an increment.
# And the released Z score (#879): Wang 2018's equation (4) on the guide and the gene
# level. A rescaling of the response the source states, never an uncertainty. Added
# with a FULL rebuild, never an increment.
environment response phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        environment_response: float
        environment_response_se: float
        measurement_type: str
        assay_type: str
        category: str
        category_label: str
        screen_id: str
        environment_response_lower: float
        environment_response_upper: float
        confidence_level: float
        replicate_id: str
        environment_response_p_value: float
        environment_response_p_value_adjusted: float
        p_value_adjustment_method: str
        environment_response_t_statistic: float
        environment_response_z_score: float

# How much of a named product a strain made (ProductTiterPhenotype). Every field but
# provenance_gaps is projected: enums as their value, and the product, a typed
# Compound, as the JSON of its model_dump (name, InChIKey, ChEBI, PubChem, SMILES),
# the same JSON-string convention the dict-valued phenotypes use. A property is named
# by its field so the phenotype <-> node class bijection
# (torchcell/datamodels/ontology_checks.py) matches it without an alias table.
product titer phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        product: str
        titer: float
        titer_unit: str
        titer_se: float
        titer_uncertainty: float
        titer_uncertainty_type: str
        n_samples: int
        sample_unit: str
        product_yield: float
        product_yield_unit: str
        productivity: float
        productivity_unit: str
        quantification_method: str
        # --- begin #867: a below-detection titer is a bound, not a zero ---
        titer_censoring: str
        # --- end #867 ---

# Per-protein turnover rates (ProteinTurnoverPhenotype): every dict keyed by locus tag
# is a JSON string, as for protein abundance; measurement_type carries the time unit.
protein turnover phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        degradation_rate: str
        degradation_rate_se: str
        half_life: str
        synthesis_rate: str
        n_replicates: str
        measurement_type: str
        # --- begin #753: the published interval and the censoring flag ---
        degradation_rate_lower: str
        degradation_rate_upper: str
        confidence_level: float
        interval_method: str
        censoring: str
        # --- end #753 ---

# --- begin #857: the protein synthesis-rate family ---
# Per-protein synthesis rates with no degradation (ProteinSynthesisRatePhenotype): every
# dict keyed by locus tag is a JSON string, as for protein turnover; rate_unit is the
# typed amount and time basis, and generation_time_minutes is the basis of a rate per
# generation. Every field but provenance_gaps is projected, named by its field.
protein synthesis rate phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        synthesis_rate: str
        synthesis_rate_se: str
        n_replicates: str
        rate_unit: str
        generation_time_minutes: float
        measurement_type: str
        censoring: str
# --- end #857 ---

# --- begin #921: the phosphosite intensity family ---
# Per-site phosphopeptide precursor intensity in one sample
# (PhosphositeIntensityPhenotype): the three dicts keyed by site key
# (<proteins>|<residue>|<positions>) are JSON strings, the sites' identification
# records as the JSON of their model_dump; the sample's enums as their value. Every
# field but provenance_gaps is projected, named by its field.
phosphosite intensity phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        phosphosite_intensity: str
        quantification: str
        sites: str
        measurement_type: str
        sample_label: str
        replicate: int
        replicate_unit: str
        harvest_growth_phase: str
        harvest_optical_density: float
# --- end #921 ---

# A fitted net-flux map (FluxPhenotype): signed per-reaction fluxes and their
# confidence bounds as JSON strings; confidence_level and n_samples are scalars of the
# whole fit. label_statistic_name is null by design (an interval is not one number).
flux phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        net_flux: str
        net_flux_lower: str
        net_flux_upper: str
        confidence_level: float
        measurement_type: str
        n_samples: int
        sample_unit: str
        target_reaction_ids: str
        # #800 (Li 2021): the released exchange fluxes of reversible reactions.
        exchange_flux: str
        exchange_flux_lower: str
        exchange_flux_upper: str

# Transcription from ONE promoter read through a reporter fusion
# (PromoterActivityPhenotype). Every field but provenance_gaps is projected, enums as
# their value and every value a scalar: this family has no dict-valued field, because a
# record measures one promoter rather than a profile. promoter_gene is the join key to
# the gene node and is null when the source label names no single gene. A property is
# named by its field so the phenotype <-> node class bijection
# (torchcell/datamodels/ontology_checks.py) matches it without an alias table.
promoter activity phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        promoter_activity: float
        promoter_activity_se: float
        promoter_activity_uncertainty: float
        promoter_activity_uncertainty_type: str
        n_samples: int
        sample_unit: str
        promoter_name: str
        promoter_gene: str
        readout: str
        reporter_gene: str
        activity_units: str
        well_id: str
# --- begin #991: the pooled sort-seq expression family ---
# Expression of ONE pooled-library sequence, estimated from its reads across the sort
# bins (PooledSortSeqExpressionPhenotype; Vaishnav 2022). A SIBLING of `promoter
# activity phenotype`, not a reuse: that class is served (Mohiuddin 2022) and its
# required well_id is its identity rule, which a pooled library cannot supply.
# sequence_id is the identity key in a well's place, read_count the release's own
# measure of how well determined the estimate is, and library_id the sort it belongs to
# (null when unreleased). Every property is named by its field so the phenotype <-> node
# class bijection (torchcell/datamodels/ontology_checks.py) matches it without an alias
# table.
pooled sort seq expression phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        expression_level: float
        expression_level_se: float
        expression_level_uncertainty: float
        expression_level_uncertainty_type: str
        n_samples: int
        sample_unit: str
        sequence_id: str
        library_id: str
        read_count: int
        readout: str
        reporter_gene: str
        expression_units: str
# --- end #991 ---

# --- begin #990: the biosensor fluorescence family ---
# A biosensor reporter's signal, standing for the metabolite it senses
# (BiosensorFluorescencePhenotype; Zhang 2020's trpR-GFP device reports intracellular
# tryptophan, not the five varied promoters). sensed_metabolite projects the typed
# Compound's name, the same spelling the environment lane's compounds carry, so a query
# joins a sensed metabolite to the compound layer without the phenotype composing a
# medium. A SIBLING of `metabolite phenotype`: that class holds a metabolite QUANTITY,
# while this one holds a proxy signal in its own units.
biosensor fluorescence phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        biosensor_signal: float
        biosensor_signal_se: float
        biosensor_signal_uncertainty: float
        biosensor_signal_uncertainty_type: str
        n_samples: int
        sample_unit: str
        sensed_metabolite: str
        sensor_name: str
        reporter_gene: str
        readout: str
        signal_units: str
# --- end #990 ---

# A bacterial strain's cell-morphology profile from one microscopy assay
# (BacterialMorphologyPhenotype, issue #774). The dict-valued fields serialize to JSON
# strings, the CalMorph convention; `assay` names the vocabulary the keys belong to, so a
# query can tell a Campos symbol from a later screen's symbol of the same name. A
# property is named by its field so the phenotype <-> node class bijection
# (torchcell/datamodels/ontology_checks.py) matches it without an alias table.
bacterial morphology phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        assay: str
        morphology: str
        morphology_coefficient_of_variation: str
        n_samples: int
        sample_unit: str
# A count-less transcriptome (MrnaNumberFractionPhenotype, issue #854): each gene's share
# of the cell's mRNA molecules, released without the read counts behind it. The per-gene
# dict serializes to a JSON string, the multi-valued phenotype convention. A property is
# named by its field so the phenotype <-> node class bijection
# (torchcell/datamodels/ontology_checks.py) matches it without an alias table.
mrna number fraction phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        mrna_number_fraction: str
        n_libraries: int
        measurement_type: str
# Single-cell UMI counts summed over a genotype's cells (SingleCellExpressionPhenotype:
# Boocock 2025 segregants, Jackson 2020 deletion strains, N'Guessan 2025; one node class
# since #1016): nonzero counts only, against a pinned feature universe, with the cassette
# markers apart from the genes and the summed cells' barcodes, libraries and totals. Each
# dict and list serializes to a JSON string (a gapped field is JSON null), the
# multi-valued phenotype convention; every property is named by its field.
single cell expression phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        umi_count: str
        marker_umi_count: str
        total_umis: int
        n_features: int
        feature_universe_sha256: str
        n_cells: int
        cell_cycle_stage_counts: str
        library_cell_counts: str
        cell_barcodes: str
        cell_libraries: str
        cell_total_umis: str
        measurement_type: str
# A culture's life-cycle time course (LifeCyclePhenotype, De Chiara 2022): sporulation
# efficiency, dyad fraction and stationary-phase viability as percentages keyed by
# '<measurement type>@<time><h|d>'. The keyed dict serializes to a JSON string, the
# multi-valued phenotype convention; every field is one declared property.
life cycle phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        life_cycle: str
        assay: str
        n_samples: int
        sample_unit: str
        cells_per_sample: int
        cells_per_sample_is_minimum: bool

# ADDITIVE (Puddu 2019 genome architecture): the realized genome content of one
# sequenced sample. The two maps are JSON strings keyed by the assay's own symbols, so
# `assay` must travel with them: a key's unit basis is declared by the assay, never by
# the key's spelling.
genome architecture phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        assay: str
        genome_architecture: str
        genome_architecture_sd: str
        uncertainty_type: str
        n_samples: int
        sample_unit: str
        sample_id: str
        sample_accession: str
# A released significance test of one gene's fitness between two culture arms
# (FitnessContrastPhenotype, issue #913: Borchert 2023's t, p, pFDR q and adjusted q).
# Every field but provenance_gaps is a scalar property named by its field.
fitness contrast phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        measurement_type: str
        test_name: str
        contrast_label: str
        t_statistic: float
        p_value: float
        q_value: float
        q_value_method: str
        q_value_adjusted: float
        q_value_adjustment_method: str
        n_replicates_condition: int
        n_replicates_reference: int
# PHENOTYPES END

# RELATIONSHIPS
# Two sources (a segregant genotype IS a genotype but is its own node class), so
# BioCypher builds one virtual leaf per source and needs input_label: with a list
# source and no input_label, OntologyMapping._horizontal_inheritance_source zips a
# None and the build dies before the first node is written (rehearsal job 1953,
# 2026-09-14). The label is the adapter's relationship_label, broadcast to both leaves.
genotype member of:
    is_a: participates in
    represented_as: edge
    input_label: genotype member of
    source: [genotype, segregant genotype, perturbed segregant genotype]
    target: experiment

# Two sources (`sequence variant perturbation` is its own node class under
# `perturbation`), so input_label is required for the same reason as on `genotype
# member of`. The adapter's relationship_label is unchanged ("perturbation member of"),
# so the served PerturbationMemberOf edges keep their type.
perturbation member of:
    is_a: genetically associated with
    represented_as: edge
    input_label: perturbation member of
    source: [perturbation, sequence variant perturbation]
    target: genotype

# The host genome a perturbation is written against (ontology unification G): the
# traversal form of `perturbation.host_genome`, OPTIONAL and off in every conf. The
# property is the mandatory join key; this edge adds one row per perturbation per
# record, the order of `perturbation member of` (47.3 M rows in 124 of 170 adapters of
# the job 4901 partial, review 3 finding 9), so a conf opts in by listing
# `perturbation to genome (chunked)` and the first build that does measures the cost. No
# edge is written for a perturbation whose host_genome is null (the pangenome ORFs).
# is_a: Biolink's `is sequence variant of` "holds between a sequence variant and a
# nucleic acid entity" (3.2.1 definition; domain sequence variant, range genomic
# entity): a perturbation is an edit to the host's genomic content stated against that
# genome's deposited sequence, and `genome` is a genomic entity. Neither `located in`
# (defined between material entities) nor `part of` (the genome does not contain the
# edit) says that. input_label for the two-source reason above.
perturbation of genome:
    is_a: is sequence variant of
    represented_as: edge
    input_label: perturbation of genome
    source: [perturbation, sequence variant perturbation]
    target: genome

# The background mosaic a perturbed segregant genotype was built on (Hale 2024): one
# `segregant genotype` node per segregant, shared by every perturbation measured on it.
segregant background of:
    is_a: part of
    represented_as: edge
    source: segregant genotype
    target: perturbed segregant genotype

# Every CRISPR leaf of every host is a `perturbation` node (the retired `bacterial
# perturbation` target folded into it), so the construct edge has the one target; the
# `sequence variant perturbation` child carries no construct.
crispr construct member of:
    is_a: part of
    represented_as: edge
    source: crispr construct
    target: perturbation

environment member of:
    is_a: participates in
    represented_as: edge
    source: environment
    target: [experiment, experiment reference]

# If you have multiple sources you must specify the input_label type
phenotype member of:
    is_a: participates in
    represented_as: edge
    input_label: phenotype
    source:
        [
            fitness phenotype,
            gene essentiality phenotype,
            graded gene essentiality phenotype,
            synthetic lethality phenotype,
            synthetic rescue phenotype,
            gene interaction phenotype,
            calmorph phenotype,
            microarray expression phenotype,
            microarray expression score phenotype,
            microarray expression ratio phenotype,
            induction timecourse expression phenotype,
            rnaseq expression phenotype,
            pseudobulk expression phenotype,
            visual score phenotype,
            metabolite phenotype,
            protein abundance phenotype,
            protein fold change phenotype,
            environment response phenotype,
            product titer phenotype,
            protein turnover phenotype,
            protein synthesis rate phenotype,
            phosphosite intensity phenotype,
            flux phenotype,
            promoter activity phenotype,
            pooled sort seq expression phenotype,
            biosensor fluorescence phenotype,
            bacterial morphology phenotype,
            mrna number fraction phenotype,
            single cell expression phenotype,
            life cycle phenotype,
            genome architecture phenotype,
            fitness contrast phenotype,
        ]
    target: [experiment, experiment reference]

media member of:
    is_a: part of
    represented_as: edge
    source: media
    target: environment

temperature member of:
    is_a: part of
    represented_as: edge
    source: temperature
    target: environment

# Two sources since `phage perturbation` joined, so input_label is required (with a list
# source and no input_label, OntologyMapping._horizontal_inheritance_source zips a list
# against a string and builds one leaf per CHARACTER). The adapter's relationship label
# is unchanged, so the written type stays EnvironmentPerturbationMemberOf. Both node
# classes are emitted by the one `environment perturbation (chunked)` method, which
# chooses the label by leaf (ontology unification G), so a conf cannot enable the edge
# for a leaf no lane serves.
environment perturbation member of:
    is_a: part of
    represented_as: edge
    input_label: environment perturbation member of
    source: [environment perturbation, phage perturbation]
    target: environment

genome member of:
    is_a: participates in
    represented_as: edge
    source: genome
    target: experiment reference

# publication mentions experiment:
# Edge renamed to avoid name collision with Biolink's "mentions" predicate
publication mentions experiment:
    is_a: mentions
    represented_as: edge
    source: publication
    target: experiment

# Experiments are data records (continuants), so they are components/parts of dataset collections
experiment reference member of:
    is_a: part of
    represented_as: edge
    source: experiment reference
    target: dataset

experiment member of:
    is_a: part of
    represented_as: edge
    source: experiment
    target: dataset

experiment reference of:
    is_a: coexists with
    represented_as: edge
    source: experiment reference
    target: experiment
