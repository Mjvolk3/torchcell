# Wang 2015 Table S3's no-isoprenol column: 46 records, BacterialFitnessExperiment
# carrying the plain-2YT OD600 of each Keio deletion over BW25113's (#826). One
# BacterialDeletionPerturbation per record, served as `bacterial perturbation`, so the
# perturbation pair is enabled. Every record and the reference carry the medium's pH as
# an EnvironmentPhysicalPerturbation, so the environment-perturbation pair is enabled
# too; the isoprenol SmallMoleculePerturbation of the sibling EnvChemgenWang2015Dataset
# is ABSENT here, because this is the plain-medium arm.
cell_adapter:
  node_methods:
    - method_name: "experiment reference"
    - method_name: "genome"
    - method_name: "experiment (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "genotype (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "bacterial perturbation (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "environment (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "environment reference"
    - method_name: "media (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "media reference"
    - method_name: "temperature (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "temperature reference"
    - method_name: "environment perturbation (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "environment perturbation reference"
    - method_name: "fitness phenotype (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "fitness phenotype reference"
    - method_name: "dataset"
    - method_name: "publication (chunked)"
      memory_reduction_factor: 1.0

  edge_methods:
    - method_name: "experiment reference to dataset"
    - method_name: "experiment to dataset (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "experiment reference to experiment (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "genotype to experiment (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "perturbation to genotype (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "environment to experiment (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "environment to experiment reference"
    - method_name: "phenotype to experiment (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "media to environment (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "temperature to environment (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "environment perturbation to environment (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "environment perturbation to environment reference"
    - method_name: "genome to experiment reference"
    - method_name: "phenotype to experiment reference"
    - method_name: "publication to experiment (chunked)"
      memory_reduction_factor: 1.0
