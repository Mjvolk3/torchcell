# experiments/025-solid-growth/conf/cgt_s0_q_kl_004.yaml
#
# ARM S0/Q/KL -- the 010 mechanism (soft KL on layer 1, all nine heads) on the
# QUERY-PAIR-DISJOINT split. Identical to cgt_s0_r_kl_000 except for the split file and
# its key, and for `transforms.fit_on: train`: the label normalizer's mean and sd come
# from this arm's 301,236 training records rather than from all 376,732 triples, so no
# validation or test label reaches the two constants (the one comparability mismatch
# notes-tex/010-additive-baselines records against 010). Pearson is invariant to those
# constants; the additive baselines on this same split use the training mean only. This is the arm that answers whether the transformer's accuracy survives holding
# out whole Kuzmin screens; cgt_s0_q_mask_002 cannot, because the hard-mask arm collapses
# to the label mean on the RANDOM split already (jobs 1602, 1606, 1607), so its disjoint
# result carries no information about the split.
#
# Read it against cgt_s0_r_kl_000 (job 1598: val Pearson 0.446 at epoch 14), and against the
# additive baselines on the SAME kind of split: B1 ridge 0.174 on one disjoint split, 0.127
# +/- 0.033 over five folds (notes-tex/010-additive-baselines, Table 10). The 025 disjoint
# artifact is a different partition from 010's (331/43/46 query pairs vs 285/67/68), so the
# comparison is like-for-like in kind, not in the held-out screens.
#
# ARM S0/R/KL -- the REPLICATION. Reproduce 010's trigenic result on the 025 build,
# so that everything the ladder later reports rests on a data path known to give the
# same answer as the build it replaces.
#
# The model half is `experiments/010-kuzmin-tmi/conf/equivariant_cell_graph_transformer_cabbi_002.yaml`
# copied VERBATIM. Nothing about the architecture, loss, optimizer, schedule, or
# regularization is improved here, including two things that are known to be wrong (see
# graph_regularization below). Changing any of them would make a disagreement with 010
# uninterpretable, which is the one thing this arm exists to rule out.
#
# What is new is the arm definition, because 025 is 13,525,071 records over three
# perturbation orders and two labels where 010 was 376,732 records over one of each:
#   subset.indices    -> the 376,732 trigenic triples (S0)
#   subset.split_file -> 010's own train/val/test, carried across by genotype identity
#   phenotype_labels  -> gene_interaction alone
#   fit_on: train     -> normalize by the mean and sd of the arm's TRAINING records only
#
# Reference to beat, from the three 010 checkpoints: val Pearson 0.4520 / 0.4472 / 0.4619.
defaults:
  - default
  - _self_

wandb:
  project: torchcell_025-solid-growth_equivariant_cell_graph_transformer
  tags: [s0, split_Q, graph_reg_kl, query_pair_disjoint]

# === Arm: which records train, and how they split ===
# Artifacts are committed under experiments/025-solid-growth/results/ and are read by
# `load_index_artifact`; `split_key` names the field holding the three lists because the
# R and Q artifacts store them under different names.
subset:
  indices: subset_S0_indices.json.gz
  split_file: query_pair_disjoint_splits_025.json.gz
  split_key: splits

cell_dataset:
  graphs: [
      physical,
      regulatory,
      tflink,
      string12_0_neighborhood,
      string12_0_fusion,
      string12_0_cooccurence,
      string12_0_coexpression,
      string12_0_experimental,
      string12_0_database,
    ]

  # Transformer uses learned gene embeddings, not pre-computed
  node_embeddings: []

  # 025 carries fitness AND gene_interaction; 010 carried only the latter. Without this
  # selection a triple yields two values and a batch of B records carries 2B targets,
  # which the single-task RegressionTask reads as its label vector.
  phenotype_labels: [gene_interaction]

# Transform configuration
transforms:
  use_transforms: true
  fit_on: train
  forward_transform:
    normalization:
      gene_interaction:
        strategy: "standard" # Options: standard, minmax, robust

profiler:
  enabled: false
  is_pytorch: true

data_module:
  is_perturbation_subset: false
  perturbation_subset_size: 10000
  batch_size: 256  # Limited by transformer memory requirements
  num_workers: 16
  pin_memory: true
  prefetch: false
  prefetch_factor: 4
  persistent_workers: true

trainer:
  max_epochs: 600  # 010's budget; the 12 h wall clock is what actually ends this run
  strategy: ddp
  num_nodes: 1
  accelerator: gpu
  devices: 4
  overfit_batches: 0
  precision: "bf16-mixed"

compile_mode: null

model:
  checkpoint_path: null
  gene_num: 6607
  hidden_channels: 180
  num_transformer_layers: 8
  num_attention_heads: 9
  dropout: 0.1

  learnable_embedding:
    enabled: true
    size: ${model.hidden_channels}
    preprocessor:
      num_layers: 2
      dropout: 0.1

  # Hard graph masking is OFF in this arm. It is the intended replacement for the KL
  # (see cgt_s0_r_mask_001), but a replication that swapped the graph mechanism would be
  # comparing two changes at once.
  attention_mask:
    enabled: false

  # === Graph regularization: COPIED FROM 010 ===
  #
  # `physical` and `regulatory` are the graph builder's names; `to_cell_data` emits
  # `physical_interaction` and `regulatory_interaction`. Since 2026-07-31 the model keys
  # every adjacency by both the suffixed relation and its bare stem, and RAISES on a name
  # it cannot match, so all nine heads of layer 1 carry their graph here (an earlier
  # comment claiming heads 0 and 1 went unregularized was wrong for this code). That
  # layer has no free head, as in 010.
  #
  # What differs from the 010 runs is the SIZE of the penalty, not its coverage: the 010
  # edge normalization summed `len(A.nonzero()[0])` to 18 and multiplied the per-graph
  # weight by 367, so the graph term was 99.99 percent of the objective; that was fixed
  # before these arms ran and job 1598 shows the term at about a third of the objective
  # (notes-tex/010-additive-baselines, the penalty-versus-loss figure).
  graph_regularization:
    graph_reg_lambda: 0.001
    graph_reg_layer: 1 # python indexed

    row_sampling_rate: 1.0

    regularized_heads:
      physical:
        layer: ${model.graph_regularization.graph_reg_layer}
        head: 0
        lambda: ${model.graph_regularization.graph_reg_lambda}
      regulatory:
        layer: ${model.graph_regularization.graph_reg_layer}
        head: 1
        lambda: ${model.graph_regularization.graph_reg_lambda}
      tflink:
        layer: ${model.graph_regularization.graph_reg_layer}
        head: 2
        lambda: ${model.graph_regularization.graph_reg_lambda}
      string12_0_neighborhood:
        layer: ${model.graph_regularization.graph_reg_layer}
        head: 3
        lambda: ${model.graph_regularization.graph_reg_lambda}
      string12_0_fusion:
        layer: ${model.graph_regularization.graph_reg_layer}
        head: 4
        lambda: ${model.graph_regularization.graph_reg_lambda}
      string12_0_cooccurence:
        layer: ${model.graph_regularization.graph_reg_layer}
        head: 5
        lambda: ${model.graph_regularization.graph_reg_lambda}
      string12_0_coexpression:
        layer: ${model.graph_regularization.graph_reg_layer}
        head: 6
        lambda: ${model.graph_regularization.graph_reg_lambda}
      string12_0_experimental:
        layer: ${model.graph_regularization.graph_reg_layer}
        head: 7
        lambda: ${model.graph_regularization.graph_reg_lambda}
      string12_0_database:
        layer: ${model.graph_regularization.graph_reg_layer}
        head: 8
        lambda: ${model.graph_regularization.graph_reg_lambda}

  perturbation_head:
    num_heads: 9  # Must divide hidden_channels (180/9=20)
    dropout: 0.1

regression_task:
  loss:
    type: "point_dist_graph_reg"

    point_estimator:
      type: "mse"
      lambda: 1.0

    distribution_loss:
      type: "wasserstein"
      lambda: 0.1

      wasserstein_blur: 0.05
      wasserstein_p: 2
      wasserstein_scaling: 0.9
      min_samples_for_wasserstein: 512

    graph_regularization:
      lambda: 1.0

    supervised_contrastive:
      lambda: 0.0

    buffer:
      use_buffer: false

    ddp:
      use_ddp_gather: false

  execution_mode: "training"

  optimizer:
    type: "AdamW"
    lr: 1e-4
    weight_decay: 1e-8

  lr_scheduler:
    type: "CosineAnnealingWarmupRestarts"
    first_cycle_steps: 30
    cycle_mult: 1.0
    max_lr: 5e-4
    min_lr: 1e-7
    warmup_steps: 1
    gamma: 0.70

  clip_grad_norm: true
  clip_grad_norm_max_norm: 10.0
  grad_accumulation_schedule: null
  plot_sample_ceiling: 10000
  plot_every_n_epochs: 1
  plot_transformer_diagnostics_every_n_epochs: 10
  plot_edge_recovery_every_n_epochs: 10
