    taxon_query: Gallus gallus
    preferred_strain: reference
    groups: [outgroup]
    source: ncbi
    accession: GCF_016699485.2
    accession_choice: NCBI reference assembly bGalGal1.mat.broiler.GRCg7b.
    justification: >-
      Peris's amniote outgroup; bounds "within mammals" from outside.
