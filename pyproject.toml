# pyproject.toml

[build-system]
requires = ["setuptools>=69.0.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchcell"
version = "1.6.2"
description = "Provenance-first experimental data for the S. cerevisiae virtual cell: sha256-pinned dataset loaders, a knowledge graph, and models"
readme = "README.md"
authors = [{ name = "Michael Volk", email = "michaeljvolk7@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["yeast", "S. cerevisiae", "genotype-phenotype", "knowledge graph", "pytorch", "systems biology"]
# dependencies = []
# Floor tracks the torch / torch_geometric stack we run (env is 3.13.0);
# backwards compatibility with older interpreters is a non-goal.
requires-python = ">=3.13"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "semantic-release",
    "pip-tools",
    "pytest",
    # "biocypher@git+https://github.com/Mjvolk3/biocypher@main", won't work
    # "calm@git+https://github.com/oxpig/CaLM@main",
]

[project.urls]
Homepage = "https://github.com/Mjvolk3/torchcell"
Documentation = "https://mjvolk3.github.io/torchcell/"
Database = "https://torchcell-database.ncsa.illinois.edu:7473/browser/"
Issues = "https://github.com/Mjvolk3/torchcell/issues"

[project.scripts]
torchcell = "torchcell.__main__:main"
tcdb = "torchcell.database.tcdb:main"
tc-lit-server = "torchcell.literature.server:main"
tc-lit-backfill = "torchcell.literature.backfill:main"
tc-data-server = "torchcell.datasets.server:main"

[tool.pyright]
include = ["torchcell", "experiments"]
venvPath = "/Users/michaelvolk/miniconda3/envs"
venv = "torchcell"

[tool.ruff]
line-length = 88
target-version = "py313"
# Honor the exclude even when the path is passed explicitly (pre-commit, CI diff-scope).
force-exclude = true

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes, I: isort, UP: pyupgrade, D: pydocstyle.
select = ["E", "F", "I", "UP", "D"]
# E501 owned by the formatter; D205/D212/D415 clash with our frontmatter docstrings.
ignore = ["E501", "D205", "D212", "D415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103", "D104"]
"notes/assets/scripts/**" = ["D100", "D103"]
"experiments/**" = ["D100", "D103", "E402"]
# torch_geometric.MessagePassing inspects message()/forward() signatures at runtime
# and chokes on PEP 604 unions (X | Y -> types.UnionType has no __qualname__). PyG
# won't fix this (issue #10138, "not planned"), so keep Optional/Union here. See
# notes/torchcell.nn.ruff-up-breaks-pyg-messagepassing.md.
"torchcell/nn/stoichiometric_hypergraph_conv.py" = ["UP007", "UP045"]
"torchcell/nn/masked_gin_conv.py" = ["UP007", "UP045"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["docs", "tests", "torchcell", "train"]
# A gitignored `wandb/` run-log dir lives at the repo root; ruff's isort scans
# the filesystem and would auto-detect `wandb` as first-party in a working tree
# that has run W&B, but not in a clean CI checkout -- flip-flopping import order.
# Pin it third-party so local and CI lint results agree deterministically.
known-third-party = ["wandb"]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = true

[tool.mypy]
# Directories, not globs: passing the package dirs lets mypy resolve the tree. (A
# file and a package spelling one module, as torchcell/cell.py and torchcell/cell/ did
# until the 2026.10.06 legacy retirement, make a recursive *.py glob abort discovery.)
files = ["torchcell", "tests"]
# Frozen modules outside the strict gate: scratch one-offs and the hetero_cell_nsa_retry
# model (the dead DEPRECATED / *_scratch / pypy leftovers left with the 2026.10.06 legacy
# retirement, notes/torchcell.legacy-retirement.2026.10.06.md). torchcell/experiments/ is excluded per Decision 5
# (experiments out of the gate; new experiments enter CI under WS5). Verbose (?x)
# regex, one alternative per line.
exclude = '''(?x)(
    torchcell/scratch/
  | torchcell/models/hetero_cell_nsa_retry\.py$
  | torchcell/experiments/
)'''
python_version = "3.13"
# Full strict bundle on our own code. We do NOT set a global
# ignore_missing_imports; untyped third-party libs are handled per-module below
# so our code stays strict instead of silently coercing imports to Any.
strict = true
show_error_codes = true
# Namespace layout (no src/ root); lets discovery complete on the package tree.
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# Scratch modules that mypy still PROCESSES (so the discovery `exclude` above cannot
# drop them): reached via imports, or passed explicitly by the diff-scoped CI mypy
# (which bypasses `exclude`). ignore_errors is module-scoped and honored in both cases,
# so it is the robust mechanism for changed-but-dead files.
module = [
    "torchcell.scratch.*",
    # Frozen model (see the exclude above); its demo main moved to torchcell/scratch on
    # 2026-10-06, and CI passes changed files explicitly, which bypasses the exclude.
    "torchcell.models.hetero_cell_nsa_retry",
]
ignore_errors = true

[[tool.mypy.overrides]]
# Tests exercise behavior, not type contracts: relax the untyped-def family.
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Untyped third-party libraries (no py.typed marker, no stubs). Suppress the
# import error per-module rather than globally. Seeded from env/requirements*.txt
# and confirmed by running mypy; extend as new untyped deps are introduced.
module = [
    "GEOparse", "GEOparse.*",
    "adjustText", "adjustText.*",
    "bibtexparser", "bibtexparser.*",
    "biocypher", "biocypher.*",
    "calm", "calm.*",
    "cellpose", "cellpose.*",
    "cobra", "cobra.*",
    "dask", "dask.*",
    "datasets", "datasets.*",
    "gffutils", "gffutils.*",
    "geomloss", "geomloss.*",
    "goatools", "goatools.*",
    "h5py", "h5py.*",
    "hypernetx", "hypernetx.*",
    "intermine", "intermine.*",
    "lmdb", "lmdb.*",
    "mineru", "mineru.*",
    "neo4j", "neo4j.*",
    "neo4j_utils", "neo4j_utils.*",
    "networkx", "networkx.*",
    "openpyxl", "openpyxl.*",
    "owlready2", "owlready2.*",
    "pandas", "pandas.*",
    "pydantic", "pydantic.*",
    "plotly", "plotly.*",
    "psutil", "psutil.*",
    "pytorch_metric_learning", "pytorch_metric_learning.*",
    "rpy2", "rpy2.*",
    "rustworkx", "rustworkx.*",
    "scipy", "scipy.*",
    "seaborn", "seaborn.*",
    "skimage", "skimage.*",
    "sklearn", "sklearn.*",
    "sortedcontainers", "sortedcontainers.*",
    "sympy", "sympy.*",
    "torch", "torch.*",
    "torch_geometric", "torch_geometric.*",
    "torch_scatter", "torch_scatter.*",
    "torch_sparse", "torch_sparse.*",
    "umap", "umap.*",
    "yaml", "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pydantic is resolved as Any in the mypy env (untyped-import override above), so
# BaseModel subclasses trip disallow_subclassing_any. This is an env artifact, not a
# code defect (pydantic ships types when installed); relax only subclassing for the
# SGA pydantic-schema modules so their models stay otherwise strict-gated.
module = ["torchcell.sga.models", "torchcell.sga.cellpose_seg"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
# Every bucket is opt-in by flag (tests/conftest.py): plain `pytest tests/torchcell` is
# the hermetic CI contract, and a marked test skips with a reason naming its flag.
markers = [
    "gpu: needs a CUDA device; runs only with --gpu",
    "slow: builds a full dataset from the $DATA_ROOT mirrors; runs only with --slow",
    "data: reads the real $DATA_ROOT (genome, raw mirrors, built LMDBs); runs only with --data",
    "neo4j: opens a Neo4j driver; runs only with --neo4j",
    "network: reaches the network, gh, or ssh; runs only with --network",
    "wandb: calls wandb.init; runs only with --wandb",
]
# pytest-timeout: import-all and Lightning fast_dev_run tests can hang rather than fail.
timeout = 300
# Collection is confined to tests/. The repository root also holds experiment scripts
# named test_*.py (experiments/*/scripts/), and two of them build a dataset under
# $DATA_ROOT at import, so an editor's whole-repository discovery (rootdir, no path
# argument) built smf_kuzmin2018 into the sentinel data root on 2026-10-02 and failed
# every concurrent session's empty-sentinel check. `testpaths` covers a bare `pytest`;
# `norecursedirs` (pytest's defaults plus `experiments`) covers `pytest .`.
testpaths = ["tests"]
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "experiments"]

[tool.torchcell.test_exceptions]
# The ONE exception table for the paired-test gate (scripts/check_paired_tests.py): a
# module added under torchcell/ (with --strict, changed too) must ship
# tests/torchcell/<same dir>/test_<name>.py unless it matches an entry here. A trailing
# "/" is a directory prefix, "*" a glob, anything else an exact path. Seeded verbatim
# from the mypy exclude/ignore_errors carve-outs above; the legacy entries left with the
# 2026.10.06 retirement to the graveyard (notes/torchcell.legacy-retirement.2026.10.06.md).
paths = [
    "torchcell/scratch/",
    "torchcell/experiments/",
    "torchcell/models/hetero_cell_nsa_retry.py",
]

[tool.torchcell.test_exceptions.pairs]
# Source module -> the test file that covers it when the mirrored basename would collide
# under pytest's prepend import mode (tests/torchcell/{models,losses}/test_dcell.py,
# tests/torchcell/{graph,datasets/scerevisiae}/test_sgd.py, and test_registry.py against
# tests/torchcell/sequence/genome/test_registry.py).
"torchcell/losses/dcell.py" = "tests/torchcell/losses/test_losses_dcell.py"
"torchcell/graph/sgd.py" = "tests/torchcell/graph/test_graph_sgd.py"
"torchcell/artifacts/ref.py" = "tests/torchcell/artifacts/test_artifact_ref.py"
"torchcell/artifacts/tiers.py" = "tests/torchcell/artifacts/test_artifact_tiers.py"
"torchcell/artifacts/resolve.py" = "tests/torchcell/artifacts/test_artifact_resolve.py"
"torchcell/artifacts/deposit.py" = "tests/torchcell/artifacts/test_artifact_deposit.py"
"torchcell/artifacts/walk.py" = "tests/torchcell/artifacts/test_artifact_walk.py"
"torchcell/viz/fitness.py" = "tests/torchcell/viz/test_viz_fitness.py"
"torchcell/datasets/server.py" = "tests/torchcell/datasets/test_datasets_server.py"
"torchcell/data/data.py" = "tests/torchcell/data/test_data_data.py"
"torchcell/datasets/nucleotide_transformer.py" = "tests/torchcell/datasets/test_datasets_nucleotide_transformer.py"
"torchcell/datasets/fungal_up_down_transformer.py" = "tests/torchcell/datasets/test_datasets_fungal_up_down_transformer.py"
"torchcell/knowledge_graphs/supported_queries/registry.py" = "tests/torchcell/knowledge_graphs/supported_queries/test_supported_queries_registry.py"
"torchcell/models/esm2.py" = "tests/torchcell/models/test_models_esm2.py"
"torchcell/models/protT5.py" = "tests/torchcell/models/test_models_protT5.py"
"torchcell/losses/dango.py" = "tests/torchcell/losses/test_losses_dango.py"

[tool.coverage.run]
source = ["torchcell"]
branch = true
# torchcell/scratch is the carve-out for one-off scripts (no __init__.py; outside mypy
# discovery, the import sweep, the legacy partition and the API docs). Two of its loaders
# are imported by tests, which is the only reason they ever entered the denominator.
omit = ["torchcell/scratch/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
# Bodies that never execute by construction: an abstract method (the subclass overrides
# it) and a Protocol stub whose body is a bare ellipsis.
exclude_also = [
    "@(abc\\.)?abstractmethod",
    "^\\s*\\.\\.\\.$",
]

# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
[tool.setuptools.dynamic]
dependencies = { file = ["env/requirements.txt"] }
# Doesn't allow ordering
# dependencies = {file = ["env/requirements.txt", "env/requirements_dependent.txt"]}

# optional-dependencies = {dev = { file = ["requirements-dev.txt"] }}
version = { attr = "torchcell.__version__" }

[tool.setuptools.package-data]
torchcell = [
    "py.typed",
    "knowledge_graphs/conf/*.yaml",
    "knowledge_graphs/conf/gene_sets/*.txt", # prefilter gene-set lists (build inputs)
    "knowledge_graphs/queries/*.cql", # supported Cypher queries (showcase pages, T5 registry)
    "adapters/conf/*.yaml",
    "datamodels/*.json", # pinned data tables (e.g. compound_identity_table.json)
    "knowledge_graphs/supported_queries/registry.json", # supported-query registry (T5)
]

[tool.setuptools.packages.find]
include = ["torchcell*"]

[tool.semantic_release]
version_variables = [
    "pyproject.toml:version",
    "torchcell/__version__.py:__version__",
]
branch = "main"
# Built inside the semantic-release action on a release-producing push; the two
# publish steps in .github/workflows/semantic-release.yaml then upload dist/* to the
# GitHub release and to PyPI (trusted publishing, no token). `upload_to_pypi` was a
# python-semantic-release v7 option that v10 ignores, which is why PyPI sat at 0.2.8
# (2024-09-20) while GitHub releases reached v1.5.0.
build_command = "python -m pip install build && python -m build"
# scripts/release_parser.py: the conventional parser (reads the TAG(scope): subject form
# the repo writes; python-semantic-release 10.4.1's scipy parser does not) plus
# major_tags. Tested by tests/scripts/test_release_parser.py on real subjects.
commit_parser = "scripts/release_parser.py:TorchcellCommitParser"

[tool.semantic_release.commit_parser_options]
# Tag map (notes/versioning.md, 2026.09.29, second section): a version bump is a
# deliberate act, never a side effect of landing work. Only four tags bump: API (major),
# REL (minor, a deliberate source release, cut before a KG build), DB (patch, a database
# compatibility change: a new release snapshot, a supported-query registry change, a
# schema closure change) and PATCH (patch, a deliberate source patch release with no
# interface or database change: a packaging, README or documentation correction that has
# to reach PyPI). Everything else, FEAT and FIX included, is allowed with no bump
# so main stays "latest" between releases; the earlier map (FEAT minor, FIX patch) moved
# main from 1.2.1 to 1.5.0 in one evening. "!" or a "BREAKING CHANGE:" paragraph on any
# tag still forces a major.
allowed_tags = [
    "API",
    "DEP",
    "ENH",
    "REV",
    "BUG",
    "FIX",
    "MAINT",
    "PERF",
    "BENCH",
    "BLD",
    "CI",
    "DB",
    "DEV",
    "DOC",
    "DOCS",
    "NOTE",
    "STY",
    "TST",
    "REL",
    "PATCH",
    "FEAT",
    "TEST",
]
major_tags = ["API"]
minor_tags = ["REL"]
patch_tags = ["DB", "PATCH"]
