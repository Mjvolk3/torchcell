# biocypher/config/torchcell_schema_config.yaml
# [[biocypher.config.torchcell_schema_config.yaml]]
# https://github.com/Mjvolk3/torchcell/tree/main/biocypher/config/torchcell_schema_config.yaml

# Nodes
dataset:
    represented_as: node

# study:
#     represented_as: node
#     properties:
#         name: str

# source_type / title / identifier / identifier_url carry a NON-journal source (a
# dissertation, a preliminary-exam report, an in-house measurement), which has no DOI
# and no PubMed id: it is identified by title plus the deposited document's
# mirror-relative path and sha256 (Publication.identifier).
publication:
    represented_as: node
    properties:
        pubmed_id: str
        pubmed_url: str
        doi: str
        doi_url: str
        source_type: str
        title: str
        identifier: str
        identifier_url: str
        serialized_data: str

# experiment: recorded experimental observation (data record, not the process)
# Uses continuant (information content entity) rather than occurrent (activity)
# Note: The experimental procedure/plan would be modeled as "protocol" (could be activity or entity)
# study: used for collection/aggregation of multiple experiments

experiment:
    represented_as: node
    is_a: information content entity
    properties:
        serialized_data: str

experiment reference:
    represented_as: node
    is_a: information content entity
    properties:
        serialized_data: str

# interned constant: a large sub-object of an experiment record (its environment, or a
# segregant genotype) stored ONCE, content-addressed: id = sha256 of serialized_data.
# The experiment's serialized_data carries {"$ref": <id>, "kind": <field>} where the
# sub-object was; torchcell.data.neo4j_query_raw splices it back on query. Without this
# the 9.4 KB Costanzo environment was inlined into 41.4M experiment blobs (release 1.2:
# 645 of 689 GB was serialized_data). See torchcell/datamodels/interned_constant.py.
interned constant:
    represented_as: node
    is_a: information content entity
    properties:
        kind: str
        serialized_data: str

genome:
    represented_as: node
    properties:
        species: str
        strain: str
        serialized_data: str

# No serialized_data on genotype, segregant genotype, perturbation, crispr construct,
# environment perturbation or any phenotype class: each is a sub-object of the
# experiment record, whose full typed copy is the Experiment blob (reference-side
# phenotypes and environment perturbations: the experiment reference blob). These
# nodes carry only their queryable scalars; ids are still sha256 of the model_dump.
genotype:
    represented_as: node
    properties:
        systematic_gene_names: list
        perturbed_gene_names: list
        perturbation_types: list

perturbation:
    is_a: genotype
    represented_as: node
    properties:
        systematic_gene_name: str
        perturbed_gene_name: str
        perturbation_type: str
        description: str
        strain_id: str

# A gene perturbation of a bacterial host (the five bacterial leaves in schema.py:
# BacterialDeletionPerturbation, TransposonInsertionPerturbation,
# BacterialCrisprInterferencePerturbation, PromoterReplacementPerturbation,
# HeterologousPathwayPerturbation). It is a SIBLING of `perturbation` under `genotype`,
# not a child, and its own class rather than extra properties on `perturbation`:
# `perturbation` is served, so adding `gene_namespace` to it would force a full rebuild,
# and an `is_a: perturbation` would put bacterial nodes under every served
# `MATCH (:Perturbation)`. gene_namespace names the host locus-tag space the
# systematic_gene_name is written in (`b0002` alone does not say which genome). No
# strain_id: none of the five leaves declares one, so it would be a column that is
# always null. Same id rule as `perturbation` (sha256 of the leaf's model_dump), so the
# existing `perturbation member of` edges already point at these nodes.
bacterial perturbation:
    is_a: genotype
    represented_as: node
    properties:
        systematic_gene_name: str
        perturbed_gene_name: str
        perturbation_type: str
        description: str
        gene_namespace: str

# A CALLED bacterial variant (issue #731): the three variant leaves in schema.py
# (BacterialSequenceVariantPerturbation, BacterialSiteVariantPerturbation,
# BacterialSpanDeletionPerturbation), each of which composes a `BacterialVariantCall`.
# It is its OWN class rather than rows of `bacterial perturbation`, for the reason the
# `phage perturbation` class exists: the properties below (the replicon, the 1-based
# interval, the variant kind, the call frequency and whether that frequency is a clone's
# or a population's) are what a variant record is asked about, and `bacterial
# perturbation` is served, so they cannot be added there without a full rebuild -- and
# if they were, they would be null on every one of its other five leaves, exactly the
# argument that keeps `strain_id` off it. A SIBLING of `bacterial perturbation` under
# `genotype`, so no served `MATCH (:BacterialPerturbation)` changes.
# systematic_gene_name is a locus tag for an in-locus or span call and the derived site
# id `<replicon>:<position>` for an intergenic one, which is how a call that is in no
# gene stays out of the gene-keyed join rather than being attributed to a neighbour.
# Same id rule as `perturbation` (sha256 of the leaf's model_dump), so the existing
# `perturbation member of` edges address these nodes unchanged.
bacterial sequence variant perturbation:
    is_a: genotype
    represented_as: node
    properties:
        systematic_gene_name: str
        perturbed_gene_name: str
        perturbation_type: str
        description: str
        gene_namespace: str
        reference_sequence: str
        position_start: int
        position_end: int
        variant_type: str
        variant_frequency: float
        call_mode: str

# A haploid segregant of a biparental cross: a haplotype MOSAIC against two pinned
# parent assemblies (SegregantGenotype), not a list of gene perturbations. It IS a
# genotype (is_a), so genotype-level queries reach it; the gene-keyed properties of
# the plain genotype node are absent here and evaluate to null. Blocks travel in
# the Experiment blob (an interned constant).
segregant genotype:
    is_a: genotype
    represented_as: node
    properties:
        cross: str
        segregant_id: str
        parent_1: str
        parent_2: str
        n_blocks: int

# The engineered CRISPR machinery a perturbation was made with (CrisprConstruct): the
# guide spacer + the Cas effector fusion + the library sub-pool it was screened in. It
# is its OWN node class rather than extra properties on `perturbation`, because
# `perturbation` is in the served graph and adding properties to it would force a full
# rebuild; a new class is additive. Without it the effector, spacer and pool of every
# CRISPRi/CRISPRa/CRISPRd record are reachable only by parsing serialized_data.
# is_a: a class BioCypher cannot find in Biolink (3.2.1 is its pinned head ontology)
# needs an is_a to a Biolink class or the ontology build raises before the first node
# is written (rehearsal job 1956, 2026-09-14); a guide + effector plasmid is a nucleic
# acid entity there.
crispr construct:
    is_a: nucleic acid entity
    represented_as: node
    properties:
        effector: str
        guide_sequence: str
        n_guides: int
        library_pool: str
        effector_plasmid_ref: str
        effector_plasmid_sha256: str

environment:
    is_a: environmental exposure
    represented_as: node
    properties:
        temperature: str
        media: str
        serialized_data: str

media:
    is_a: environmental exposure
    represented_as: node
    properties:
        name: str
        state: str
        serialized_data: str

temperature:
    is_a: environmental exposure
    represented_as: node
    properties:
        value: float
        unit: str
        serialized_data: str

# The environment axis of perturbation: an added compound (small molecule), a physical
# factor, or a biologic agent, content-addressed like a gene perturbation. Compound and
# concentration are projected for small molecules; the typed record is in the Experiment
# blob (inside its environment).
environment perturbation:
    is_a: environmental exposure
    represented_as: node
    properties:
        perturbation_type: str
        description: str
        factor: str
        compound_name: str
        inchikey: str
        concentration_value: float
        concentration_unit: str

# A bacteriophage challenge (PhagePerturbation): the environment axis of a phage-
# resistance screen, content-addressed like the other environment perturbations. It is
# its OWN class rather than a row of `environment perturbation`, for two reasons. The
# served class would need new properties (the MOI, the phage's taxon and accession) and
# `environment perturbation` is served, so that is a full rebuild; and the dose is not a
# concentration, so it cannot ride the `concentration_value` / `concentration_unit`
# columns without making a particle-to-cell ratio look like a dose.
# is_a: Biolink defines `environmental exposure` as abiotic ("factor relating to abiotic
# processes in the environment"), while `biotic exposure` is "an intake of (sometimes
# pathological) biological organisms (including viruses)" and carries `viral exposure` as
# an altLabel. The two are SIBLINGS under `exposure event`, so a phage node does not
# carry the `EnvironmentalExposure` label and no served query over that label changes.
# Same id rule as `environment perturbation` (the composition projection in
# torchcell.datamodels.identity), so `environment perturbation member of` addresses these
# nodes unchanged.
phage perturbation:
    is_a: biotic exposure
    represented_as: node
    properties:
        perturbation_type: str
        description: str
        phage_name: str
        ncbi_taxid: int
        genome_accession: str
        multiplicity_of_infection: float
        titer_pfu_per_ml: float

# TODO expand out to include different phenotypes.
# PHENOTYPES START
# fitness and gene interaction phenotypes project screen_id, the screen a measurement
# came from when one source releases a (genotype, environment) from two screens
# (Kuzmin 2020 Table S1 main vs Table S3 pilot screens, issue #602).
fitness phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        fitness: float
        fitness_std: float
        screen_id: str

# gene interaction phenotype also projects the replicate-design quartet (#793): a
# sourced eight-colony design (Babu 2014) and a per-record measured colony count
# (Butland 2008) are queryable properties of the score rather than a file beside the
# build. Added with a FULL rebuild, never an increment: incremental import cannot
# update the nodes the yeast interaction datasets already wrote.
gene interaction phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        gene_interaction: float
        gene_interaction_p_value: float
        screen_id: str
        n_samples: int
        sample_unit: str
        gene_interaction_uncertainty: float
        gene_interaction_uncertainty_type: str

gene essentiality phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        is_essential: bool

synthetic lethality phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        is_synthetic_lethal: bool
        synthetic_lethality_statistic_score: float

synthetic rescue phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        is_synthetic_rescue: bool
        synthetic_rescue_statistic_score: float

calmorph phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        calmorph: str
        calmorph_coefficient_of_variation: str

microarray expression phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        expression_log2_ratio: str
        expression_log2_ratio_se: str

rnaseq expression phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        expression_tpm: str
        measurement_type: str
        n_mapped_reads: int

# Single-cell Perturb-seq collapsed to pseudobulk per genotype (Nadal-Ribelles 2025):
# per-gene log2 fold-change vs the same-condition WT as a JSON string, plus the two
# per-genotype single-cell scalars (dispersion, n_cells) kept typed for querying.
pseudobulk expression phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        expression_log2_ratio: str
        dispersion: float
        n_cells: int
        measurement_type: str

visual score phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        visual_score: float
        n_replicates: int
        target_product: str
        target_metabolite_id: str

metabolite phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        metabolite_level: str
        metabolite_level_se: str
        measurement_type: str

protein abundance phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        protein_abundance: str
        protein_abundance_se: str
        measurement_type: str

# --- begin #770: the protein fold-change family ---
# Per-protein RELATIVE abundance against a control strain (ProteinFoldChangePhenotype),
# the sibling of protein abundance on the relative axis. Every dict keyed by protein id
# is a JSON string, as for protein abundance; fold_change_scale and reference_basis are
# the two scalars that make two columns comparable, and the two p-value maps are the
# per-protein significance the absolute class has no field for.
protein fold change phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        protein_fold_change: str
        protein_fold_change_se: str
        protein_fold_change_p_value: str
        protein_fold_change_p_value_adjusted: str
        p_value_adjustment_method: str
        fold_change_scale: str
        reference_basis: str
        n_replicates: str
        measurement_type: str
# --- end #770 ---

# A strain's signed growth/fitness RESPONSE in a perturbed environment
# (EnvironmentResponsePhenotype): chemogenomic screens and the segregant growth
# panels. measurement_type = WHAT the number is, assay_type = HOW it was measured.
# A categorical or ordinal screen has no number at all, so category (the shared
# ResponseCategory axis) and category_label (the source's own word) are projected
# too, else such a dataset is queryable only by parsing serialized_data. screen_id
# names the screening run, which is what separates two independent screens of the
# same compound at the same dose.
# environment response phenotype also projects the two-sided confidence interval and
# the per-replicate id (#776): an asymmetric interval (Caglar 2017 Table S5, asymmetric
# in 55 of 55 rows) has no half-width, so storing it needs both limits plus the level,
# and a release that is one row per replicate curve needs the replicate id to stay
# L1-unique. Added with a FULL rebuild, never an increment.
# It also projects the released test of the response (#863): the unadjusted and the
# adjusted p-value plus the correction's name, scalar because a record holds one
# response (Wang 2024 Table S2's TRANSIT p-value and Adj. p-value). Added with a FULL
# rebuild, never an increment.
environment response phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        environment_response: float
        environment_response_se: float
        measurement_type: str
        assay_type: str
        category: str
        category_label: str
        screen_id: str
        environment_response_lower: float
        environment_response_upper: float
        confidence_level: float
        replicate_id: str
        environment_response_p_value: float
        environment_response_p_value_adjusted: float
        p_value_adjustment_method: str

# How much of a named product a strain made (ProductTiterPhenotype). Every field but
# provenance_gaps is projected: enums as their value, and the product, a typed
# Compound, as the JSON of its model_dump (name, InChIKey, ChEBI, PubChem, SMILES),
# the same JSON-string convention the dict-valued phenotypes use. A property is named
# by its field so the phenotype <-> node class bijection
# (torchcell/datamodels/ontology_checks.py) matches it without an alias table.
product titer phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        product: str
        titer: float
        titer_unit: str
        titer_se: float
        titer_uncertainty: float
        titer_uncertainty_type: str
        n_samples: int
        sample_unit: str
        product_yield: float
        product_yield_unit: str
        productivity: float
        productivity_unit: str
        quantification_method: str

# Per-protein turnover rates (ProteinTurnoverPhenotype): every dict keyed by locus tag
# is a JSON string, as for protein abundance; measurement_type carries the time unit.
protein turnover phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        degradation_rate: str
        degradation_rate_se: str
        half_life: str
        synthesis_rate: str
        n_replicates: str
        measurement_type: str
        # --- begin #753: the published interval and the censoring flag ---
        degradation_rate_lower: str
        degradation_rate_upper: str
        confidence_level: float
        interval_method: str
        censoring: str
        # --- end #753 ---

# A fitted net-flux map (FluxPhenotype): signed per-reaction fluxes and their
# confidence bounds as JSON strings; confidence_level and n_samples are scalars of the
# whole fit. label_statistic_name is null by design (an interval is not one number).
flux phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        net_flux: str
        net_flux_lower: str
        net_flux_upper: str
        confidence_level: float
        measurement_type: str
        n_samples: int
        sample_unit: str
        target_reaction_ids: str

# Transcription from ONE promoter read through a reporter fusion
# (PromoterActivityPhenotype). Every field but provenance_gaps is projected, enums as
# their value and every value a scalar: this family has no dict-valued field, because a
# record measures one promoter rather than a profile. promoter_gene is the join key to
# the gene node and is null when the source label names no single gene. A property is
# named by its field so the phenotype <-> node class bijection
# (torchcell/datamodels/ontology_checks.py) matches it without an alias table.
promoter activity phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        promoter_activity: float
        promoter_activity_se: float
        promoter_activity_uncertainty: float
        promoter_activity_uncertainty_type: str
        n_samples: int
        sample_unit: str
        promoter_name: str
        promoter_gene: str
        readout: str
        reporter_gene: str
        activity_units: str
        well_id: str
# A bacterial strain's cell-morphology profile from one microscopy assay
# (BacterialMorphologyPhenotype, issue #774). The dict-valued fields serialize to JSON
# strings, the CalMorph convention; `assay` names the vocabulary the keys belong to, so a
# query can tell a Campos symbol from a later screen's symbol of the same name. A
# property is named by its field so the phenotype <-> node class bijection
# (torchcell/datamodels/ontology_checks.py) matches it without an alias table.
bacterial morphology phenotype:
    is_a: phenotypic feature
    represented_as: node
    properties:
        graph_level: str
        label_name: str
        label_statistic_name: str
        assay: str
        morphology: str
        morphology_coefficient_of_variation: str
        n_samples: int
        sample_unit: str
# PHENOTYPES END

# RELATIONSHIPS
# Two sources (a segregant genotype IS a genotype but is its own node class), so
# BioCypher builds one virtual leaf per source and needs input_label: with a list
# source and no input_label, OntologyMapping._horizontal_inheritance_source zips a
# None and the build dies before the first node is written (rehearsal job 1953,
# 2026-09-14). The label is the adapter's relationship_label, broadcast to both leaves.
genotype member of:
    is_a: participates in
    represented_as: edge
    input_label: genotype member of
    source: [genotype, segregant genotype]
    target: experiment

# Three sources since `bacterial sequence variant perturbation` joined, so input_label
# is required for the
# same reason as on `genotype member of`. The adapter's relationship_label is unchanged
# ("perturbation member of"), so the served PerturbationMemberOf edges keep their type.
perturbation member of:
    is_a: genetically associated with
    represented_as: edge
    input_label: perturbation member of
    source: [perturbation, bacterial perturbation, bacterial sequence variant perturbation]
    target: genotype

# A bacterial CRISPRi leaf carries the shared CrisprConstruct, so its construct edge
# targets a `bacterial perturbation` node.
crispr construct member of:
    is_a: part of
    represented_as: edge
    source: crispr construct
    target: [perturbation, bacterial perturbation]

environment member of:
    is_a: participates in
    represented_as: edge
    source: environment
    target: [experiment, experiment reference]

# If you have multiple sources you must specify the input_label type
phenotype member of:
    is_a: participates in
    represented_as: edge
    input_label: phenotype
    source:
        [
            fitness phenotype,
            gene essentiality phenotype,
            synthetic lethality phenotype,
            synthetic rescue phenotype,
            gene interaction phenotype,
            calmorph phenotype,
            microarray expression phenotype,
            rnaseq expression phenotype,
            pseudobulk expression phenotype,
            visual score phenotype,
            metabolite phenotype,
            protein abundance phenotype,
            protein fold change phenotype,
            environment response phenotype,
            product titer phenotype,
            protein turnover phenotype,
            flux phenotype,
            promoter activity phenotype,
            bacterial morphology phenotype,
        ]
    target: [experiment, experiment reference]

media member of:
    is_a: part of
    represented_as: edge
    source: media
    target: environment

temperature member of:
    is_a: part of
    represented_as: edge
    source: temperature
    target: environment

# Two sources since `phage perturbation` joined, so input_label is required (with a list
# source and no input_label, OntologyMapping._horizontal_inheritance_source zips a list
# against a string and builds one leaf per CHARACTER). The adapter's relationship label
# is unchanged, so the written type stays EnvironmentPerturbationMemberOf.
environment perturbation member of:
    is_a: part of
    represented_as: edge
    input_label: environment perturbation member of
    source: [environment perturbation, phage perturbation]
    target: environment

genome member of:
    is_a: participates in
    represented_as: edge
    source: genome
    target: experiment reference

# publication mentions experiment:
# Edge renamed to avoid name collision with Biolink's "mentions" predicate
publication mentions experiment:
    is_a: mentions
    represented_as: edge
    source: publication
    target: experiment

# Experiments are data records (continuants), so they are components/parts of dataset collections
experiment reference member of:
    is_a: part of
    represented_as: edge
    source: experiment reference
    target: dataset

experiment member of:
    is_a: part of
    represented_as: edge
    source: experiment
    target: dataset

experiment reference of:
    is_a: coexists with
    represented_as: edge
    source: experiment reference
    target: experiment
