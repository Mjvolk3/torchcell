# experiments/025-solid-growth/conf/cgt_s0_q_kl_emb_017.yaml
#
# FULL-GENE SEQUENCE EMBEDDING IN PLACE OF THE LEARNABLE TABLE, PARAMETER-MATCHED.
# cgt_s0_q_kl_ctrl_016 with the 6,607 x 180 learnable table replaced by a fixed per-gene
# vector that reads every functional region of the gene once:
#
#   fudt_upstream    768  promoter, 1,003 bp 5' of the start (species fungal UTR transformer)
#   calm             768  ORF as codons (CaLM)
#   prot_T5_all     1024  ORF as protein (ProtT5-XL UniRef50)
#   fudt_downstream  768  terminator, 300 bp 3' of the stop
#                   ----
#                   3328
#
# The composite enters through the model's 2-layer preprocessor MLP (Linear, LayerNorm,
# GELU, Dropout, Linear, LayerNorm) with hidden width 339, chosen so the embedding side
# carries 1,190,769 parameters against the table's 1,189,260 (0.13 percent apart); every
# parameter after the embedding is identical to _016. Only the input differs.
#
# Nothing has measured these embeddings on interactions. On expression (019 v10 grid)
# ProtT5 minus a random 1024-vector was +0.068 Pearson; in the 019 kNN probe the two
# flanking models sat near the noise floor. They are kept so the same gene vector can
# later serve promoter and terminator choices.
#
#   sbatch -J 025-q-emb-const experiments/025-solid-growth/scripts/igb_mmli_cgt.slurm cgt_s0_q_kl_emb_017
defaults:
  - cgt_s0_q_kl_ctrl_016
  - _self_

wandb:
  tags: [s0, split_Q, graph_reg_kl, query_pair_disjoint, seq_embedding, full_gene_composite, param_matched, perturb_cls, fit_on_train, const_lr, const_lr_2.5e-4, epochs_30, igb_mmli]

cell_dataset:
  node_embeddings: [fudt_upstream, calm, prot_T5_all, fudt_downstream]

model:
  learnable_embedding:
    enabled: false
    size: ${model.hidden_channels}
    preprocessor:
      num_layers: 2
      hidden_dim: 339
      dropout: 0.1
