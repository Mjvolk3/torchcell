<svg xmlns="http://www.w3.org/2000/svg" width="179.00mm" height="94.47mm" viewBox="0 0 507.4 267.8" font-family="Arial, Helvetica, sans-serif"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="100%" height="100%" fill="#FFFFFF"/><text x="10.0" y="18.0" font-size="9" font-weight="700" fill="#2B2B2B">The torchcell experiment ontology</text><text x="10.0" y="27.0" font-size="6.5" fill="#666666">Every record is a typed genotype × environment → phenotype experiment, with provenance attached to each sourced value.</text><path d="M166.5 72.3 C171.0 72.3 171.0 96.4 171.5 96.4" fill="none" stroke="#D79B00" stroke-width="1.4"/><path d="M175.5 96.4 l-4.4 -2.2 v4.4 Z" fill="#D79B00"/><path d="M166.5 146.3 C171.0 146.3 171.0 114.6 171.5 114.6" fill="none" stroke="#B85450" stroke-width="1.4"/><path d="M175.5 114.6 l-4.4 -2.2 v4.4 Z" fill="#B85450"/><path d="M331.9 105.5 C336.4 105.5 336.4 105.5 336.9 105.5" fill="none" stroke="#9673A6" stroke-width="1.4"/><path d="M340.9 105.5 l-4.4 -2.2 v4.4 Z" fill="#9673A6"/><rect x="10.0" y="36.0" width="156.5" height="72.6" rx="3" fill="#FFFFFF" stroke="#D79B00" stroke-width="1"/><path d="M10.0 39.0 a3 3 0 0 1 3 -3 h150.5 a3 3 0 0 1 3 3 v17.0 h-156.5 Z" fill="#FFE6CC"/><text x="15.0" y="45.4" font-size="7" font-weight="700" fill="#D79B00">GENOTYPE</text><text x="161.5" y="45.4" font-size="6" text-anchor="end" fill="#D79B00">31 classes</text><text x="15.0" y="53.2" font-size="6" fill="#666666">1..n perturbations off a reference genome</text><text x="15.0" y="62.0" font-size="6" fill="#2B2B2B">presence / absence  ·  deletion, addition,</text><text x="15.0" y="69.6" font-size="6" fill="#2B2B2B">   natural gain and loss, marker &amp; CRISPR</text><text x="15.0" y="77.2" font-size="6" fill="#2B2B2B">sequence  ·  allele, ts allele, DAmP,</text><text x="15.0" y="84.8" font-size="6" fill="#2B2B2B">   suppressor, sequence variant</text><text x="15.0" y="92.4" font-size="6" fill="#2B2B2B">dosage  ·  copy number, engineered copy</text><text x="15.0" y="100.0" font-size="6" fill="#2B2B2B">expression  ·  CRISPRa, CRISPRi</text><rect x="10.0" y="117.6" width="156.5" height="57.4" rx="3" fill="#FFFFFF" stroke="#B85450" stroke-width="1"/><path d="M10.0 120.6 a3 3 0 0 1 3 -3 h150.5 a3 3 0 0 1 3 3 v17.0 h-156.5 Z" fill="#F8CECC"/><text x="15.0" y="127.0" font-size="7" font-weight="700" fill="#B85450">ENVIRONMENT</text><text x="161.5" y="127.0" font-size="6" text-anchor="end" fill="#B85450">10 classes</text><text x="15.0" y="134.8" font-size="6" fill="#666666">medium × temperature × perturbation</text><text x="15.0" y="143.6" font-size="6" fill="#2B2B2B">Media  ·  typed components, not a string</text><text x="15.0" y="151.2" font-size="6" fill="#2B2B2B">MediaComponent → Compound + Concentration</text><text x="15.0" y="158.8" font-size="6" fill="#2B2B2B">Temperature, aerobicity, duration</text><text x="15.0" y="166.4" font-size="6" fill="#2B2B2B">perturbation  ·  small molecule, physical</text><rect x="175.5" y="73.0" width="156.5" height="65.0" rx="3" fill="#FFFFFF" stroke="#D6B656" stroke-width="1"/><path d="M175.5 76.0 a3 3 0 0 1 3 -3 h150.5 a3 3 0 0 1 3 3 v17.0 h-156.5 Z" fill="#FFF2CC"/><text x="180.5" y="82.4" font-size="7" font-weight="700" fill="#D6B656">EXPERIMENT</text><text x="326.9" y="82.4" font-size="6" text-anchor="end" fill="#D6B656">28 classes</text><text x="180.5" y="90.2" font-size="6" fill="#666666">the typed record, paired with its control</text><text x="180.5" y="99.0" font-size="6" fill="#2B2B2B">Experiment</text><text x="180.5" y="106.6" font-size="6" fill="#2B2B2B">   genotype × environment → phenotype</text><text x="180.5" y="114.2" font-size="6" fill="#2B2B2B">ExperimentReference</text><text x="180.5" y="121.8" font-size="6" fill="#2B2B2B">   reference genome × environment → phenotype</text><text x="180.5" y="129.4" font-size="6" fill="#2B2B2B">13 typed experiment/reference pairs</text><rect x="340.9" y="69.2" width="156.5" height="72.6" rx="3" fill="#FFFFFF" stroke="#9673A6" stroke-width="1"/><path d="M340.9 72.2 a3 3 0 0 1 3 -3 h150.5 a3 3 0 0 1 3 3 v17.0 h-156.5 Z" fill="#E1D5E7"/><text x="345.9" y="78.6" font-size="7" font-weight="700" fill="#9673A6">PHENOTYPE</text><text x="492.4" y="78.6" font-size="6" text-anchor="end" fill="#9673A6">14 classes</text><text x="345.9" y="86.4" font-size="6" fill="#666666">what was measured, with its uncertainty</text><text x="345.9" y="95.2" font-size="6" fill="#2B2B2B">fitness, gene interaction, essentiality</text><text x="345.9" y="102.8" font-size="6" fill="#2B2B2B">synthetic lethality, synthetic rescue</text><text x="345.9" y="110.4" font-size="6" fill="#2B2B2B">expression  ·  microarray, RNA-seq, pseudobulk</text><text x="345.9" y="118.0" font-size="6" fill="#2B2B2B">protein abundance, metabolite</text><text x="345.9" y="125.6" font-size="6" fill="#2B2B2B">morphology (CalMorph), visual score</text><text x="345.9" y="133.2" font-size="6" fill="#2B2B2B">environment response</text><rect x="10.0" y="189.4" width="156.5" height="57.4" rx="3" fill="#FFFFFF" stroke="#6C8EBF" stroke-width="1"/><path d="M10.0 192.4 a3 3 0 0 1 3 -3 h150.5 a3 3 0 0 1 3 3 v17.0 h-156.5 Z" fill="#DAE8FC"/><text x="15.0" y="198.8" font-size="7" font-weight="700" fill="#6C8EBF">PROVENANCE</text><text x="161.5" y="198.8" font-size="6" text-anchor="end" fill="#6C8EBF">3 classes</text><text x="15.0" y="206.6" font-size="6" fill="#666666">where the record came from</text><text x="15.0" y="215.4" font-size="6" fill="#2B2B2B">Publication  ·  DOI, PubMed</text><text x="15.0" y="223.0" font-size="6" fill="#2B2B2B">ReferenceGenome  ·  species, strain, ploidy</text><text x="15.0" y="230.6" font-size="6" fill="#2B2B2B">SOTerm  ·  Sequence Ontology anchor</text><text x="15.0" y="238.2" font-size="6" fill="#2B2B2B">SourcedValue  ·  sha256 + verbatim quote</text><rect x="175.5" y="189.4" width="321.9" height="57.4" rx="3" fill="#FFFFFF" stroke="#666666" stroke-width="1"/><path d="M175.5 192.4 a3 3 0 0 1 3 -3 h315.9 a3 3 0 0 1 3 3 v17.0 h-321.9 Z" fill="#F5F5F5"/><text x="180.5" y="198.8" font-size="7" font-weight="700" fill="#666666">CONTROLLED VOCABULARIES</text><text x="492.4" y="198.8" font-size="6" text-anchor="end" fill="#666666">9 classes</text><text x="180.5" y="206.6" font-size="6" fill="#666666">closed sets, no free text</text><text x="180.5" y="215.4" font-size="6" fill="#2B2B2B">UncertaintyType  ·  sample SD vs bootstrap SE</text><text x="180.5" y="223.0" font-size="6" fill="#2B2B2B">SampleUnit  ·  colony, screen, replicate</text><text x="180.5" y="230.6" font-size="6" fill="#2B2B2B">ConcentrationUnit, DoseBasis, PhysicalFactor</text><text x="180.5" y="238.2" font-size="6" fill="#2B2B2B">MediaComponentRole, ComponentDefinition</text><text x="10.0" y="259.8" font-size="6" fill="#666666">86 pydantic classes &#183; 381 declared fields &#183; generated from torchcell.datamodels.schema</text><text x="497.4" y="259.8" font-size="6" text-anchor="end" fill="#6C8EBF">full interactive map: https://torchcell.org/ontology</text></svg>