   <g id="text_1">
    <text style="font-style: italic; font-size: 5.6px; font-family: 'Arial'; text-anchor: start" x="8.014251" y="12.470224" transform="rotate(-0 8.014251 12.470224)">the task</text>
   </g>
   <g id="text_2">
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(44.94611 43.151196)">a compound</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(38.54561 48.228096)">and its molar dose</text>
   </g>
   <g id="text_3">
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(35.875235 91.284975)">the strain: a deletion,</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(29.872985 96.361875)">or the bAID host with none</text>
   </g>
   <g id="text_4">
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(170.191906 65.954585)">cell graph transformer</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(160.446406 71.157935)">one compound token in front of</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(152.705656 76.234835)">the gene tokens; the genes attend to it</text>
   </g>
   <g id="text_5">
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(308.546218 41.823346)">read at the deleted genes:</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(316.819843 47.026696)">the deletion profile</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(315.490843 52.173796)">(the public screens)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(305.081218 92.603098)">read at the mean over genes:</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(311.752843 97.806448)">host growth and fitness</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(308.286718 103.009798)">(the bAID wet-lab readout)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(432.030475 62.157359)">a mixture is a SET of</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(428.7796 67.234259)">compound tokens, each</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(431.716975 72.311159)">modulated by its own</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(438.388225 77.444309)">log-molar dose</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(433.851475 82.647659)">(proposed, not run)</text>
   </g>
   <g id="text_8">
    <text style="font-style: italic; font-size: 5.6px; font-family: 'Arial'; text-anchor: start" x="8.014251" y="132.80467" transform="rotate(-0 8.014251 132.80467)">the data</text>
   </g>
   <g id="text_9">
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(61.941258 164.83744)">the pooled chemogenomic table: 4 screens, 6,042,771 cells,</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(49.535883 169.98769)">5,463 compounds over 5,863 genes; 5,585,863 cells carry a molar dose</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(53.849133 175.19104)">Vanacloig 2022, Hillenmeyer HET, Hoepfner 2014, Wildenhain 2015</text>
   </g>
   <g id="text_10">
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(306.348311 164.86114)">the private Bioscreen runs of 2021: 977 wells, 6 inhibitors, one strain</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(304.886936 170.00824)">ex21 titrations (180 wells), ex23 combinations (197 wells, 63 of them),</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(351.306311 175.21159)">3 isobole grids (600 wells)</text>
   </g>
   <g id="text_11">
    <text style="font-style: italic; font-size: 5.6px; font-family: 'Arial'; text-anchor: start" x="8.014251" y="215.701732" transform="rotate(-0 8.014251 215.701732)">the evaluation</text>
   </g>
   <g id="text_12">
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(43.73954 243.81028)">public screens: compound-cold folds,</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(42.00254 248.95738)">the per-compound centered Spearman</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(38.61029 254.03428)">against each compound's reliability ceiling</text>
   </g>
   <g id="text_13">
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(203.150037 243.72043)">wet lab: growth over 63 combinations (AUROC)</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(204.878412 248.92378)">and fitness over the 21 that grew (Spearman),</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(213.947787 254.12713)">against Bliss (0.87) and Loewe (0.96)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(401.231285 243.752905)">the industrial reading:</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(395.49866 248.886055)">rank the worst combination</text>
    <text style="font-size: 4.8px; font-family: 'Arial'" transform="translate(396.297785 254.033155)">scenarios of a hydrolysate</text>
   </g>
   <g id="text_15">
    <text style="font-size: 5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #e53935" x="48.126339" y="12.402224" transform="rotate(-0 48.126339 12.402224)">✗</text>
   </g>
