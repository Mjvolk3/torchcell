
biocypher:
  offline: true
  debug: false
  # Head ontology: the sha256-pinned local mirror of Biolink 3.2.1 (issue #619),
  # never BioCypher's default GitHub URL, so generation does not depend on the
  # network. The path is inside the generation container, which mounts
  # $BUILD_ROOT/database/biocypher (a copy of the repo biocypher/) at /var/lib/neo4j/biocypher;
  # provenance in biocypher/ontology/biolink-model-v3.2.1.owl.ttl.provenance.json,
  # checked by torchcell.knowledge_graphs.head_ontology before BioCypher is built.
  head_ontology:
    url: /var/lib/neo4j/biocypher/ontology/biolink-model-v3.2.1.owl.ttl
    root_node: entity
  cache_directory: .cache

neo4j:
  delimiter: '\t'
  array_delimiter: '|'
  skip_duplicate_nodes: true
  skip_bad_relationships: true

  import_call_bin_prefix: /var/lib/neo4j/bin/
  # import_call_file_prefix omitted on purpose: stock biocypher uses the absolute
  # output_directory (.../biocypher-out/<timestamp>) verbatim, which resolves for
  # neo4j-admin inside the container. (The retired fork auto-joined relpath(outdir,cwd).)
  
  # Wipe DB before import (offline mode: --force)
  wipe: true
  # TODO set to false for community version or old neo4j
  # multi_db: true

  database_name: torchcell
  uri: neo4j://localhost:7687
  user: neo4j
  password: torchcell
