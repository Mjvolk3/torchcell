<svg xmlns="http://www.w3.org/2000/svg" width="179.00mm" height="137.37mm" viewBox="0 0 507.4 389.4" font-family="Arial, Helvetica, sans-serif"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="100%" height="100%" fill="#FFFFFF"/><text x="10.0" y="18.0" font-size="9" font-weight="700" fill="#2B2B2B">The torchcell experiment ontology</text><text x="10.0" y="27.0" font-size="6.5" fill="#666666">Every record is a typed genotype × environment → phenotype experiment, with provenance attached to each sourced value.</text><rect x="10.0" y="36.0" width="156.5" height="110.6" rx="3" fill="#FFFFFF" stroke="#D79B00" stroke-width="1"/><path d="M10.0 39.0 a3 3 0 0 1 3 -3 h150.5 a3 3 0 0 1 3 3 v17.0 h-156.5 Z" fill="#FFE6CC"/><text x="15.0" y="45.4" font-size="7" font-weight="700" fill="#D79B00">GENOTYPE</text><text x="161.5" y="45.4" font-size="6" text-anchor="end" fill="#D79B00">42 classes</text><text x="15.0" y="53.2" font-size="6" fill="#666666">1..n perturbations off a reference genome</text><text x="15.0" y="62.0" font-size="6" fill="#2B2B2B">GenePerturbation  ·  30 subtypes</text><text x="22.0" y="69.6" font-size="6" fill="#2B2B2B">CopyNumberVariantPerturbation</text><text x="22.0" y="77.2" font-size="6" fill="#2B2B2B">EngineeredCopyNumberPerturbation</text><text x="22.0" y="84.8" font-size="6" fill="#2B2B2B">ExpressionModulationPerturbation  ·  2</text><text x="22.0" y="92.4" font-size="6" fill="#2B2B2B">PresenceAbsencePerturbation  ·  13</text><text x="22.0" y="100.0" font-size="6" fill="#2B2B2B">SequencePerturbation  ·  10</text><text x="15.0" y="107.6" font-size="6" fill="#2B2B2B">BackgroundAllele, ConstructedOrf,</text><text x="15.0" y="115.2" font-size="6" fill="#2B2B2B">CrisprConstruct, ExpressionRangeMultiplier,</text><text x="15.0" y="122.8" font-size="6" fill="#2B2B2B">GenomicSpan, Genotype, HaplotypeBlock,</text><text x="15.0" y="130.4" font-size="6" fill="#2B2B2B">SegregantGenotype, SegregantParent,</text><text x="15.0" y="138.0" font-size="6" fill="#2B2B2B">StrainBackground, StrainConstruction</text><rect x="10.0" y="155.6" width="156.5" height="103.0" rx="3" fill="#FFFFFF" stroke="#B85450" stroke-width="1"/><path d="M10.0 158.6 a3 3 0 0 1 3 -3 h150.5 a3 3 0 0 1 3 3 v17.0 h-156.5 Z" fill="#F8CECC"/><text x="15.0" y="165.0" font-size="7" font-weight="700" fill="#B85450">ENVIRONMENT</text><text x="161.5" y="165.0" font-size="6" text-anchor="end" fill="#B85450">16 classes</text><text x="15.0" y="172.8" font-size="6" fill="#666666">medium × temperature × perturbation</text><text x="15.0" y="181.6" font-size="6" fill="#2B2B2B">Environment  ·  1 subtypes</text><text x="22.0" y="189.2" font-size="6" fill="#2B2B2B">Culture</text><text x="15.0" y="196.8" font-size="6" fill="#2B2B2B">EnvironmentPerturbation  ·  3 subtypes</text><text x="22.0" y="204.4" font-size="6" fill="#2B2B2B">BiologicPerturbation</text><text x="22.0" y="212.0" font-size="6" fill="#2B2B2B">EnvironmentPhysicalPerturbation</text><text x="22.0" y="219.6" font-size="6" fill="#2B2B2B">SmallMoleculePerturbation</text><text x="15.0" y="227.2" font-size="6" fill="#2B2B2B">Compound, CompoundIdentityRecord,</text><text x="15.0" y="234.8" font-size="6" fill="#2B2B2B">CompoundIdentityResolution, Concentration,</text><text x="15.0" y="242.4" font-size="6" fill="#2B2B2B">CultureFormat, Media, MediaComponent,</text><text x="15.0" y="250.0" font-size="6" fill="#2B2B2B">PreCulture, Solvent, Temperature</text><rect x="175.5" y="95.8" width="156.5" height="103.0" rx="3" fill="#FFFFFF" stroke="#D6B656" stroke-width="1"/><path d="M175.5 98.8 a3 3 0 0 1 3 -3 h150.5 a3 3 0 0 1 3 3 v17.0 h-156.5 Z" fill="#FFF2CC"/><text x="180.5" y="105.2" font-size="7" font-weight="700" fill="#D6B656">EXPERIMENT</text><text x="326.9" y="105.2" font-size="6" text-anchor="end" fill="#D6B656">32 classes</text><text x="180.5" y="113.0" font-size="6" fill="#666666">the typed record, paired with its control</text><text x="180.5" y="121.8" font-size="6" fill="#2B2B2B">Experiment  ·  1