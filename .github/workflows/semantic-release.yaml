name: Semantic Release

on:
  push:
    branches:
      - main
  # Manual recovery: build an EXISTING release tag and publish it (job `publish-tag`).
  # Never bumps a version. For a release whose PyPI step did not run or failed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish, for example v1.6.0"
        required: true
        type: string

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: release
    # The `pypi` environment is the trusted publisher registered on pypi.org for this
    # repository and this workflow file; PyPI mints a short-lived token from the OIDC
    # id-token, so no PyPI secret is stored.
    environment: pypi
    permissions:
      id-token: write
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        # PAT (admin-owned) so the version-bump push bypasses branch protection;
        # GITHUB_TOKEN / github-actions[bot] cannot bypass required status checks.
        token: ${{ secrets.TORCHCELL_SEMANTIC_RELEASE_TOKEN }}

    # Parses the commits since the last tag with scripts/release_parser.py; on a
    # bumping tag (API, REL, DB) it writes the version, commits, tags, runs
    # `build_command` (pyproject.toml, [tool.semantic_release]) and creates the
    # GitHub release. `released` is "false" on every other push.
    - name: Python Semantic Release
      id: release
      uses: python-semantic-release/python-semantic-release@v10.7.0
      with:
        github_token: ${{ secrets.TORCHCELL_SEMANTIC_RELEASE_TOKEN }}

    - name: Upload dist to the GitHub release
      if: steps.release.outputs.released == 'true'
      uses: python-semantic-release/publish-action@v10.7.0
      with:
        github_token: ${{ secrets.TORCHCELL_SEMANTIC_RELEASE_TOKEN }}
        tag: ${{ steps.release.outputs.tag }}

    - name: Publish dist to PyPI
      if: steps.release.outputs.released == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1

  # The same build and the same two uploads as a release-producing push, for a tag that
  # already exists. The trusted publisher on pypi.org is registered for this workflow
  # file and the `pypi` environment, so this job publishes with the same OIDC identity.
  publish-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency: release
    environment: pypi
    permissions:
      id-token: write
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag }}

    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Build the distribution from the tag
      run: python -m pip install build && python -m build

    # A tag vX.Y.Z must build torchcell-X.Y.Z; anything else means the tag does not sit
    # on its own bump commit, and publishing it would put a mislabeled file on PyPI.
    - name: Refuse a build whose version is not the tag's
      env:
        TAG: ${{ inputs.tag }}
      run: |
        version="${TAG#v}"
        ls -l dist
        test -f "dist/torchcell-${version}.tar.gz"
        test -f "dist/torchcell-${version}-py3-none-any.whl"

    - name: Upload dist to the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
      run: gh release upload "$TAG" dist/* --clobber

    - name: Publish dist to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
