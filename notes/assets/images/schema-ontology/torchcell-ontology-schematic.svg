0" fill="#B85450">ENVIRONMENT</text><text x="161.5" y="142.2" font-size="6" text-anchor="end" fill="#B85450">13 classes</text><text x="15.0" y="150.0" font-size="6" fill="#666666">medium × temperature × perturbation</text><text x="15.0" y="158.8" font-size="6" fill="#2B2B2B">EnvironmentPerturbation  ·  3 subtypes</text><text x="22.0" y="166.4" font-size="6" fill="#2B2B2B">BiologicPerturbation</text><text x="22.0" y="174.0" font-size="6" fill="#2B2B2B">EnvironmentPhysicalPerturbation</text><text x="22.0" y="181.6" font-size="6" fill="#2B2B2B">SmallMoleculePerturbation</text><text x="15.0" y="189.2" font-size="6" fill="#2B2B2B">Compound, CompoundIdentityRecord,</text><text x="15.0" y="196.8" font-size="6" fill="#2B2B2B">CompoundIdentityResolution, Concentration,</text><text x="15.0" y="204.4" font-size="6" fill="#2B2B2B">Environment, Media, MediaComponent, Solvent,</text><text x="15.0" y="212.0" font-size="6" fill="#2B2B2B">Temperature</text><rect x="175.5" y="80.6" width="156.5" height="95.4" rx="3" fill="#FFFFFF" stroke="#D6B656" stroke-width="1"/><path d="M175.5 83.6 a3 3 0 0 1 3 -3 h150.5 a3 3 0 0 1 3 3 v17.0 h-156.5 Z" fill="#FFF2CC"/><text x="180.5" y="90.0" font-size="7" font-weight="700" fill="#D6B656">EXPERIMENT</text><text x="326.9" y="90.0" font-size="6" text-anchor="end" fill="#D6B656">28 classes</text><text x="180.5" y="97.8" font-size="6" fill="#666666">the typed record, paired with its control</text><text x="180.5" y="106.6" font-size="6" fill="#2B2B2B">Experiment  ·  13 subtypes</text><text x="187.5" y="114.2" font-size="6" fill="#2B2B2B">CalMorph, EnvironmentResponse, Fitness,</text><text x="187.5" y="121.8" font-size="6" fill="#2B2B2B">GeneEssentiality, GeneInteraction,</text><text x="187.5" y="129.4" font-size="6" fill="#2B2B2B">Metabolite, MicroarrayExpression,</text><text x="187.5" y="137.0" font-size="6" fill="#2B2B2B">ProteinAbundance, PseudobulkExpression,</text><text x="187.5" y="144.6" font-size="6" fill="#2B2B2B">RNASeqExpression, SyntheticL