# experiments/040-inhibitor-synergy-wetlab/conf/mixture/r1_mix_van_anchors_off_L1_lh1.yaml
#
# ROUND 1, ARM mix_van_anchors_off_L1_lh1.
# The dose-free floor: 038 round 10's model with a host head fitted on the public IC30
# anchors alone. Nothing here can order a titration, so its ex21 per-compound Spearman
# is the control for the dose arms.
#
# ONE ARM PER FILE, five configs (the five compound-cold folds of fold seed 0), three
# seeds each, 50 epochs keeping the last, fitted on the non-test pool: the converged 038
# round 10 recipe (one-layer encoder, graph prior weight 0, env_layers as named below).
# Round 1 scores fold seed 0 only; the replication on fold seeds 1 and 2 (the 123
# evaluations 038 round 10 reports) is round 2, run on the arms that survive.
#
# WALL CLOCK, an estimate and not a measurement: 038's 15-config round of this recipe
# took 5 h 50 min at PARALLEL=2 on a GilaHyper RTX 6000 Ada (slurm 3080), so about
# 47 min of single-GPU time per config of three seeds. A step here runs one cell graph
# transformer forward per gene source plus one medium pass per condition group, so the
# per-step cost scales with the conditions a step touches: about 1.5 times 038's
# with one gene source. At PARALLEL=2 three configs land on one worker, so this file is
# estimated at 5 h on an A40 (taking an A40 as 1.4 times slower than the Ada).
#
#   sbatch --job-name=040-r1-van_anchors_off --export=ALL,SWEEP=conf/mixture/r1_mix_van_anchors_off_L1_lh1.yaml,PARALLEL=2 \
#     experiments/040-inhibitor-synergy-wetlab/scripts/gh_train_mixture.slurm
