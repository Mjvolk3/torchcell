# experiments/030-solid-growth-multi/conf/cgt_030_s3_q_tok_affine_005.yaml
#
# THE CLOSURE ARM ON THE QUERY-PAIR-DISJOINT SPLIT, COMPOSITE, PER ENTRY, AFFINE SOURCE
# CALIBRATION. cgt_030_s3_q_tok_embfit_004 with one change: the source dataset no longer
# enters the readouts as an 8-dim token (model.dataset_token.mode readout) but acts on
# their outputs as a per-dataset scale and shift, y_entry = scale[d] * y + shift[d]
# (mode affine, 15 x 2 x 2 parameters at the identity). Two sources with the same
# ontology on one genotype are then two linear instruments reading ONE predicted
# quantity: a screen can be matched in level and gain, never reordered. The readout
# token can reorder genotypes per source, which is the capacity this arm removes.
#
# What to read against embfit_004 at the same budget and seed: the pooled
# val/gene_interaction/Pearson (which carries the between-screen offset, learned by
# both arms), the per-token val/token/Tmi*/gene_interaction/Pearson (the within-screen
# read, where the two arms can differ), val/crosstoken (the 2018 rows under the 2020
# calibration and back), and the learned cal/<label>/<source>/{scale,shift}.
#
# First test (2026-10-21): the 1/4 S3Q fraction on GilaHyper, one GPU per arm, 40 epochs,
# seed 1, beside the readout control:
#
#   sbatch -J 030-aff-q4-s1 experiments/030-solid-growth-multi/scripts/gh_cgt_030.slurm \
#       cgt_030_s3_q_tok_affine_005 +seed=1 \
#       subset.indices=subset_S3Q_frac4_indices_030.json.gz transforms.fit_stats_strict=false \
#       trainer.max_epochs=40
defaults:
  - cgt_030_s3_q_tok_embfit_004
  - _self_

wandb:
  tags: [s3, s3_strict, split_Q, query_pair_disjoint, graph_reg_kl, fitness_joint, closure_doubles, unpinned_to_train, seq_embedding, full_gene_composite, param_matched, perturb_cls, cls_linear_readout, const_lr, const_lr_2.5e-4, per_entry, dataset_token, no_holdout, token_affine]

model:
  dataset_token:
    enabled: true
    mode: affine
    # Both factors live. scale: false is the offset-only arm, shift: false gain-only.
    scale: true
    shift: true
