# Round 13, GPU: per-compound target scaling. The final losses added to the W&B view
# (wandb_view.py) showed the MSE the models are trained on is dominated by one compound:
# crystal violet has 14 times the median compound's variance across strains and carries
# 24.7% of the total, so whenever it is in the fit it takes a quarter of the loss, while
# the score, a per-compound rank correlation, weights every compound equally. Here each
# fitted compound's profile is z-scored across strains before the fit (target_scale:
# per_compound). Otherwise identical to the round-9 bilinear control (one-layer encoder,
# prior weight 0, fit on the non-test pool, fixed 50 epochs, three seeds averaged, five
# folds on fold seeds 0, 1, 2), which is the paired comparison. PARALLEL=2.
