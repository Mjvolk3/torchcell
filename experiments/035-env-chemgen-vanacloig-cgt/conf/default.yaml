# experiments/035-env-chemgen-vanacloig-cgt/conf/default.yaml
#
# One arm on one compound-cold fold of Vanacloig 2022. Override on the command line:
#   arm=cgt_genes|cgt_env|embedding_env  fold=0..4  seed=0
#
# The model half is experiments/025-solid-growth/conf/cgt_s0_r_kl_000.yaml, which is the
# 010 configuration, with one change the 031 plan asks for: the graph prior at
# graph_reg_lambda 1, the best fixed-epoch setting of the 025 graph-regularization sweep.

arm: cgt_env
fold: 0
seed: 0
gpu: true
# runs of one launch land in results/<results_subdir>/<arm>/, so a smoke run cannot
# overwrite a round
results_subdir: runs

wandb:
  project: torchcell_035-env-chemgen-vanacloig-cgt
  tags: [vanacloig, compound_cold, preliminary]

data:
  # written by experiments/033-env-chemgen-pooled/scripts/flatten_cells.py (slurm 2988)
  cell_table: /scratch/projects/torchcell-scratch/experiments/033-env-chemgen-pooled/cell_table/cell_table.parquet
  # written by experiments/031-env-chemgen-inhibitor-tolerance/scripts/embed_compounds.py;
  # FCFP4 counts are the 031 default, the best ridge feature on the centered target
  embedding: /home/michaelvolk/Documents/projects/torchcell.worktrees/exp/031-env-chemgen-vanacloig-hillenmeyer/experiments/031-env-chemgen-inhibitor-tolerance/results/embeddings/fcfp4_count.npz

folds:
  n_folds: 5
  n_val: 4
  seed: 0

cell_dataset:
  graphs: [
      physical,
      regulatory,
      tflink,
      string12_0_neighborhood,
      string12_0_fusion,
      string12_0_cooccurence,
      string12_0_coexpression,
      string12_0_experimental,
      string12_0_database,
    ]

trainer:
  max_epochs: 30
  batch_size: 256
  eval_batch_size: 512
  clip_grad_norm: 10.0
  limit_train_batches: null

optimizer:
  lr: 5e-4
  weight_decay: 1e-8
  warmup_fraction: 0.05

loss:
  graph_reg_lambda: 1.0

model:
  gene_num: 6607
  hidden_channels: 180
  num_transformer_layers: 8
  num_attention_heads: 9
  dropout: 0.1

  learnable_embedding:
    enabled: true
    size: ${model.hidden_channels}
    preprocessor:
      num_layers: 2
      dropout: 0.1

  graph_regularization:
    graph_reg_lambda: 1.0
    graph_reg_layer: 1 # python indexed
    row_sampling_rate: 1.0
    regularized_heads:
      physical:
        layer: ${model.graph_regularization.graph_reg_layer}
        head: 0
        lambda: ${model.graph_regularization.graph_reg_lambda}
      regulatory:
        layer: ${model.graph_regularization.graph_reg_layer}
        head: 1
        lambda: ${model.graph_regularization.graph_reg_lambda}
      tflink:
        layer: ${model.graph_regularization.graph_reg_layer}
        head: 2
        lambda: ${model.graph_regularization.graph_reg_lambda}
      string12_0_neighborhood:
        layer: ${model.graph_regularization.graph_reg_layer}
        head: 3
        lambda: ${model.graph_regularization.graph_reg_lambda}
      string12_0_fusion:
        layer: ${model.graph_regularization.graph_reg_layer}
        head: 4
        lambda: ${model.graph_regularization.graph_reg_lambda}
      string12_0_cooccurence:
        layer: ${model.graph_regularization.graph_reg_layer}
        head: 5
        lambda: ${model.graph_regularization.graph_reg_lambda}
      string12_0_coexpression:
        layer: ${model.graph_regularization.graph_reg_layer}
        head: 6
        lambda: ${model.graph_regularization.graph_reg_lambda}
      string12_0_experimental:
        layer: ${model.graph_regularization.graph_reg_layer}
        head: 7
        lambda: ${model.graph_regularization.graph_reg_lambda}
      string12_0_database:
        layer: ${model.graph_regularization.graph_reg_layer}
        head: 8
        lambda: ${model.graph_regularization.graph_reg_lambda}

  perturbation_head:
    num_heads: 9
    dropout: 0.1

hydra:
  run:
    dir: ${oc.env:DATA_ROOT}/hydra-outputs/035-env-chemgen-vanacloig-cgt/${now:%Y-%m-%d}/${now:%H-%M-%S}
