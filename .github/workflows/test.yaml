name: Pytest with Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pytest-coverage:
    runs-on: ubuntu-latest
    # Blocking (#16): the CI-fragile tests are hardened -- test_s288c has a module-level
    # DATA_ROOT skip, the wall-clock benchmark is gpu-marked (deselected), the PyG-batch
    # test is DATA_ROOT-guarded, and test_cleanup_lock_files is filelock-version-robust --
    # and the torch/torch-scatter install is CPU-only + prebuilt-wheel (no source build).
    # `pytest tests/torchcell -m "not gpu"` gates PRs. See
    # notes/plan.pytest-ci-blocking.2026.07.01.md.

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history: the diff-cover and paired-test gates below diff against the
        # origin/main merge base, which a depth-1 checkout does not have (the failure
        # mypy.yaml documents at its git fetch step).
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"

    # Cache the dependencies
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('env/requirements.txt', 'env/requirements_dependent.txt', 'env/requirements_test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        # CPU-only torch on the runner (no GPU): avoids ~2GB of unused CUDA libraries
        # and CUDA-init noise, and matches the prebuilt +cpu torch-scatter wheel below.
        pip install "torch==2.11.0" --index-url https://download.pytorch.org/whl/cpu
        pip install -r env/requirements.txt

    - name: Install base-dependent dependencies (torch-scatter, prebuilt CPU wheel)
      run: |
        # Prebuilt CPU torch-scatter wheel matched to the CPU torch above -- no source
        # compile, no --no-build-isolation (which turned red under torch 2.11 on CPU CI).
        pip install -r env/requirements_dependent.txt -f https://data.pyg.org/whl/torch-2.11.0+cpu.html

    - name: Install test dependencies
      run: |
        pip install -r env/requirements_test.txt

    - name: Install torchcell package
      run: |
        pip install -e .

    # Blocking (WS4, then plan.test-suite-buildout Phase 0a): plain pytest is the
    # hermetic contract. tests/conftest.py sets a sentinel DATA_ROOT, skips every
    # gpu/slow/data/neo4j/network/wandb-marked test unless its flag is given, and
    # fails any unmarked test that reaches the network, a cluster, Neo4j, or wandb.
    - name: Run pytest with coverage (blocking)
      run: |
        coverage run -m pytest tests/torchcell
        coverage report
        coverage xml

    # Anti-padding lint (Decision 19): a test with no assertion, a truthiness-only
    # parametrized sweep, or a torchcell call nothing is asserted on fails the job.
    - name: Test quality lint (blocking)
      run: python scripts/test_quality_check.py tests

    # Paired-test gate (Decision 22): every module added under torchcell/ ships its
    # mirrored test or an entry in pyproject [tool.torchcell.test_exceptions].
    # ADDED-only until the legacy move lands; then --strict (added or modified).
    - name: Paired tests for new torchcell modules (blocking)
      run: |
        git fetch origin main || true
        python scripts/check_paired_tests.py --base origin/main

    # Diff coverage (Decision 21): the lines this PR adds or changes under torchcell/
    # must be at least 80% covered by the run above. Empty on a push to main.
    - name: Diff coverage of changed lines (blocking)
      run: |
        diff-cover coverage.xml --compare-branch=origin/main --fail-under=80 \
          --exclude 'torchcell/legacy/*' 'torchcell/scratch/*' 'torchcell/experiments/*'

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      # Keep coverage upload best-effort now that the job blocks -- a Codecov outage or
      # missing token must not fail the (now-required) pytest gate.
      continue-on-error: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
