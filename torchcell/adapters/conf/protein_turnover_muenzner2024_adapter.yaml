# torchcell/adapters/conf/protein_turnover_muenzner2024_adapter.yaml
# [[torchcell.adapters.conf.protein_turnover_muenzner2024_adapter.yaml]]
# https://github.com/Mjvolk3/torchcell/tree/main/torchcell/adapters/conf/protein_turnover_muenzner2024_adapter.yaml
# Test file: tests/torchcell/adapters/test_muenzner2024_adapter.py
#
# Muenzner 2024 dynamic-SILAC turnover: 55 ProteinTurnoverExperiment records (SI Table 17).
# COMPACT GENOTYPE, as for Caudal 2024: each natural isolate carries ~5k perturbations
# off S288C (sequence variants, natural presences and absences from Peter 2018), held on
# the genotype node (serialized_data + systematic_gene_names) and off-graph in the
# sha256-pinned Peter tier. The per-perturbation node and perturbation->genotype edge
# methods are therefore not enabled; no environment perturbation is carried.
cell_adapter:
  node_methods:
    - method_name: "experiment reference"
    - method_name: "genome"
    - method_name: "experiment (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "genotype (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "environment (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "environment reference"
    - method_name: "media (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "media reference"
    - method_name: "temperature (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "temperature reference"
    - method_name: "protein turnover phenotype (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "protein turnover phenotype reference"
    - method_name: "dataset"
    - method_name: "publication (chunked)"
      memory_reduction_factor: 1.0

  edge_methods:
    - method_name: "experiment reference to dataset"
    - method_name: "experiment to dataset (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "experiment reference to experiment (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "genotype to experiment (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "environment to experiment (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "environment to experiment reference"
    - method_name: "phenotype to experiment (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "media to environment (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "temperature to environment (chunked)"
      memory_reduction_factor: 1.0
    - method_name: "genome to experiment reference"
    - method_name: "phenotype to experiment reference"
    - method_name: "publication to experiment (chunked)"
      memory_reduction_factor: 1.0
