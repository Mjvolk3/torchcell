<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>torchcell ontology explorer</title><style>
  :root {
    /* Warm-paper neutrals: the accents are all warm primaries, so the ground is
       biased warm to match rather than fight them. */
    --bg:#F4F1EA; --stage:#EFEBE2; --fg:#221F1A; --muted:#6E675B;
    --line:#E2DBCE; --panel:#FBF9F4; --grid:rgba(120,108,86,.09);
    --accent:#D79B00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16130D; --stage:#100E09; --fg:#ECE6DA; --muted:#9B9384;
             --line:#2F2A20; --panel:#1C1811; --grid:rgba(214,155,0,.07); }
  }
  :root[data-theme="dark"] {
    --bg:#16130D; --stage:#100E09; --fg:#ECE6DA; --muted:#9B9384;
    --line:#2F2A20; --panel:#1C1811; --grid:rgba(214,155,0,.07);
  }
  :root[data-theme="light"] {
    --bg:#F4F1EA; --stage:#EFEBE2; --fg:#221F1A; --muted:#6E675B;
    --line:#E2DBCE; --panel:#FBF9F4; --grid:rgba(120,108,86,.09);
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    font:13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; background:var(--bg); color:var(--fg); overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #bar {
    position:fixed; inset:0 0 auto 0; height:54px; z-index:6;
    display:flex; align-items:center; gap:14px; padding:0 16px;
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  .brand { display:flex; align-items:baseline; gap:8px; }
  .brand b { font-size:14px; font-weight:700; letter-spacing:.02em; }
  .brand em {
    font-family:ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-style:normal; font-size:11px; color:var(--muted);
    letter-spacing:.04em;
  }
  .hourglass { width:16px; height:16px; flex:0 0 auto; }
  #q {
    flex:0 1 300px; padding:7px 11px; border:1px solid var(--line);
    border-radius:7px; background:var(--bg); color:var(--fg);
    font:12px/1 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; letter-spacing:.02em;
  }
  #q:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  .tools { display:flex; gap:6px; margin-left:auto; }
  button {
    padding:7px 11px; border:1px solid var(--line); border-radius:7px;
    background:var(--bg); color:var(--fg); font:12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; cursor:pointer;
  }
  button:hover { border-color:var(--muted); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  #count { font-family:ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size:11px; color:var(--muted); align-self:center; }

  /* Lane rail: legend and filter in one. Each chip = one domain of the schema. */
  #rail {
    position:fixed; top:54px; left:0; right:0; z-index:5;
    display:flex; flex-wrap:wrap; gap:7px; padding:9px 16px;
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  .lchip {
    display:inline-flex; align-items:center; gap:7px; padding:4px 10px 4px 8px;
    border:1px solid var(--line); border-radius:20px; background:var(--bg);
    font:11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; cursor:pointer; user-select:none;
    transition:opacity .12s, border-color .12s;
  }
  .lchip .dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .lchip .n { font-family:ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; color:var(--muted); font-size:10px; }
  .lchip[aria-pressed="false"] { opacity:.4; }
  .lchip:hover { border-color:var(--muted); }

  #stage {
    position:fixed; inset:96px 0 0 0; overflow:hidden; cursor:grab;
    background:var(--stage);
    background-image:linear-gradient(var(--grid) 1px, transparent 1px),
                     linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:26px 26px;
  }
  #stage.drag { cursor:grabbing; }
  /* Concrete px size comes from the viewBox at runtime; see the script below. */
  #map { position:absolute; top:0; left:0; transform-origin:0 0; }
  #map .lod-detail { transition:opacity .12s linear; }
  #stage.coarse #map .lod-detail { opacity:0; }
  #stage.coarse #map .compose:not(.backbone) { opacity:0; }
  .node { cursor:pointer; }
  .node.dim { opacity:.1; }
  .node.hit .card { stroke-width:3.4; }

  #panel {
    position:fixed; top:54px; right:0; bottom:0; width:360px; z-index:7;
    background:var(--panel); border-left:1px solid var(--line);
    overflow:auto; padding:18px 20px 40px; transform:translateX(100%);
    transition:transform .18s ease; box-shadow:-14px 0 34px rgba(20,16,8,.08);
  }
  #panel.open { transform:none; }
  #panel .kicker {
    font-family:ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.11em; font-weight:600;
  }
  #panel h2 { font:600 20px/1.2 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; margin:5px 0 0; word-break:break-word; }
  #panel .doc { color:var(--muted); margin:11px 0 4px; font-size:12.5px; }
  #panel h3 {
    font:600 10.5px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; text-transform:uppercase; letter-spacing:.09em;
    color:var(--muted); margin:20px 0 8px;
  }
  #panel table { width:100%; border-collapse:collapse; }
  #panel td {
    padding:5px 0; vertical-align:top; border-bottom:1px solid var(--line);
    font-size:12px;
  }
  #panel td.n { font-family:ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size:11.5px; }
  #panel td.t {
    color:var(--muted); text-align:right; padding-left:10px; white-space:nowrap;
    font-family:ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size:10.5px;
  }
  #panel .req { color:var(--accent); font-weight:700; }
  #panel .desc { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
  .chip {
    display:inline-flex; align-items:center; gap:6px; padding:3px 9px;
    margin:0 5px 5px 0; border-radius:14px; border:1px solid var(--line);
    background:var(--bg); font:11px/1.2 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; cursor:pointer;
  }
  .chip .dot { width:7px; height:7px; border-radius:50%; }
  .chip:hover { border-color:var(--muted); }
  #close {
    position:absolute; top:14px; right:16px; padding:4px 9px; font-family:ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  #hint {
    position:fixed; left:16px; bottom:14px; z-index:4; font-size:11px;
    color:var(--muted); background:var(--panel); border:1px solid var(--line);
    border-radius:7px; padding:7px 11px; font-family:ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (max-width:760px) {
    #panel { width:100%; } .brand em { display:none; }
  }
</style>
</head>

<div id="bar">
  <span class="brand"><svg class="hourglass" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2 H13 L8 8 Z" fill="#D79B00"/><path d="M3 14 H13 L8 8 Z" fill="#9673A6"/><path d="M3 2 H13 M3 14 H13" stroke="#666666" stroke-width="1.4" stroke-linecap="round"/></svg><b>torchcell ontology</b>
    <em>genotype × environment → phenotype</em></span>
  <input id="q" type="search" placeholder="search classes, fields, values…"
         aria-label="search" />
  <span id="count"></span>
  <span class="tools">
    <button id="fit">Fit</button>
    <button id="zin" aria-label="zoom in">+</button>
    <button id="zout" aria-label="zoom out">&minus;</button>
  </span>
</div>
<div id="rail" aria-label="filter by domain"></div>

#D6B656">EXPERIMENT</text><text x="2534.0" y="54.0" font-size="13.0" fill="#666666">the typed record and its reference</text><text x="4320.0" y="38.0" font-size="13.0" text-anchor="end" fill="#D6B656" fill-opacity="0.75">74 classes</text></g><g class="lane" id="lane-phenotype"><rect x="4400.0" y="0.0" width="1230.0" height="5631.2" rx="10" fill="#E1D5E7" fill-opacity="0.26" stroke="#9673A6" stroke-width="1.4"/><text x="4426.0" y="38.0" font-size="34.0" font-weight="700" fill="#9673A6">PHENOTYPE</text><text x="4426.0" y="54.0" font-size="13.0" fill="#666666">what was measured</text><text x="5604.0" y="38.0" font-size="13.0" text-anchor="end" fill="#9673A6" fill-opacity="0.75">37 classes</text></g><g class="lane" id="lane-provenance"><rect x="5684.0" y="0.0" width="1846.0" height="603.0" rx="10" fill="#DAE8FC" fill-opacity="0.26" stroke="#6C8EBF" stroke-width="1.4"/><text x="5710.0" y="38.0" font-size="34.0" font-weight="700" fill="#6C8EBF">PROVENANCE</text><text x="5710.0" y="54.0" font-size="13.0" fill="#666666">where the record came from</text><text x="7504.0" y="38.0" font-size="13.0" text-anchor="end" fill="#6C8EBF" fill-opacity="0.75">9 classes</text></g><g class="lane" id="lane-enum"><rect x="5684.0" y="649.0" width="2182.0" height="1013.8" rx="10" fill="#F5F5F5" fill-opacity="0.26" stroke="#666666" stroke-width="1.4"/><text x="5710.0" y="687.0" font-size="34.0" font-weight="700" fill="#666666">CONTROLLED VOCABULARIES</text><text x="5710.0" y="703.0" font-size="13.0" fill="#666666"></text><text x="7840.0" y="687.0" font-size="13.0" text-anchor="end" fill="#666666" fill-opacity="0.75">51 classes</text></g><path class="compose" data-src="BackgroundAllele" data-dst="AlleleEdit" d="M284.0 260.9 C2562.9 260.9 3431.1 777.7 5710.0 777.7" fill="none" stroke="#666666" stroke-width="0.6" stroke-opacity="0.3" stroke-dasharray="3 2.5"/><path class="compose" data-src="BackgroundAllele" data-dst="Zygosity" d="M284.0 286.1 C3349.2 286.1 4516.8 1581.2 7582.0 1581.2" fill="none tures differ from one another ONLY here).","refs":[]},{"name":"growth_phase","type":"CultureGrowthPhase | None","required":false,"desc":"the growth phase the culture is held in as the condition (a stationary-phase starvation arm); None when the source states none, and then left out of the dump, so an environment without it serializes exactly as it did before the field existed (the Genotype.natural_isolate precedent)","refs":["CultureGrowthPhase"]}]},{"name":"EnvironmentPerturbation","kind":"model","lane":"environment","doc":"Base: a defined change to the growth environment vs the base medium.","parent":"ProvenanceGapMixin","children":["BiologicPerturbation","EnvironmentPhysicalPerturbation","PhagePerturbation","PhysicalExposurePerturbation","SmallMoleculePerturbation"],"abstract":true,"inherited":1,"members":[],"fields":[{"name":"perturbation_type","type":"str","required":true,"desc":"","refs":[]},{"name":"description","type":"str","required":true,"desc":"","refs":[]}]},{"name":"EnvironmentPhysicalPerturbation","kind":"model","lane":"environment","doc":"A neutral, scalar physical/physiological environment FACTOR (pH, osmolarity, ...).","parent":"EnvironmentPerturbation","children":[],"abstract":false,"inherited":1,"members":[],"fields":[{"name":"perturbation_type","type":"Literal['environment_physical']","required":false,"desc":"","refs":[]},{"name":"description","type":"str","required":false,"desc":"","refs":[]},{"name":"factor","type":"PhysicalFactor","required":true,"desc":"the neutral physical variable changed","refs":["PhysicalFactor"]},{"name":"magnitude","type":"Concentration | None","required":false,"desc":"typed value+unit of the factor; None for a purely qualitative change","refs":["Concentration"]},{"name":"agent","type":"Compound | None","required":false,"desc":"chemical species realizing the factor (e.g. the salt for osmolarity)","refs":["Compound"]}]},{"name":"EnvironmentResponseExperiment","kind":"model","lane":"experiment","doc":"Experiment measuring a strain's response to an environmental perturbation.","parent":"Experiment","children":["StrainEnvironmentResponseExperiment"],"abstract":true,"inherited":2,"members":[],"fields":[{"name":"experiment_type","type":"str","required":false,"desc":"","refs":[]},{"name":"genotype","type":"Genotype | list[Genotype]","required":true,"desc":"","refs":["Genotype"]},{"name":"phenotype","type":"EnvironmentResponsePhenotype","required":true,"desc":"","refs":["EnvironmentResponsePhenotype"]}]},{"name":"EnvironmentResponseExperimentReference","kind":"model","lane":"experiment","doc":"Reference (control) context for an environment-response experiment.","parent":"ExperimentReference","children":["StrainEnvironmentResponseExperimentReference"],"abstract":true,"inherited":3,"members":[],"fields":[{"name":"experiment_reference_type","type":"str","required":false,"desc":"","refs":[]},{"name":"phenotype_reference","type":"EnvironmentResponsePhenotype","required":true,"desc":"","refs":["EnvironmentResponsePhenotype"]}]},{"name":"EnvironmentResponsePhenotype","kind":"model","lane":"phenotype","doc":"A strain's fitness/growth RESPONSE to an environmental perturbation.","parent":"Phenotype","children":[],"abstract":false,"inherited":1,"members":[],"fields":[{"name":"graph_level","type":"str","required":false,"desc":"","refs":[]},{"name":"label_name","type":"str","required":false,"desc":"","refs":[]},{"name":"label_statistic_name","type":"str | None","required":false,"desc":"","refs":[]},{"name":"measurement_type","type":"MeasurementType","required":true,"desc":"what the response number is (log2_ratio, z_score, ...)","refs":["MeasurementType"]},{"name":"assay_type","type":"AssayType | None","required":false,"desc":"HOW the response was measured (experimental design); orthogonal to measurement_type (WHAT the number is). Free-text units is NOT a substitute for this typed method axis. None until sourced; a genuine absence is a ProvenanceGap on 'assay_type'.","refs":["AssayType"]},{"name":"environment_response","type":"float | None","required":false,"desc":"signed numeric score (log2 ratio, z-score, sensitivity score, growth rate); None only for a purely categorical readout","refs":[]},{"name":"category","type":"ResponseCategory | None","required":false,"desc":"the qualitative call on the shared ResponseCategory axis; None for purely numeric readouts","refs":["ResponseCategory"]},{"name":"category_label","type":"str | None","required":false,"desc":"the source's own word or symbol for that call, verbatim (e.g. '++', 'tolerant', 'wild type', the ordinal '4'), so the mapping onto ResponseCategory is auditable and nothing the source said is lost. Requires `category`: a label with no typed call is the free-text state this axis replaces.","refs":[]},{"name":"environment_response_se","type":"float | None","required":false,"desc":"standard error of the response (primary uncertainty statistic)","refs":[]},{"name":"environment_response_uncertainty","type":"float | None","required":false,"desc":"source-reported uncertainty number, verbatim (meaning given by environment_response_uncertainty_type)","refs":[]},{"name":"environment_response_uncertainty_type","type":"UncertaintyType | None","required":false,"desc":"what environment_response_uncertainty IS (sample_sd, ...)","refs":["UncertaintyType"]},{"name":"n_samples","type":"int | None","required":false,"desc":"number of independent replicate measurements of the response","refs":[]},{"name":"sample_unit","type":"SampleUnit | None","required":false,"desc":"what one sample in n_samples is (biological_replicate, ...)","refs":["SampleUnit"]},{"name":"units","type":"str | None","required":false,"desc":"human-readable definition/units of the score, e.g. 'log2(inhibitor/control)'","refs":[]},{"name":"screen_id","type":"str | None","required":false,"desc":"the source's own identifier for the SCREEN this measurement came from (Hoepfner 2014's internal study number, a plate/round id). A compound at one dose can be screened more than once, and once the compound name is cleaned those runs become indistinguishable: Hoepfner has 45 columns that collide on (compound, dose) alone, so the screen id is what keeps one strain x one condition L1-unique instead of silently merging independent measurements.","refs":[]},{"name":"environment_response_lower","type":"float | None","required":false,"desc":"the SOURCE's lower confidence limit of the response, verbatim, at `confidence_level`. The counterpart of FluxPhenotype.net_flux_lower: a two-sided bound is not a single number, so naming one side as THE statistic (feeding a half-width to UncertaintyType.ci95) would misreport it. Caglar 2017 Table S5's interval is asymmetric in 55 of 55 rows (upper-to-lower half-width ratio median 1.3187), which is what makes a half-width field unusable for it.","refs":[]},{"name":"environment_response_upper","type":"float | None","required":false,"desc":"the SOURCE's upper confidence limit of the response, verbatim, at `confidence_level`. Deliberately NOT validated to lie above `environment_response`: a limit carried through a nonlinear transform can come out below the value or negative (Caglar 2017 Table S5 Glycerol replicate 1 releases 95p = -1027.769034, the image under DT = log_e 2 / slope of a slope interval that straddles zero), and repairing or dropping it would substitute our arithmetic for the released bytes. The environment-response verifier's L2 `interval_orientation` rule counts such rows against a DECLARED oracle, so the count is measured and a regression in it fails the gate.","refs":[]},{"name":"confidence_level","type":"float | None","required":false,"desc":"the level the two limits are stated at, as a fraction (0.95 for a 95% interval). Required whenever either limit is set -- an unlabeled interval is the state the typed uncertainty axis exists to prevent.","refs":[]},{"name":"replicate_id","type":"str | None","required":false,"desc":"the source's own identifier for ONE replicate measurement of a (strain, condition), when the release is per replicate rather than an aggregate (Caglar 2017 Table S5's `replicate` column: one row per biological replicate growth curve, each with its own interval and r^2). It joins the L1 uniqueness key, so independently released replicate curves stay distinct records instead of colliding as duplicates and nothing has to be aggregated into a mean the source never released. None when the source releases one aggregated measurement per (strain, condition), which is every other dataset.","refs":[]},{"name":"environment_response_p_value","type":"float | None","required":false,"desc":"the UNADJUSTED p-value the source released for this response's test, as a probability in [0, 1], verbatim (a released 0 is stored as 0; it is the source's rounding of a small value, not a placeholder). The test itself is named in `units` or the dataset's provenance (Wang 2024: TRANSIT resampling, a permutation test of the log2FC). None when the source releases no test.","refs":[]},{"name":"environment_response_p_value_adjusted","type":"float | None","required":false,"desc":"the multiple-testing-adjusted p-value the source released for the same test, as a probability in [0, 1], verbatim; p_value_adjustment_method names the correction","refs":[]},{"name":"p_value_adjustment_method","type":"str | None","required":false,"desc":"the multiple-testing correction behind environment_response_p_value_adjusted, e.g. 'benjamini_hochberg' (the same vocabulary as ProteinFoldChangePhenotype.p_value_adjustment_method). Required whenever an adjusted p-value is stored and forbidden otherwise","refs":[]},{"name":"environment_response_t_statistic","type":"float | None","required":false,"desc":"the test statistic the source released for this response, verbatim. For RB-TnSeq it is the moderated t of Wetmore 2015 (Methods (iv)): t = f / sqrt(sigma^2 + max(V_e, V_n)) with sigma = 0.1, so it is a function of the response and its standard error and is stored because the release states it, not recomputed. The statistic is named in `units` or the dataset's provenance. None when the source releases no statistic.","refs":[]},{"name":"environment_response_z_score","type":"float | None","required":false,"desc":"the Z score the source released for this response, verbatim. Its definition is the source's, named in `units` or the dataset's provenance; for Wang 2018 it is equation (4), the response divided by the standard deviation of a normal fitted to the non-targeting guides' fitness, one constant per screen, so it is a released rescaling of the response and not a dispersion of it. None when the source releases no Z score.","refs":[]}]},{"name":"EssentialityEvidenceClass","kind":"enum","lane":"enum","doc":"The PHYSICAL observation a gene-essentiality call rests on (#924).","parent":null,"children":[],"abstract":false,"inherited":0,"members":["mutant_recovery","insertion_depletion","curated_annotation"],"fields":[]},{"name":"EssentialityEvidenceType","kind":"enum","lane":"enum","doc":"The readout and rule that turn the observation into the call (#924).","parent":null,"children":[],"abstract":false,"inherited":0,"members":["construction_outcome","genetic_footprinting","tradis_insertion_index","rb_tnseq_coverage_and_fitness","curated_null_phenotype","tnseq_hmm_state"],"fields":[]},{"name":"EssentialityStatement","kind":"model","lane":"phenotype","doc":"One verbatim statement of the source about its essentiality call, and its role.","parent":null,"children":[],"abstract":false,"inherited":0,"members":[],"fields":[{"name":"role","type":"EssentialityStatementRole","required":true,"desc":"","refs":["EssentialityStatementRole"]},{"name":"provenance","type":"SourcedValue","required":true,"desc":"the statement, verbatim with its source's sha256","refs":[]}]},{"name":"EssentialityStatementRole","kind":"enum","lane":"enum","doc":"The role a sourced statement plays in a gene-essentiality call's evidence.","parent":null,"children":[],"abstract":false,"inherited":0,"membe const vb = map.getAttribute('viewBox').split(/\s+/).map(Number);
const W = vb[2], H = vb[3];
map.style.width = W + 'px';
map.style.height = H + 'px';
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);

// --- pan / zoom -------------------------------------------------------------
let z = 1, tx = 0, ty = 0;
function apply() {
  map.style.transform = `translate(${tx}px,${ty}px) scale(${z})`;
  stage.classList.toggle('coarse', z < 0.34);
}
function fit() {
  const r = stage.getBoundingClientRect();
  z = Math.min(r.width / W, r.height / H) * 0.96;
  tx = (r.width - W * z) / 2; ty = (r.height - H * z) / 2;
  apply();
}
function zoomTo(name, scale) {
  const el = document.getElementById('node-' + name);
  if (!el) return;
  const b = el.getBBox(), r = stage.getBoundingClientRect();
  z = scale || 1.5;
  tx = r.width / 2 - (b.x + b.width / 2) * z;
  ty = r.height / 2 - (b.y + b.height / 2) * z;
  apply();
}
stage.addEventListener('wheel', e => {

  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  tx = drag.tx + dx; ty = drag.ty + dy; apply();
});
stage.addEventListener('pointerup', () => { drag = null; stage.classList.remove('drag'); });
document.getElementById('fit').onclick = fit;
document.getElementById('zin').onclick = () => { z = Math.min(9, z * 1.4); apply(); };
document.getElementById('zout').onclick = () => { z = Math.max(0.04, z / 1.4); apply(); };

// --- detail drawer ----------------------------------------------------------
const panel = document.getElementById('panel'), body = document.getElementById('body');
document.getElementById('close').onclick = () => panel.classList.remove('open');
const chip = nm => {
  const c = byName.get(nm);
  const col = c ? laneColor(c.lane) : '#888';
  return `<span class="chip" data-go="${nm}"><span class="dot" style="background:${col}"></span>${esc(nm)}</span>`;
};
function show(name) {
  const c = byName.get(name);
  if (!c) return;
  const lane = LANES[c.lane] || { title: c.lane, color: '#888' };
  const head = lane.title.split(' \u2014 ')[0];
  let h = `<div class="kicker" style="color:${lane.color}">${esc(head)}` +
          `${c.abstract ? ' \u00b7 abstract base' : ''}</div>`;
  h += `<h2>${esc(c.name)}</h2>`;
  if (c.doc) h += `<div class="doc">${esc(c.doc)}</div>`;
  if (c.parent) h += `<h3>inherits from</h3>${chip(c.parent)}`;
  if (c.children.length)
    h += `<h3>specialised by (${c.children.length})</h3>` + c.children.map(chip).join('');
  if (c.kind === 'enum') {
    h += `<h3>values (${c.members.length})</h3><table>` +
         c.members.map(m => `<tr><td class="n">${esc(m)}</td></tr>`).join('') + '</table>';
  } else {
    h += `<h3>declared fields (${c.fields.length}` +
         (c.inherited ? `, +${c.inherited} inherited` : '') + `)</h3><table>`;
    for (const f of c.fields) {
      h += `<tr><td class="n">${esc(f.name)}` +
           `${f.required ? '' : '<span class="req"> ?</span>'}` +
           (f.desc ? `<span class="desc">${esc(f.desc)}</span>` : '') +
           `</td><td class="t">${esc(f.type)}</td></tr>`;
    }
    h += '</table>';
    const refs = [...new Set(c.fields.flatMap(f => f.refs))];
    if (refs.length) h += `<h3>holds</h3>` + refs.map(chip).join('');
  }
  body.innerHTML = h;
  panel.classList.add('open');
  history.replaceState(null, '', '#' + name);
  body.querySelectorAll('[data-go]').forEach(el =>
    el.onclick = () => { show(el.dataset.go); zoomTo(el.dataset.go, Math.max(z, 1.1)); });
}
map.querySelectorAll('.node').forEach(n => {
  n.addEventListener('click', () => { if (!drag || !drag.moved) show(n.dataset.name); });
});

// --- combined lane-filter + search visibility -------------------------------
const activeLanes = new Set(Object.keys(LANES));
let term = '';
const q = document.getElementById('q'), count = document.getElementById('count');
function hitsTerm(c) {
  if (!term) return false;
  return c.name.toLowerCase().includes(term) ||
    c.fields.some(f => f.name.toLowerCase().includes(term) ||
                       f.type.toLowerCase().includes(term)) ||
    (c.members || []).some(m => m.toLowerCase().includes(term));
}
function refresh() {
  let n = 0;
  map.querySelectorAll('.node').forEach(node => {
    const c = byName.get(node.dataset.name);
    const laneOn = c && activeLanes.has(c.lane);
    const hit = c && hitsTerm(c);
    node.classList.toggle('hit', !!hit);
    node.classList.toggle('dim', !laneOn || (term && !hit));
    if (hit) n++;
  });
  count.textContent = term ? (n + ' match' + (n === 1 ? '' : 'es')) : '';
}
q.addEventListener('input', () => { term = q.value.trim().toLowerCase(); refresh(); });
q.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const first = map.querySelector('.node.hit');
  if (first) { show(first.dataset.name); zoomTo(first.dataset.name, 1.4); }
});

// --- lane rail (legend + filter) --------------------------------------------
const rail = document.getElementById('rail');
for (const [k, l] of Object.entries(LANES)) {
  const n = CLASSES.filter(c => c.lane === k).length;
  const b = document.createElement('button');
  b.className = 'lchip'; b.setAttribute('aria-pressed', 'true');
  b.innerHTML = `<span class="dot" style="background:${l.color}"></span>` +
                `${esc(l.title.split(' \u2014 ')[0])} <span class="n">${n}</span>`;
  b.onclick = () => {
    if (activeLanes.has(k)) activeLanes.delete(k); else activeLanes.add(k);
    b.setAttribute('aria-pressed', activeLanes.has(k) ? 'true' : 'false');
    refresh();
  };
  rail.appendChild(b);
}

fit();
if (location.hash.length > 1) {
  const n = decodeURIComponent(location.hash.slice(1));
  if (byName.has(n)) { show(n); zoomTo(n, 1.5); }
}
</script>
</body>
</html>
