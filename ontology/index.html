<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>torchcell ontology explorer</title><style>
  :root {
    /* Warm-paper neutrals: the accents are all warm primaries, so the ground is
       biased warm to match rather than fight them. */
    --bg:#F4F1EA; --stage:#EFEBE2; --fg:#221F1A; --muted:#6E675B;
    --line:#E2DBCE; --panel:#FBF9F4; --grid:rgba(120,108,86,.09);
    --accent:#D79B00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16130D; --stage:#100E09; --fg:#ECE6DA; --muted:#9B9384;
             --line:#2F2A20; --panel:#1C1811; --grid:rgba(214,155,0,.07); }
  }
  :root[data-theme="dark"] {
    --bg:#16130D; --stage:#100E09; --fg:#ECE6DA; --muted:#9B9384;
    --line:#2F2A20; --panel:#1C1811; --grid:rgba(214,155,0,.07);
  }
  :root[data-theme="light"] {
    --bg:#F4F1EA; --stage:#EFEBE2; --fg:#221F1A; --muted:#6E675B;
    --line:#E2DBCE; --panel:#FBF9F4; --grid:rgba(120,108,86,.09);
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    font:13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; background:var(--bg); color:var(--fg); overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #bar {
    position:fixed; inset:0 0 auto 0; height:54px; z-index:6;
    display:flex; align-items:center; gap:14px; padding:0 16px;
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  .brand { display:flex; align-items:baseline; gap:8px; }
  .brand b { font-size:14px; font-weight:700; letter-spacing:.02em; }
  .brand em {
    font-family:ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-style:normal; font-size:11px; color:var(--muted);
    letter-spacing:.04em;
  }
  .hourglass { width:16px; height:16px; flex:0 0 auto; }
  #q {
    flex:0 1 300px; padding:7px 11px; border:1px solid var(--line);
    border-radius:7px; background:var(--bg); color:var(--fg);
    font:12px/1 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; letter-spacing:.02em;
  }
  #q:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  .tools { display:flex; gap:6px; margin-left:auto; }
  button {
    padding:7px 11px; border:1px solid var(--line); border-radius:7px;
    background:var(--bg); color:var(--fg); font:12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; cursor:pointer;
  }
  button:hover { border-color:var(--muted); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  #count { font-family:ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size:11px; color:var(--muted); align-self:center; }

  /* Lane rail: legend and filter in one. Each chip = one domain of the schema. */
  #rail {
    position:fixed; top:54px; left:0; right:0; z-index:5;
    display:flex; flex-wrap:wrap; gap:7px; padding:9px 16px;
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  .lchip {
    display:inline-flex; align-items:center; gap:7px; padding:4px 10px 4px 8px;
    border:1px solid var(--line); border-radius:20px; background:var(--bg);
    font:11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; cursor:pointer; user-select:none;
    transition:opacity .12s, border-color .12s;
  }
  .lchip .dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .lchip .n { font-family:ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; color:var(--muted); font-size:10px; }
  .lchip[aria-pressed="false"] { opacity:.4; }
  .lchip:hover { border-color:var(--muted); }

  #stage {
    position:fixed; inset:96px 0 0 0; overflow:hidden; cursor:grab;
    background:var(--stage);
    background-image:linear-gradient(var(--grid) 1px, transparent 1px),
                     linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:26px 26px;
  }
  #stage.drag { cursor:grabbing; }
  /* Concrete px size comes from the viewBox at runtime; see the script below. */
  #map { position:absolute; top:0; left:0; transform-origin:0 0; }
  #map .lod-detail { transition:opacity .12s linear; }
  #stage.coarse #map .lod-detail { opacity:0; }
  #stage.coarse #map .compose:not(.backbone) { opacity:0; }
  .node { cursor:pointer; }
  .node.dim { opacity:.1; }
  .node.hit .card { stroke-width:3.4; }

  #panel {
    position:fixed; top:54px; right:0; bottom:0; width:360px; z-index:7;
    background:var(--panel); border-left:1px solid var(--line);
    overflow:auto; padding:18px 20px 40px; transform:translateX(100%);
    transition:transform .18s ease; box-shadow:-14px 0 34px rgba(20,16,8,.08);
  }
  #panel.open { transform:none; }
  #panel .kicker {
    font-family:ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.11em; font-weight:600;
  }
  #panel h2 { font:600 20px/1.2 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; margin:5px 0 0; word-break:break-word; }
  #panel .doc { color:var(--muted); margin:11px 0 4px; font-size:12.5px; }
  #panel h3 {
    font:600 10.5px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; text-transform:uppercase; letter-spacing:.09em;
    color:var(--muted); margin:20px 0 8px;
  }
  #panel table { width:100%; border-collapse:collapse; }
  #panel td {
    padding:5px 0; vertical-align:top; border-bottom:1px solid var(--line);
    font-size:12px;
  }
  #panel td.n { font-family:ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size:11.5px; }
  #panel td.t {
    color:var(--muted); text-align:right; padding-left:10px; white-space:nowrap;
    font-family:ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size:10.5px;
  }
  #panel .req { color:var(--accent); font-weight:700; }
  #panel .desc { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
  .chip {
    display:inline-flex; align-items:center; gap:6px; padding:3px 9px;
    margin:0 5px 5px 0; border-radius:14px; border:1px solid var(--line);
    background:var(--bg); font:11px/1.2 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; cursor:pointer;
  }
  .chip .dot { width:7px; height:7px; border-radius:50%; }
  .chip:hover { border-color:var(--muted); }
  #close {
    position:absolute; top:14px; right:16px; padding:4px 9px; font-family:ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  #hint {
    position:fixed; left:16px; bottom:14px; z-index:4; font-size:11px;
    color:var(--muted); background:var(--panel); border:1px solid var(--line);
    border-radius:7px; padding:7px 11px; font-family:ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (max-width:760px) {
    #panel { width:100%; } .brand em { display:none; }
  }
</style>
</head>

<div id="bar">
  <span class="brand"><svg class="hourglass" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2 H13 L8 8 Z" fill="#D79B00"/><path d="M3 14 H13 L8 8 Z" fill="#9673A6"/><path d="M3 2 H13 M3 14 H13" stroke="#666666" stroke-width="1.4" stroke-linecap="round"/></svg><b>torchcell ontology</b>
    <em>genotype × environment → phenotype</em></span>
  <input id="q" type="search" placeholder="search classes, fields, values…"
         aria-label="search" />
  <span id="count"></span>
  <span class="tools">
    <button id="fit">Fit</button>
    <button id="zin" aria-label="zoom in">+</button>
    <button id="zout" aria-label="zoom out">&minus;</button>
  </span>
</div>
<div id="rail" aria-label="filter by domain"></div>

#D6B656">EXPERIMENT</text><text x="2230.0" y="54.0" font-size="13.0" fill="#666666">the typed record and its reference</text><text x="4016.0" y="38.0" font-size="13.0" text-anchor="end" fill="#D6B656" fill-opacity="0.75">62 classes</text></g><g class="lane" id="lane-phenotype"><rect x="4096.0" y="0.0" width="614.0" height="3221.2" rx="10" fill="#E1D5E7" fill-opacity="0.26" stroke="#9673A6" stroke-width="1.4"/><text x="4122.0" y="38.0" font-size="34.0" font-weight="700" fill="#9673A6">PHENOTYPE</text><text x="4122.0" y="54.0" font-size="13.0" fill="#666666">what was measured</text><text x="4684.0" y="38.0" font-size="13.0" text-anchor="end" fill="#9673A6" fill-opacity="0.75">20 classes</text></g><g class="lane" id="lane-provenance"><rect x="4764.0" y="0.0" width="1542.0" height="821.6" rx="10" fill="#DAE8FC" fill-opacity="0.26" stroke="#6C8EBF" stroke-width="1.4"/><text x="4790.0" y="38.0" font-size="34.0" font-weight="700" fill="#6C8EBF">PROVENANCE</text><text x="4790.0" y="54.0" font-size="13.0" fill="#666666">where the record came from</text><text x="6280.0" y="38.0" font-size="13.0" text-anchor="end" fill="#6C8EBF" fill-opacity="0.75">12 classes</text></g><g class="lane" id="lane-enum"><rect x="4764.0" y="867.6" width="1558.0" height="1003.2" rx="10" fill="#F5F5F5" fill-opacity="0.26" stroke="#666666" stroke-width="1.4"/><text x="4790.0" y="905.6" font-size="34.0" font-weight="700" fill="#666666">CONTROLLED VOCABULARIES</text><text x="4790.0" y="921.6" font-size="13.0" fill="#666666"></text><text x="6296.0" y="905.6" font-size="13.0" text-anchor="end" fill="#666666" fill-opacity="0.75">30 classes</text></g><path class="compose" data-src="BackgroundAllele" data-dst="AlleleEdit" d="M284.0 235.7 C2176.5 235.7 2897.5 996.3 4790.0 996.3" fill="none" stroke="#666666" stroke-width="0.6" stroke-opacity="0.3" stroke-dasharray="3 2.5"/><path class="compose" data-src="BackgroundAllele" data-dst="Zygosity" d="M284.0 260.9 C2700.7 260.9 3621.3 990.0 6038.0 990.0" fill="none" e (Gupta 2024) so it is queryable, and naming it is what lets a dilution-rate series be loaded at all (Ishii 2007 drops its wild-type series under culture_not_batch because its cultures differ from one another ONLY here).","refs":[]}]},{"name":"EnvironmentPerturbation","kind":"model","lane":"environment","doc":"Base: a defined change to the growth environment vs the base medium.","parent":"ProvenanceGapMixin","children":["BiologicPerturbation","EnvironmentPhysicalPerturbation","PhagePerturbation","PhysicalExposurePerturbation","SmallMoleculePerturbation"],"abstract":true,"inherited":1,"members":[],"fields":[{"name":"perturbation_type","type":"str","required":true,"desc":"","refs":[]},{"name":"description","type":"str","required":true,"desc":"","refs":[]}]},{"name":"EnvironmentPhysicalPerturbation","kind":"model","lane":"environment","doc":"A neutral, scalar physical/physiological environment FACTOR (pH, osmolarity, ...).","parent":"EnvironmentPerturbation","children":[],"abstract":false,"inherited":1,"members":[],"fields":[{"name":"perturbation_type","type":"Literal['environment_physical']","required":false,"desc":"","refs":[]},{"name":"description","type":"str","required":false,"desc":"","refs":[]},{"name":"factor","type":"PhysicalFactor","required":true,"desc":"the neutral physical variable changed","refs":["PhysicalFactor"]},{"name":"magnitude","type":"Concentration | None","required":false,"desc":"typed value+unit of the factor; None for a purely qualitative change","refs":["Concentration"]},{"name":"agent","type":"Compound | None","required":false,"desc":"chemical species realizing the factor (e.g. the salt for osmolarity)","refs":["Compound"]}]},{"name":"EnvironmentResponseExperiment","kind":"model","lane":"experiment","doc":"Experiment measuring a strain's response to an environmental perturbation.","parent":"Experiment","children":["StrainEnvironmentResponseExperiment"],"abstract":true,"inherited":2,"members":[],"fields":[{"name":"experiment_type","type":"st pe":"ResponseCategory | None","required":false,"desc":"the qualitative call on the shared ResponseCategory axis; None for purely numeric readouts","refs":["ResponseCategory"]},{"name":"category_label","type":"str | None","required":false,"desc":"the source's own word or symbol for that call, verbatim (e.g. '++', 'tolerant', 'wild type', the ordinal '4'), so the mapping onto ResponseCategory is auditable and nothing the source said is lost. Requires `category`: a label with no typed call is the free-text state this axis replaces.","refs":[]},{"name":"environment_response_se","type":"float | None","required":false,"desc":"standard error of the response (primary uncertainty statistic)","refs":[]},{"name":"environment_response_uncertainty","type":"float | None","required":false,"desc":"source-reported uncertainty number, verbatim (meaning given by environment_response_uncertainty_type)","refs":[]},{"name":"environment_response_uncertainty_type","type":"UncertaintyType | None","required":false,"desc":"what environment_response_uncertainty IS (sample_sd, ...)","refs":["UncertaintyType"]},{"name":"n_samples","type":"int | None","required":false,"desc":"number of independent replicate measurements of the response","refs":[]},{"name":"sample_unit","type":"SampleUnit | None","required":false,"desc":"what one sample in n_samples is (biological_replicate, ...)","refs":["SampleUnit"]},{"name":"units","type":"str | None","required":false,"desc":"human-readable definition/units of the score, e.g. 'log2(inhibitor/control)'","refs":[]},{"name":"screen_id","type":"str | None","required":false,"desc":"the source's own identifier for the SCREEN this measurement came from (Hoepfner 2014's internal study number, a plate/round id). A compound at one dose can be screened more than once, and once the compound name is cleaned those runs become indistinguishable: Hoepfner has 45 columns that collide on (compound, dose) alone, so the screen id is what keeps one strain x one condition L1-unique fs":[]},{"name":"well","type":"str | None","required":false,"desc":"collection well / row_column, verbatim","refs":[]}]},{"name":"StrainEnvironmentResponseExperiment","kind":"model","lane":"experiment","doc":"A strain's response to an environmental perturbation, with a typed background.","parent":"EnvironmentResponseExperiment","children":[],"abstract":false,"inherited":2,"members":[],"fields":[{"name":"experiment_type","type":"str","required":false,"desc":"","refs":[]},{"name":"environment","type":"CultureEnvironment","required":true,"desc":"","refs":["CultureEnvironment"]},{"name":"phenotype","type":"EnvironmentResponsePhenotype","required":true,"desc":"","refs":["EnvironmentResponsePhenotype"]}]},{"name":"StrainEnvironmentResponseExperimentReference","kind":"model","lane":"experiment","doc":"Reference for a strain-resolved environment response (typed background).","parent":"EnvironmentResponseExperimentReference","children":[],"abstract":false,"inherited":1,"members":[],"fields":[{"name":"experiment_reference_type","type":"str","required":false,"desc":"","refs":[]},{"name":"genome_reference","type":"StrainReferenceGenome","required":true,"desc":"","refs":["StrainReferenceGenome"]},{"name":"environment_reference","type":"CultureEnvironment","required":true,"desc":"","refs":["CultureEnvironment"]},{"name":"phenotype_reference","type":"EnvironmentResponsePhenotype","required":true,"desc":"","refs":["EnvironmentResponsePhenotype"]}]},{"name":"StrainReferenceGenome","kind":"model","lane":"provenance","doc":"A ``ReferenceGenome`` that states its typed ``StrainBackground`` (#507).","parent":"ReferenceGenome","children":[],"abstract":false,"inherited":3,"members":[],"fields":[{"name":"background","type":"StrainBackground","required":true,"desc":"","refs":["StrainBackground"]}]},{"name":"SuppressorAllelePerturbation","kind":"model","lane":"genotype","doc":"Suppressor allele that raises fitness in the presence of a perturbation.","parent":"SequencePerturbation","children":["SgaSuppressorAllelePerturbation"],"abstract":true,"inherited":5,"members":[],"fields":[{"name":"description","type":"str","required":false,"desc":"","refs":[]},{"name":"perturbation_type","type":"Literal['suppressor_allele']","required":false,"desc":"","refs":[]}]},{"name":"SyntheticLethalityExperiment","kind":"model","lane":"experiment","doc":"Experiment measuring a synthetic lethality phenotype.","parent":"Experiment","children":[],"abstract":false,"inherited":2,"members":[],"fields":[{"name":"experiment_type","type":"str","required":false,"desc":"","refs":[]},{"name":"genotype","type":"Genotype | list[Genotype]","required":true,"desc":"","refs":["Genotype"]},{"name":"phenotype","type":"SyntheticLethalityPhenotype","required":true,"desc":"","refs":["SyntheticLethalityPhenotype"]}]},{"name":"SyntheticLethalityExperimentReference","kind":"model","lane":"experiment","doc":"Reference context for a synthetic lethality experiment.","parent":"ExperimentReference","children":[],"abstract":false,"inherited":3,"members":[],"fields":[{"name":"experiment_reference_type","type":"str","required":false,"desc":"","refs":[]},{"name":"phenotype_reference","type":"SyntheticLethalityPhenotype","required":true,"desc":"","refs":["SyntheticLethalityPhenotype"]}]},{"name":"SyntheticLethalityPhenotype","kind":"model","lane":"phenotype","doc":"Phenotype indicating synthetic lethality between perturbed genes.","parent":"Phenotype","children":[],"abstract":false,"inherited":1,"members":[],"fields":[{"name":"graph_level","type":"str","required":false,"desc":"","refs":[]},{"name":"label_name","type":"str","required":false,"desc":"","refs":[]},{"name":"label_statistic_name","type":"str","required":false,"desc":"","refs":[]},{"name":"is_synthetic_lethal","type":"bool","required":false,"desc":"synthetic lethality occurs when the combination of mutations intwo or more genes leads to cell death, whereas a mutation in only one of thesegenes does not affect the viability of the cell.","refs":[]},{"name":"synthetic_lethality_statistic_score","type":"float | None","required":false,"desc":"statistical score computed in [SynLethDB](https://synlethdb.sist.shanghaitech.edu.cn/#/","refs":[]}]},{"name":"SyntheticRescueExperiment","kind":"model","lane":"experiment","doc":"Experiment measuring a synthetic rescue phenotype.","parent":"Experiment","children":[],"abstract":false,"inherited":2,"members":[],"fields":[{"name":"experiment_type","type":"str","required":false,"desc":"","refs":[]},{"name":"genotype","type":"Genotype | list[Genotype]","required":true,"desc":"","refs":["Genotype"]},{"name":"phenotype","type":"SyntheticRescuePhenotype","required":true,"desc":"","refs":["SyntheticRescuePhenotype"]}]},{"name":"SyntheticRescueExperimentReference","kind":"model","lane":"experiment","doc":"Reference context for a synthetic rescue experiment.","parent":"ExperimentReference","children":[],"abstract":false,"inherited":3,"members":[],"fields":[{"name":"experiment_reference_type","type":"str","required":false,"desc":"","refs":[]},{"name":"phenotype_reference","type":"SyntheticRescuePhenotype","required":true,"desc":"","refs":["SyntheticRescuePhenotype"]}]},{"name":"SyntheticRescuePhenotype","kind":"model","lane":"phenotype","doc":"Phenotype indicating one perturbation rescues another's deleterious effect.","parent":"Phenotype","children":[],"abstract":false,"inherited":1,"members":[],"fields":[{"name":"graph_level","type":"str","required":false,"desc":"","refs":[]},{"name":"label_name","type":"str","required":false,"desc":"","refs":[]},{"name":"label_statistic_name","type":"str","required":false,"desc":"","refs":[]},{"name":"is_synthetic_rescue","type":"bool","required":false,"desc":"synthetic rescue occurs when a mutation in one gene compensatesfor the deleterious effects of a mutation in another gene, thereby restoringnormal function or viability to the cell","refs":[]},{"name":"synthetic_rescue_statistic_score","type":"float | None","required":false,"desc":"statistical score computed in [SynLethDB](https://synlethdb.sist.shanghaitech.edu.cn/#/","refs":[]}]},{"name":"Temperature","kind":"model","lane":"environment","doc":"Temperature value with a typed unit (defaults to Celsius).","parent":null,"children":[],"abstract":false,"inherited":0,"members":[],"fields":[{"name":"value","type":"float","required":true,"desc":"","refs":[]},{"name":"unit","type":"TemperatureUnit","required":false,"desc":"","refs":["TemperatureUnit"]}]},{"name":"TemperatureUnit","kind":"enum","lane":"enum","doc":"UO-aligned temperature units (typed, not a free string) -- G2 unit typing.","parent":null,"children":[],"abstract":false,"inherited":0,"members":["Celsius","Kelvin","Fahrenheit"],"fields":[]},{"name":"TransposonInsertionPerturbation","kind":"model","lane":"genotype","doc":"A transposon insertion that disrupts a gene, as a REALIZED genotype.","parent":"PresenceAbsencePerturbation","children":[],"abstract":false,"inherited":2,"members":[],"fields":[{"name":"provenance","type":"str","required":false,"desc":"","refs":[]},{"name":"state","type":"str","required":false,"desc":"","refs":[]},{"name":"mechanism_so_id","type":"str","required":false,"desc":"","refs":[]},{"name":"mechanism_so_name","type":"str","required":false,"desc":"","refs":[]},{"name":"description","type":"str","required":false,"desc":"","refs":[]},{"name":"perturbation_type","type":"Literal['transposon_insertion']","required":false,"desc":"","refs":[]},{"name":"gene_namespace","type":"Literal['ecoli_k12_mg1655_bnumber', 'ecoli_k\u2026","required":true,"desc":"which host's locus-tag namespace systematic_gene_name is written in","refs":[]},{"name":"identifier_mapping","type":"DerivedIdentifierMapping | None","required":false,"desc":"how systematic_gene_name was derived from the identifier the source released; None when the source released it as stored","refs":["DerivedIdentifierMapping"]},{"name":"barcode","type":"str | None","required":false,"desc":"the random barcode the strain is counted by in a pooled assay; None when the source released no per-strain tag","refs":[]},{"name":"insertion_position","type":"int | None","required":false,"desc":"1-based position the insertion was mapped to on the replicon of the pinned assembly; None when only gene-level calls were released","refs":[]},{"name":"insertion_strand","type":"Optional[Literal['+', '-']]","required":false,"desc":"orientation of the inserted element as mapped; None when unreleased","refs":[]},{"name":"transposon","type":"str | None","required":false,"desc":"the transposon / delivery vector, verbatim (e.g. 'mariner Himar1', 'Tn5'); None when unsourced","refs":[]},{"name":"library_pool","type":"str | None","required":false,"desc":"the mutant library sub-pool this strain was screened in, when a study runs several; a pooled measurement is pool-relative, so the pool joins the strain identity","refs":[]}]},{"name":"TsAllelePerturbation","kind":"model","lane":"genotype","doc":"Temperature-sensitive allele perturbation via amino acid substitution.","parent":"SequencePerturbation","children":["SgaTsAllelePerturbation"],"abstract":true,"inherited":5,"members":[],"fields":[{"name":"description","type":"str","required":false,"desc":"","refs":[]},{"name":"perturbation_type","type":"Literal['temperature_sensitive_allele']","required":false,"desc":"","refs":[]}]},{"name":"UncertaintyType","kind":"enum","lane":"enum","doc":"What a reported uncertainty number IS, so it converts to an SE correctly.","parent":null,"children":[],"abstract":false,"inherited":0,"members":["sample_sd","standard_error","bootstrap_se","variance","ci95"],"fields":[]},{"name":"VariantCallMode","kind":"enum","lane":"enum","doc":"Whether a frequency is a clone's within-isolate fraction or a population's.","parent":null,"children":[],"abstract":false,"inherited":0,"members":["clone","population"],"fields":[]},{"name":"VariantFrequencyBasis","kind":"enum","lane":"enum","doc":"The scale a released variant frequency is written on, never assumed.","parent":null,"children":[],"abstract":false,"inherited":0,"members":["fraction","percent"],"fields":[]},{"name":"VariantSiteKind","kind":"enum","lane":"enum","doc":"Why a called variant is keyed on its genomic SITE rather than on a locus tag.","parent":null,"children":[],"abstract":false,"inherited":0,"members":["intergenic","locus_not_in_assembly"],"fields":[]},{"name":"VisualScoreExperiment","kind":"model","lane":"experiment","doc":"Experiment measuring a visual-score phenotype.","parent":"Experiment","children":[],"abstract":false,"inherited":2,"members":[],"fields":[{"name":"experiment_type","type":"str","required":false,"desc":"","refs":[]},{"name":"genotype","type":"Genotype | list[Genotype]","required":true,"desc":"","refs":["Genotype"]},{"name":"phenotype","type":"VisualScorePhenotype","required":true,"desc":"","refs":["VisualScorePhenotype"]}]},{"name":"VisualScoreExperimentReference","kind":"model","lane":"experiment","doc":"Reference (control colony) context for a visual-score experiment.","parent":"ExperimentReference","children":[],"abstract":false,"inherited":3,"members":[],"fields":[{"name":"experiment_reference_type","type":"str","required":false,"desc":"","refs":[]},{"name":"phenotype_reference","type":"VisualScorePhenotype","required":true,"desc":"","refs":["VisualScorePhenotype"]}]},{"name":"VisualScorePhenotype","kind":"model","lane":"phenotype","doc":"Ordinal visual-inspection score as a proxy for a metabolite/product level.","parent":"Phenotype","children":[],"abstract":false,"inherited":1,"members":[],"fields":[{"name":"graph_level","type":"str","required":false,"desc":"","refs":[]},{"name":"label_name","type":"str","required":false,"desc":"","refs":[]},{"name":"label_statistic_name","type":"str | None","required":false,"desc":"","refs":[]},{"name":"visual_score","type":"float","required":true,"desc":"aggregated ordinal visual score (e.g. colony color intensity)","refs":[]},{"name":"visual_score_min","type":"float | None","required":false,"desc":"min score across replicates (reproducibility; None if 1 replicate)","refs":[]},{"name":"n_replicates","type":"int","required":true,"desc":"number of independent visually-scored replicates for this strain","refs":[]},{"name":"score_scale_min","type":"int","required":true,"desc":"lower bound of the ordinal scale","refs":[]},{"name":"score_scale_max","type":"int","required":true,"desc":"upper bound of the ordinal scale","refs":[]},{"name":"score_semantics","type":"str","required":true,"desc":"what higher vs lower means, e.g. 'higher = more orange colony = more carotenoid/beta-carotene'","refs":[]},{"name":"target_product","type":"str","required":true,"desc":"metabolite/product the score is a visual proxy for, e.g. 'beta-carotene'","refs":[]},{"name":"target_metabolite_id","type":"str | None","required":false,"desc":"optional Yeast9 s_NNNN metabolite id for CBM linkage; None until modeling decided","refs":[]},{"name":"score_text","type":"str | None","required":false,"desc":"non-numeric score annotations from the source (e.g. 'pet', 'tiny')","refs":[]},{"name":"comment_annotations","type":"dict[str, bool] | None","required":false,"desc":"boolean annotations parsed from the source Comment column; a MIX, NOT all QC -- true QC (flag_qc_failure, flag_het_diploid), secondary growth/physiology phenotypes (flag_petite, flag_tiny, flag_slow_growth), and interpretation caveats (flag_sterile, flag_unusual_color). Do not filter records on these as if they were all quality failures.","refs":[]}]},{"name":"Zygosity","kind":"enum","lane":"enum","doc":"How many of a background's chromosome copies carry an allele.","parent":null,"children":[],"abstract":false,"inherited":0,"members":["haploid","homozygous","heterozygous"],"fields":[]}];
const LANES = {"genotype":{"title":"Genotype \u2014 what was changed in the cell","color":"#D79B00"},"environment":{"title":"Environment \u2014 what the cell was grown in","color":"#B85450"},"experiment":{"title":"Experiment \u2014 the typed record and its reference","color":"#D6B656"},"phenotype":{"title":"Phenotype \u2014 what was measured","color":"#9673A6"},"provenance":{"title":"Provenance \u2014 where the record came from","color":"#6C8EBF"},"enum":{"title":"Controlled vocabularies","color":"#666666"}};
const byName = new Map(CLASSES.map(c => [c.name, c]));
const map = document.getElementById('map');
const stage = document.getElementById('stage');
const vb = map.getAttribute('viewBox').split(/\s+/).map(Number);
const W = vb[2], H = vb[3];
map.style.width = W + 'px';
map.style.height = H + 'px';
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
const laneColor = k => (LANES[k] || {}).color || '#888';

// --- pan / zoom -------------------------------------------------------------
let z = 1, tx = 0, ty = 0;
function apply() {
  map.style.transform = `translate(${tx}px,${ty}px) scale(${z})`;
  stage.classList.toggle('coarse', z < 0.34);
}
function fit() {
  const r = stage.getBoundingClientRect();
  z = Math.min(r.width / W, r.height / H) * 0.96;
  tx = (r.width - W * z) / 2; ty = (r.height - H * z) / 2;
  apply();
}
function zoomTo(name, scale) {
  const el = document.getElementById('node-' + name);
  if (!el) return;
  const b = el.getBBox(), r = stage.getBoundingClientRect();
  z = scale || 1.5;
  tx = r.width / 2 - (b.x + b.width / 2) * z;
  ty = r.height / 2 - (b.y + b.height / 2) * z;
  apply();
}
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const f = Math.exp(-e.deltaY * 0.0016);
  const nz = Math.min(9, Math.max(0.04, z * f));
  tx = mx - (mx - tx) * (nz / z); ty = my - (my - ty) * (nz / z);
  z = nz; apply();
}, { passive: false });
let drag = null;
stage.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY, tx, ty, moved: false };
  stage.setPointerCapture(e.pointerId); stage.classList.add('drag');
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  tx = drag.tx + dx; ty = drag.ty + dy; apply();
});
stage.addEventListener('pointerup', () => { drag = null; stage.classList.remove('drag'); });
document.getElementById('fit').onclick = fit;
document.getElementById('zin').onclick = () => { z = Math.min(9, z * 1.4); apply(); };
document.getElementById('zout').onclick = () => { z = Math.max(0.04, z / 1.4); apply(); };

// --- detail drawer ----------------------------------------------------------
const panel = document.getElementById('panel'), body = document.getElementById('body');
document.getElementById('close').onclick = () => panel.classList.remove('open');
const chip = nm => {
  const c = byName.get(nm);
  const col = c ? laneColor(c.lane) : '#888';
  return `<span class="chip" data-go="${nm}"><span class="dot" style="background:${col}"></span>${esc(nm)}</span>`;
};
function show(name) {
  const c = byName.get(name);
  if (!c) return;
  const lane = LANES[c.lane] || { title: c.lane, color: '#888' };
  const head = lane.title.split(' \u2014 ')[0];
  let h = `<div class="kicker" style="color:${lane.color}">${esc(head)}` +
          `${c.abstract ? ' \u00b7 abstract base' : ''}</div>`;
  h += `<h2>${esc(c.name)}</h2>`;
  if (c.doc) h += `<div class="doc">${esc(c.doc)}</div>`;
  if (c.parent) h += `<h3>inherits from</h3>${chip(c.parent)}`;
  if (c.children.length)
    h += `<h3>specialised by (${c.children.length})</h3>` + c.children.map(chip).join('');
  if (c.kind === 'enum') {
    h += `<h3>values (${c.members.length})</h3><table>` +
         c.members.map(m => `<tr><td class="n">${esc(m)}</td></tr>`).join('') + '</table>';
  } else {
    h += `<h3>declared fields (${c.fields.length}` +
         (c.inherited ? `, +${c.inherited} inherited` : '') + `)</h3><table>`;
    for (const f of c.fields) {
      h += `<tr><td class="n">${esc(f.name)}` +
           `${f.required ? '' : '<span class="req"> ?</span>'}` +
           (f.desc ? `<span class="desc">${esc(f.desc)}</span>` : '') +
           `</td><td class="t">${esc(f.type)}</td></tr>`;
    }
    h += '</table>';
    const refs = [...new Set(c.fields.flatMap(f => f.refs))];
    if (refs.length) h += `<h3>holds</h3>` + refs.map(chip).join('');
  }
  body.innerHTML = h;
  panel.classList.add('open');
  history.replaceState(null, '', '#' + name);
  body.querySelectorAll('[data-go]').forEach(el =>
    el.onclick = () => { show(el.dataset.go); zoomTo(el.dataset.go, Math.max(z, 1.1)); });
}
map.querySelectorAll('.node').forEach(n => {
  n.addEventListener('click', () => { if (!drag || !drag.moved) show(n.dataset.name); });
});

// --- combined lane-filter + search visibility -------------------------------
const activeLanes = new Set(Object.keys(LANES));
let term = '';
const q = document.getElementById('q'), count = document.getElementById('count');
function hitsTerm(c) {
  if (!term) return false;
  return c.name.toLowerCase().includes(term) ||
    c.fields.some(f => f.name.toLowerCase().includes(term) ||
                       f.type.toLowerCase().includes(term)) ||
    (c.members || []).some(m => m.toLowerCase().includes(term));
}
function refresh() {
  let n = 0;
  map.querySelectorAll('.node').forEach(node => {
    const c = byName.get(node.dataset.name);
    const laneOn = c && activeLanes.has(c.lane);
    const hit = c && hitsTerm(c);
    node.classList.toggle('hit', !!hit);
    node.classList.toggle('dim', !laneOn || (term && !hit));
    if (hit) n++;
  });
  count.textContent = term ? (n + ' match' + (n === 1 ? '' : 'es')) : '';
}
q.addEventListener('input', () => { term = q.value.trim().toLowerCase(); refresh(); });
q.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const first = map.querySelector('.node.hit');
  if (first) { show(first.dataset.name); zoomTo(first.dataset.name, 1.4); }
});

// --- lane rail (legend + filter) --------------------------------------------
const rail = document.getElementById('rail');
for (const [k, l] of Object.entries(LANES)) {
  const n = CLASSES.filter(c => c.lane === k).length;
  const b = document.createElement('button');
  b.className = 'lchip'; b.setAttribute('aria-pressed', 'true');
  b.innerHTML = `<span class="dot" style="background:${l.color}"></span>` +
                `${esc(l.title.split(' \u2014 ')[0])} <span class="n">${n}</span>`;
  b.onclick = () => {
    if (activeLanes.has(k)) activeLanes.delete(k); else activeLanes.add(k);
    b.setAttribute('aria-pressed', activeLanes.has(k) ? 'true' : 'false');
    refresh();
  };
  rail.appendChild(b);
}

fit();
if (location.hash.length > 1) {
  const n = decodeURIComponent(location.hash.slice(1));
  if (byName.has(n)) { show(n); zoomTo(n, 1.5); }
}
</script>
