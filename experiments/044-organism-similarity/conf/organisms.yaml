    taxon_query: Rattus norvegicus
    preferred_strain: reference
    groups: [mammal]
    source: ncbi
    accession: GCF_036323735.1
    accession_choice: NCBI reference assembly GRCr8.
    justification: >-
      Model rodent.

  - key: ggal
    row: 35
