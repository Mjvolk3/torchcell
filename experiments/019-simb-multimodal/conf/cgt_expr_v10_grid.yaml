# experiments/019-simb-multimodal/conf/cgt_expr_v10_grid.yaml
# THE GENERALIZATION-GAP ROUND -- project v10, a 2^4 factorial on Delta.
#
# WHY A NEW PROJECT. v9 asks which distributional head scores best at a long budget. This
# asks a different question at a short one, and pooling the two leaderboards would compare
# runs whose budgets differ by a factor of five. The scoring window here is epochs <= 2000
# for every cell.
#
# WHAT THIS ROUND IS FOR. The model fits TRAIN to 0.786 against a replicate ceiling of 0.775
# while validating at 0.240: it is memorizing measurement noise, not underfitting. The
# generalization gap is ~0.55 and every architecture arm tested so far moves 0.01-0.05, so
# the arms have been an order of magnitude smaller than the quantity that is actually large.
# The four factors here are the ones that act on that gap rather than on capacity at the
# readout.
#
# WHY 2000 EPOCHS AND NOT 9900. short_budget_spread.json: recomputing the eight identical
# replicates at truncated budgets gives sd 0.0151 at 2000 against 0.0222 at 9900, while the
# mean only falls from 0.1965 to 0.1745. A short budget therefore holds 89% of the score at
# 68% of the noise. The late epochs buy the upper tail, which is what raises a headline
# maximum and inflates the variance, and they buy nothing for a contrast between arms.
#
# THE FOUR FACTORS, each at two levels, set by the launcher rather than here:
#   embedding     random_1024 | prot_T5_all
#   trunk         L=6 h=90    | L=2 h=45
#   readout       two-layer   | linear
#   weight decay  1e-8        | 1e-4
#
# EVERYTHING ELSE IS PINNED to the v9 incumbent: quantile head trained by pinball loss, the
# layer-1 attention mask over nine graphs one per head, dropout 0.1, lr 3e-4, batch 32,
# split_seed 0. The graph KL regularizer stays off (graph_reg_lambda 0.0); the attention mask
# and that regularizer are separate levers and only the mask is in use.
#
# WHY random_1024 AS THE CONTROL. prot_T5 is 1024-dimensional, so a control of any other
# width changes the embedding preprocessor's input size alongside the content and confounds
# "does content help" with "does a wider preprocessor help". At 1024 both levels feed an
# identically sized preprocessor, which makes the factor content and nothing else.
defaults:
  - cgt_expr_v9_mask
  - _self_

wandb:
  project: torchcell_019_expr_v10
  tags: [generalization-gap, factorial-2x2x2x2, v10]

multitask:
  # DECLARED HERE, not inherited. `linear_readout` is declared in cgt_expr_008.yaml, but 008
  # sits on the 006 branch and this config descends through v9_mask -> 012 -> 011 -> 010, so
  # that declaration is not in this lineage. Hydra struct mode then rejects the override
  # while composing, before any model is built. This is the same failure that killed canary
  # 2369676 in 94 seconds, and a factor of this round is unreachable without the line.
  linear_readout: false

trainer:
  # Absolute in Lightning. Every cell completes rather than being cut off by a wall, so all
  # 64 runs are scored on the identical window and no arm is truncated harder than another.
  #
  # 700, NOT 2000, AND THAT IS A MEASUREMENT TAKEN FROM THE ROUND ITSELF. Delta sustains
  # 33.6 epochs/h at zero dataloader workers, measured on grid job 21793975 task 0 across a
  # 25-minute window, against the 128 ep/h this budget originally assumed from an IGB A40
  # with seven workers. That 3.8x is the price of the fix for the Lustre stall: batches are
  # assembled in the main process instead of by seven prefetching workers.
  #
  # At 33.6 ep/h a 2,000-epoch round needs 59 h against a 48 h wall, so a two-round structure
  # could afford only 700 epochs per run. THAT TRADE WAS MEASURED AND REJECTED. The round now
  # runs ONE round of 4 runs per node, 16 cells x 2 replicates, so a run owns its GPU for the
  # whole job and pays one startup instead of two: 48 h - 1.75 h startup = 46.2 h of training,
  # which is 1,552 epochs at the measured rate. 1,400 leaves margin for a slower cell.
  #
  # WHY LONGER BEATS MORE REPLICATES HERE, from short_budget_spread.json (extended down to
  # 350 for exactly this question). The replicate sd is 0.0166 at 700 and 0.0117 at 1,500, so
  # halving the replicate count costs sqrt(2) in the standard error while the longer budget
  # returns almost exactly that factor back in sd. The smallest detectable main effect is
  # 0.0117 at 1,500 with 2 replicates against 0.0116 at 700 with 4: statistically the same
  # round, at 2.3x the training budget.
  #
  # AN EARLIER VERSION OF THIS COMMENT ARGUED A SHORT BUDGET IS THE QUIETER REGIME AND SO
  # COSTS ALMOST NOTHING. That was read off a budget grid whose lowest point was 1,000, and
  # it does not survive measuring below it. sd is NOT monotone in the budget: 0.0058 at 500,
  # 0.0166 at 700, 0.0099 at 1,000. 700 is the noisiest point on the grid, not the quietest,
  # which is what a curve caught mid-rise at different rates produces.
  max_epochs: 1400
  # Matches the incumbent's own long run so the eval-mode train curve stays comparable, and
  # it is what makes the train-versus-validation gap readable per cell, which is the
  # quantity this round exists to move.
  train_eval_every: 10
