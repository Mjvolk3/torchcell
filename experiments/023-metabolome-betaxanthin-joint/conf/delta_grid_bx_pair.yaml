# experiments/023-metabolome-betaxanthin-joint/conf/delta_grid_bx_pair.yaml
# [[experiments.023-metabolome-betaxanthin-joint]]
#
# DELTA EXPERIMENT 3 -- DOES THE REST OF THE METABOLISM SIGNAL IMPROVE BETAXANTHIN?
#
# Concretely: does adding the 19-amino-acid metabolome as a second supervised head, on a
# shared encoder, lift the production number we actually care about?
#
# THE COMPARISON. Two arms share this config and differ in EXACTLY ONE THING -- whether the
# metabolome head is attached:
#
#     ARM=bx_ctrl   active_heads=[betaxanthin]                 the control
#     ARM=bx_m19    active_heads=[betaxanthin, mulleder19]     the joint arm
#
# Both rank on `val/betaxanthin/pearson_per_feature`. The metabolome is an AUXILIARY TASK, not
# a second objective: ranking the joint arm on a Pareto front of both would answer a different
# question ("which configs are good at both") and make the two arms incomparable.
#
# THE CONTROL THAT MAKES IT A MEASUREMENT: `require_head_targets` fixes BOTH arms to the
# genotypes carrying BOTH targets, so the joint arm cannot win merely by seeing more rows.
# Measured on this build: 4,669 betaxanthin genotypes, 4,678 metabolome, 4,432 shared -- the
# restriction costs 237 rows (5%), so the comparison is nearly free. Compare the 019
# expression<->morphology control, whose both-modality intersection was only 1,440.
#
# WHY `require_head_targets` RATHER THAN `require_modalities`: the older mechanism intersects
# on phenotype LABEL, and betaxanthin and the metabolome are BOTH `metabolite_level` -- what
# separates them is which KEYS their value dict carries. `require_modalities:
# [metabolite_level]` would be a silent no-op, leaving the arms on DIFFERENT instance sets.
#
# THE 8 RUNS PER ROUND ARE 4 SETTINGS x 2 ARMS, and the pairing is the design. Both arms run
# the SAME (setting, seed) cells, and `cfg.seed` drives model init AND the CellDataModule
# split -- so within a cell the two arms see the identical split and the identical
# initialization, and `bx_m19 - bx_ctrl` is a PAIRED difference. That removes the split and
# init variance which, at sigma = 0.030, dominates any unpaired comparison at this sample
# size. It is also why this experiment buys 4 settings rather than 8: the third factor's
# budget is spent on the pairing, which is worth far more.
#
# NO PINNED SPLIT ON THIS ARM, unlike experiment 1. This is an INTERNAL contrast between two
# of our own arms, so both sides must see the same ordinary seeded split, with the effect
# measured on the full val set rather than on whatever remains after a 639-gene block is
# removed. Its numbers are therefore NOT comparable to experiment 1's, and should never be
# quoted next to them.
#
# READ-OUT. Per (setting, seed) cell, `bx_m19 - bx_ctrl`; then the mean paired difference with
# its SE over cells. Recorded alongside: `aux_mulleder19_pearson`, the metabolome head's OWN
# score in the joint arm. "The metabolome helped betaxanthin" and "the metabolome head learned
# anything" are different claims, and the second is what explains the first -- an auxiliary
# head at r ~ 0 that still moves the primary metric would mean the gain came from
# regularization, not from shared metabolic signal.
defaults:
  - base
  - _self_

seed: 42

wandb:
  project: torchcell_023_bx_m19_delta_grid
  tags: ["023", delta, grid, metabolism, joint, betaxanthin, mulleder19, controlled]
  log_model: false

cell_dataset:
  # THE control. Both arms restrict to the 4,432 genotypes carrying betaxanthin AND the
  # 19-AA metabolome; `multitask.active_heads` is what differs between them, and nothing else.
  require_head_targets: [betaxanthin, mulleder19]

multitask:
  # Overridden per arm by the grid runner (bx_ctrl -> [betaxanthin]); declared as the JOINT
  # arm so a manual non-grid run of this config is the joint one.
  active_heads: [betaxanthin, mulleder19]
  # Equal weights, left explicit rather than tuned. The auxiliary head is 19 features against
  # the primary's 1, so an unweighted sum already gives the metabolome the larger share of the
  # gradient -- which is the point of an auxiliary task. A SWEPT head weight would be a second
  # axis on which the two arms could differ, and would stop the contrast being a measurement.
  head_weights:
    betaxanthin: 1.0
    mulleder19: 1.0


model:
  # ---- ARCHITECTURE PARITY WITH THE CURRENT BEST (019 `_010`/`_012`) ----
  # These are STANDING decisions carried over from the expression line, not arms.
  num_transformer_layers: 6
  attention_mask:
    # HARD GRAPH MASKING REPLACES THE KL PENALTY. All nine gene-gene relations are burned
    # into attention structurally, one graph per head at layer 1, and `graph_reg_lambda`
    # goes to 0 below.
    #
    # WHY, measured per-epoch under identical packing (`cgt_expr_010`): the masked run took
    # 28.0 s/epoch against 42.3-48.7 s/epoch for seven KL runs launched within 21 seconds of
    # it -- 1.5-1.7x. The mechanism is structural: the KL needs attention WEIGHTS, so the
    # regularized layer must materialize a [1, 9, 6608, 6608] matmul (1.57 GB) and cannot use
    # `scaled_dot_product_attention`'s fused kernel. Masking keeps the graph prior EXACTLY
    # and with no lambda to calibrate, so the KL buys nothing the mask does not.
    #
    # That speedup is the whole ballgame for THIS round. The question is where the val curve
    # saturates, 019 measured its peak at epoch 1367, and a 1.7x per-epoch penalty is a 1.7x
    # cut to how far up the curve 48 h reaches.
    #
    # Relation names are the SUFFIXED ones `to_cell_data` actually emits. An unmatched name
    # RAISES rather than being skipped -- which is how `_006`-`_008` silently regularized
    # SEVEN of nine heads for three rounds.
    enabled: true
    # DECLARED so the grid can override it -- hydra struct mode rejects an override on a
    # key the config never declares. Swept {[1], [1,3]} where mask depth is a factor; layer
    # indices must exist at `num_transformer_layers`, which is why L is frozen at 6.
    layers: [1]
    head_graphs:
      0: physical_interaction
      1: regulatory_interaction
      2: tflink
      3: string12_0_neighborhood
      4: string12_0_fusion
      5: string12_0_cooccurence
      6: string12_0_coexpression
      7: string12_0_experimental
      8: string12_0_database
  graph_regularization:
    # The mask REPLACES the KL. Leaving both on would apply a hard constraint and a soft
    # penalty to the same nine heads, and would give back the fused-kernel speedup for a
    # prior the mask already enforces.
    graph_reg_lambda: 0.0
  perturbation_head:
    dropout: ${model.dropout}
    # `off` | `replace` | `add`. Declared so the grid can select it; see the FACTORS block in
    # metabolism_grid_runner.py for why the pair term is the question on a deletion panel.
    hadamard: "off"

data_module:
  # PIN THE PARTITION so `seed` varies weight INITIALIZATION ONLY. Previously one knob did
  # both, because `CellDataModule(random_seed=)` selects the train/val/test split. 019
  # measured the consequence: between-seed sd 0.0444 against a within-seed across-arm sd of
  # 0.0058 -- the nuisance axis was 7.7x the signal axis, and at n=4 the MDE was 7.9x the
  # effect being chased.
  #
  # WHAT IT COSTS, stated plainly: the absolute level now belongs to ONE validation draw.
  # Arm RANKINGS transfer; the number does not.
  split_seed: 0

trainer:
  # THE RETAINED-CHECKPOINT TRIO. `monitor` is the arm's RANKED metric, mode max -- so it is
  # the PRIMARY callback and therefore what `trainer.test(ckpt_path="best")` loads. That
  # ordering is load-bearing: 019 measured val loss bottoming at epoch ~103-136 while val
  # Pearson climbed to ~1367, and job 1341 peaked at 0.323 on epoch 55 and was checkpointed
  # at 0.000 under val/loss. Testing the loss checkpoint would score the early-dip model.
  #
  # `metric_monitor` is the arm's OTHER correlation, not a repeat of `monitor`. Two reasons:
  # Lightning derives a ModelCheckpoint's `state_key` from its monitor, so two callbacks on
  # the SAME metric raise "Found more than one stateful callback of type ModelCheckpoint";
  # and Spearman is what the Merzbacher recipe actually reports (rank agreement is
  # imbalance-immune, accuracy is not), so retaining its peak is useful rather than padding.
  checkpoint:
    monitor: val/betaxanthin/pearson_per_feature
    mode: max
    metric_monitor: val/betaxanthin/spearman_per_feature
  # THE CAPACITY DIAGNOSTIC, and the reason it is not optional. The existing `train/...`
  # series is accumulated over training batches -- WITH DROPOUT ACTIVE and across weights
  # still updating within the epoch -- so it is a biased-LOW estimate of the model's actual
  # fit, and that bias is why "is training saturated?" has never been answerable here.
  # `traineval/<pheno>/pearson_per_feature` is an eval-mode pass over the train split.
  #
  # It decides the next round: if eval-mode train Pearson saturates far below 1.0, the model
  # cannot fit these strains and more data will not help. If it climbs toward 1.0, capacity
  # is fine and the whole problem is generalization. Opposite next rounds.
  #
  # Every 25 epochs, not every epoch: the pass sweeps the whole train split and costs ~65 s
  # on its own, so at every-1 it truncated a 019 run to epoch 17 in 24 h. At every-25 it adds
  # ~2.6 s per epoch and still yields hundreds of curve points over a 48 h run.
  train_eval_every: 25
  # A CEILING, NOT A TARGET -- the stop that fires is `trainer.max_time_s`, set per trial from
  # the job's remaining wall clock. This matters MORE on a paired comparison than anywhere
  # else: the joint arm carries a second loss term and may well converge later than the
  # control, so any epoch cap that bound would bind on ONE side and become a difference
  # between the arms that is not the one under test. A wall-clock budget is symmetric by
  # construction -- both arms get the same seconds.
  max_epochs: 10000
  early_stopping:
    # OFF, and for the paired design this is a correctness requirement rather than a
    # preference. Early stopping is a data-dependent stopping rule, so with it on the two
    # arms would stop at DIFFERENT epochs and the paired difference would confound "the
    # metabolome helped" with "the metabolome head changed when the run stopped".
    enabled: false
  max_time_s: null
  run_test: false
  dump_test_predictions: false
