# torchcell/knowledge_graphs/conf/kg_bench_ladder.yaml
# [[torchcell.knowledge_graphs.conf.kg_bench_ladder.yaml]]
# https://github.com/Mjvolk3/torchcell/tree/main/torchcell/knowledge_graphs/conf/kg_bench_ladder.yaml
#
# Build-speed benchmark ladder (experiments/tcdb-002-build-speed). A fixed subset of
# the 51-dataset build chosen so every size class the full build spends its time in is
# present: five small datasets (the full build's 33 small adapters cost 9.5 h of pure
# per-method overhead on job 2032), two mid Kuzmin sets, and Costanzo dmf capped to 2M
# records (the crash case: 20.7M records, one worker at 45 G on job 1996). Everything
# else about the build is the production path. Every arm runs THIS config; only the
# code and the launcher's CPU/memory box change between arms.

defaults:
  - default
  - _self_

wandb:
  mode: online
  project: tcdb
  tags: [tcdb-002, ladder]

# The adapter settings are the PRODUCTION build's (kg_uncapped.yaml). An arm that
# deviates does so through hydra overrides on the launcher's KG_OVERRIDES, recorded
# in the run's arm.tsv and in the W&B config, so the config file itself never drifts
# from production. Job 2851 ran chunk_size 4e5 copied from kg_small.yaml: a 410k-record
# dataset then splits into 3 chunks and 3 of 43 workers do the work, which is why it
# is scored as a chunk-size arm rather than the baseline.
adapters:
  io_to_total_worker_ratio: 0.1
  chunk_size: 1e5
  loader_batch_size: 1e3
  # r1 arm: adapters.inprocess_max_records=25000 (datasets up to that many records
  # run every method in-process, no pool, no loader forks). 0 is production.
  inprocess_max_records: 0
  # r3 arm: adapters.single_pass=true (one traversal per adapter for all chunked
  # node methods, one for all chunked edge methods). false is production.
  single_pass: false
  # r5 arm: adapters.fast_writer=true (rows rendered in the chunk workers, the main
  # process only dedups and appends; torchcell.fast_csv). false is production.
  fast_writer: false
  # r6 arm: adapters.chunks_per_worker=N (pool group = workers x N chunks; the pool is
  # torn down and re-forked every group). 2 is production.
  chunks_per_worker: 2

datasets:
  - MetaboliteZelezniak2018Dataset # 95 records
  - GeneEssentialitySgdDataset # 1,329
  - SmfKuzmin2018Dataset # 1,539
  - AminoAcidCooper2010Dataset # 4,313
  - FattyAcidSmith2006Dataset # 12,747
  - TmiKuzmin2020Dataset # 301,798
  - DmfKuzmin2018Dataset # 410,399
  - DmfCostanzo2016Dataset # 20,705,612, capped below

subset:
  size: null
  seed: 42
  per_dataset:
    DmfCostanzo2016Dataset: 2000000
  prefilter: {}
