# .pre-commit-config.yaml
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Linter (replaces flake8 + isort + pyupgrade); auto-fixes staged files.
      # Scope matches the CI gate (.github/workflows/style.yaml): the whole
      # torchcell/ + tests/ tree, plus experiments numbered >= 016. Experiments
      # <= 015 stay frozen for reproducibility and are not linted.
      - id: ruff-check
        args: [--fix]
        files: ^(torchcell|tests/torchcell|experiments/(01[6-9]|0[2-9][0-9]|[1-9][0-9][0-9])-)
      # Formatter (replaces black).
      - id: ruff-format
        files: ^(torchcell|tests/torchcell|experiments/(01[6-9]|0[2-9][0-9]|[1-9][0-9][0-9])-)

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.16.0
    hooks:
      - id: markdownlint-cli2
        args: [--fix]
        files: ^notes/.*\.md$

  - repo: local
    hooks:
      # Strict mypy in the torchcell conda env via scripts/run-mypy.sh (resolves the
      # env's mypy by $HOME-relative path, so it works whether or not the env is
      # PATH-activated, and matches the /mypy skill + CI interpreter -> no drift).
      # The wrapper passes --follow-imports=silent so reported errors are scoped to
      # the staged files (fix what you touch), not the deferred 7,666-error backlog.
      - id: mypy
        name: mypy (torchcell, strict)
        entry: bash scripts/run-mypy.sh
        language: system
        types_or: [python, pyi]
        files: ^(torchcell|tests)/
        require_serial: true

      # Anti-padding lint on the test suite (scripts/test_quality_check.py): a test with
      # no assertion, a parametrized truthiness-only sweep, or a torchcell call nothing
      # is asserted on fails the commit. Same script as `make test-quality` and CI.
      - id: test-quality
        name: test quality (anti-padding lint)
        entry: bash scripts/run-in-env.sh python scripts/test_quality_check.py
        language: system
        files: ^tests/.*/test_.*\.py$
        require_serial: true

      # Paired-test gate (scripts/check_paired_tests.py): a module added under torchcell/
      # ships tests/torchcell/<dir>/test_<name>.py, or an entry in pyproject
      # [tool.torchcell.test_exceptions]. Runs against the index vs origin/main's merge
      # base, so it sees the staged addition. Flips to --strict after the legacy move.
      - id: paired-tests
        name: paired tests (new torchcell modules ship a test)
        entry: bash scripts/run-in-env.sh python scripts/check_paired_tests.py
        language: system
        pass_filenames: false
        files: ^torchcell/.*\.py$
        require_serial: true

      # Schema-dependency gate: when a schema-surface file changes, report which dataset
      # loaders the change forces to rebuild (closure + contract-fingerprint scoped) and
      # block on a breaking change unless TORCHCELL_SCHEMA_ACK=1. Fires only on the surface
      # files so it never runs on ordinary commits. See torchcell/provenance/schema_impact.py.
      - id: schema-impact
        name: schema impact (dataset rebuild gate)
        entry: bash scripts/run-schema-impact.sh
        language: system
        pass_filenames: false
        files: ^torchcell/datamodels/(schema|pydant)\.py$
        require_serial: true

      # Ontology-figure gate: the schema-ontology artifacts are generated from the live
      # pydantic models, so they are never hand-maintained. When one of their inputs is
      # staged, regenerate, stage the result, and fail so the author sees that the figure
      # moved (the schematic is a paper figure; a layout that stops reading well is a
      # human call). `files` lists every input that can change the output: the four
      # introspected schema modules, the graph builder, the renderer, the driver, and the
      # palette/panel constants. CI re-checks the same thing in .github/workflows/docs.yaml
      # as a backstop for a commit made without hooks. See scripts/run-ontology-figure.sh.
      - id: ontology-figure
        name: ontology figure (regenerate from the schema)
        entry: bash scripts/run-ontology-figure.sh
        language: system
        pass_filenames: false
        # One line on purpose: a YAML folded scalar would join these with spaces and
        # silently break the alternation.
        files: ^(torchcell/datamodels/(schema|media|pydant|compound_identity)\.py|torchcell/paper/ontology_(graph|svg)\.py|torchcell/utils/utils\.py|paper/nature-biotech/scripts/generate_ontology_diagram\.py)$
        require_serial: true
