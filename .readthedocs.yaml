# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.13"

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/source/conf.py

# The docs requirements first, then this checkout itself (a regular, non-editable pip
# install; the config file has no editable option), so autodoc imports the local
# torchcell and not a PyPI release. conf.py also puts the checkout first on sys.path.
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
