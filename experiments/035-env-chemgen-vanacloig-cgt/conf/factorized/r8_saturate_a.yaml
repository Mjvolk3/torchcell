#
# Round 2 ran 20 epochs at prior weight 1 and its validation curve was still rising at
# the last step. The round-8 smoke (slurm 3071) measured the prior at 23,000 to 47,000
# against a data loss of 0.6 and a gradient norm of 7,000 to 8,500 under a clip of 10,
# so at weight 1 the task gradient is scaled down by about 700. Arms: layers in
