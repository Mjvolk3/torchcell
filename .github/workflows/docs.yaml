name: Build and Deploy Docs

on:
  push:
    branches:
      - main  # Change this to your default branch if different
  pull_request:
    branches:
      - main  # Change this to your default branch if different

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch + prebuilt torch-scatter wheel (no GPU on the runner, no
          # source build) so torchcell and its model modules import for autodoc.
          pip install "torch==2.11.0" --index-url https://download.pytorch.org/whl/cpu
          pip install torch-scatter -f https://data.pyg.org/whl/torch-2.11.0+cpu.html
          pip install -r docs/requirements.txt
          # Install the LOCAL torchcell (this checkout) so autodoc documents THIS repo,
          # not the ancient PyPI 0.2.6 release.
          pip install -e .

      - name: Render the ontology explorer
        run: |
          # Introspects the live pydantic schema, so the published map cannot lag the
          # code. html_extra_path copies _extra/ verbatim into the site root, putting
          # this at https://mjvolk3.github.io/torchcell/ontology/ -- the URL printed on
          # the ontology figures. A failure here is meant to break the build: it means
          # the schema no longer introspects.
          python paper/nature-biotech/scripts/generate_ontology_diagram.py \
            --explorer-only docs/source/_extra/ontology/index.html

      - name: Check the committed ontology SVGs have not drifted
        run: |
          # The explorer rendered above is regenerated every build, so it can never lag
          # the schema. The three SVGs under notes/assets/images/schema-ontology are
          # committed repo files, one of them is the paper figure, and nothing
          # regenerates them, so they go stale silently as torchcell.datamodels changes.
          # CI cannot fix that by committing back, but it can refuse to stay quiet.
          #
          # A byte comparison is safe here: these SVGs are built by string concatenation
          # with no matplotlib and no font measurement (label widths come from a fixed
          # character-ratio), so the render is deterministic given the schema.
          ASSET_IMAGES_DIR="$RUNNER_TEMP/ontology-drift" \
            python paper/nature-biotech/scripts/generate_ontology_diagram.py
          fresh="$RUNNER_TEMP/ontology-drift/schema-ontology"
          committed="notes/assets/images/schema-ontology"
          drift=0
          for f in torchcell-ontology-schematic torchcell-ontology-overview torchcell-ontology; do
            if cmp -s "$fresh/$f.svg" "$committed/$f.svg"; then
              echo "ok: $f.svg matches the current schema"
            else
              echo "::error file=$committed/$f.svg::$f.svg no longer matches a render of the current schema. Run 'python paper/nature-biotech/scripts/generate_ontology_diagram.py' and commit the result."
              drift=1
            fi
          done
          exit $drift

      - name: Build the documentation
        run: |
          sphinx-build -b html docs/source build/docs

      - name: Verify the explorer survived into the deploy tree
        run: |
          # The first deploy of this page rendered fine and still vanished: a
          # .gitignore living in docs/source/_extra was copied verbatim into the site
          # root by html_extra_path, and peaceiris/actions-gh-pages then honoured it
          # when staging, dropping ontology/index.html while the build log happily
          # reported it built. Fail loudly instead of publishing a 404.
          test -s build/docs/ontology/index.html
          if find build/docs -name '.gitignore' | grep -q .; then
            echo "::error::a .gitignore reached build/docs; it will silently exclude"
            echo "::error::files from the gh-pages deploy. Move the rule to the repo root."
            exit 1
          fi
          echo "ontology/index.html: $(wc -c < build/docs/ontology/index.html) bytes"

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Admin PAT (same one semantic-release uses): the default GITHUB_TOKEN is
          # read-only, so the gh-pages push 403s ("denied to github-actions[bot]").
          personal_token: ${{ secrets.TORCHCELL_SEMANTIC_RELEASE_TOKEN }}
          publish_dir: ./build/docs

  readthedocs:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Trigger Read the Docs Build
        env:
          RTD_PROJECT: ${{ secrets.RTD_PROJECT }} # Replace with your Read the Docs project name
          RTD_TOKEN: ${{ secrets.RTD_TOKEN }}     # Set this secret in your GitHub repository settings
        run: |
          curl -X POST -H "Authorization: token $RTD_TOKEN" https://readthedocs.org/api/v2/webhook/torchcell/272672/


          