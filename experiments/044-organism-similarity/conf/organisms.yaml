    groups: [mammal]
    source: ncbi
    accession: GCF_049350105.2
    accession_choice: NCBI reference assembly T2T-MMU8v2.0.
    justification: >-
      Peris's second anchor.

  - key: mmus_c57bl6j
    row: 33
    display: M. musculus C57BL/6J
    taxon_query: Mus musculus
    preferred_strain: C57BL/6J
    groups: [mammal]
    source: ncbi
    accession: GCF_000001635.27
    accession_choice: NCBI reference assembly GRCm39; it is the named strain C57BL/6J.
