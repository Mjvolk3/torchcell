# Round 14, GPU: two transformer layers over [compound token ; gene tokens] instead of
# one (env_layers: 2). With one layer a gene can take from the compound and from the other
# genes in the same step; with two, a gene can take from genes that have already taken from
# the compound, which is the hit-then-spread reading of a molecule as a Type I perturbation
# of the cell state. Otherwise the round-10 environment encoder: one-layer wildtype encoder,
# prior weight 0, fit on the non-test pool, fixed 50 epochs keeping the last, three seeds
# averaged, five folds on each of fold seeds 0, 1, 2 (123 compound-evaluations), paired
# against round 10. Split over two cards, PARALLEL=2 each.
# Card A: fold seed 0, and folds 0 to 2 of fold seed 2.
